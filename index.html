const walls=[];

function collision(
 x,z,w,d
){
 walls.push({
  x:x,
  z:z,
  w:w,
  d:d
 });
}

function blocked(x,z){

 const r=.8;

 return walls.some(c=>
  x>c.x-c.w/2-r &&
  x<c.x+c.w/2+r &&
  z>c.z-c.d/2-r &&
  z<c.z+c.d/2+r
 );
}

/* =====================================================
   SOM
===================================================== */

let audio=null;

function initAudio(){

 if(!audio){

  audio=
   new (
    window.AudioContext||
    window.webkitAudioContext
   )();
 }
}

function gunSound(){

 initAudio();

 const osc=
  audio.createOscillator();

 const gain=
  audio.createGain();

 osc.type="sawtooth";

 osc.frequency.value=
  weapons[weaponIndex].name==="SNIPER"
  ?120
  :220;

 gain.gain.setValueAtTime(
  .18,
  audio.currentTime
 );

 gain.gain.exponentialRampToValueAtTime(
  .001,
  audio.currentTime+.12
 );

 osc.connect(gain);
 gain.connect(audio.destination);

 osc.start();
 osc.stop(
  audio.currentTime+.12
 );
}


/* =====================================================
   JOYSTICK
===================================================== */

const joy=
 document.getElementById("joy");

const knob=
 document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(e){

 const r=
  joy.getBoundingClientRect();

 let dx=
  e.clientX-
  (r.left+r.width/2);

 let dy=
  e.clientY-
  (r.top+r.height/2);

 const max=42;

 const dist=
  Math.hypot(dx,dy);

 if(dist>max){

  dx=dx/dist*max;
  dy=dy/dist*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 knob.style.left=
  37+dx+"px";

 knob.style.top=
  37+dy+"px";
}

joy.onpointerdown=e=>{

 joyActive=true;

 joy.setPointerCapture(
  e.pointerId
 );

 moveJoy(e);
};

joy.onpointermove=e=>{

 if(joyActive)
  moveJoy(e);
};

joy.onpointerup=()=>{

 joyActive=false;

 joyX=0;
 joyY=0;

 knob.style.left="37px";
 knob.style.top="37px";
};


/* =====================================================
   OLHAR
===================================================== */

let look=false;
let lastX=0;
let lastY=0;

renderer.domElement
 .onpointerdown=e=>{

  look=true;

  lastX=e.clientX;
  lastY=e.clientY;
 };

renderer.domElement
 .onpointermove=e=>{

  if(!look)return;

  const dx=
   e.clientX-lastX;

  const dy=
   e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  player.angle-=dx*.004;
  player.pitch-=dy*.003;

  player.pitch=
   Math.max(
    -.9,
    Math.min(.9,player.pitch)
   );
 };

renderer.domElement
 .onpointerup=()=>{
  look=false;
 };

function updatePlayer(){

 const speed=
  running?.42:.20;

 const forward=
  -joyY;

 const side=
  joyX;

 const fx=
  -Math.sin(player.angle);

 const fz=
  -Math.cos(player.angle);

 const rx=
  Math.cos(player.angle);

 const rz=
  -Math.sin(player.angle);

 const nx=
  player.x+
  (fx*forward+rx*side)*speed;

 const nz=
  player.z+
  (fz*forward+rz*side)*speed;


 if(!blocked(nx,player.z))
  player.x=nx;

 if(!blocked(player.x,nz))
  player.z=nz;


 camera.position.set(
  player.x,
  player.y,
  player.z
 );

 camera.rotation.order="YXZ";

 camera.rotation.y=
  player.angle;

 camera.rotation.x=
  player.pitch;
}


/* =====================================================
   TIRO
===================================================== */

let firing=false;
let lastShot=0;

document.getElementById("fire")
 .onpointerdown=()=>{
  firing=true;
 };

document.getElementById("fire")
 .onpointerup=()=>{
  firing=false;
 };


function shoot(){

 const now=
  performance.now();

 const w=
  weapons[weaponIndex];

 if(
  now-lastShot<
  w.delay
 )
  return;

 lastShot=now;

 gunSound();


 /* recoil */

 weaponGroup.position.z=.16;
 weaponGroup.rotation.x=-.04;

 setTimeout(()=>{

  weaponGroup.position.z=0;
  weaponGroup.rotation.x=0;

 },60);


 /* flash */

 const flash=
  new THREE.PointLight(
   0xffa52b,
   12,
   9
  );

 flash.position.set(
  .48,
  -.38,
  -2.8
 );

 weaponGroup.add(flash);

 setTimeout(()=>{
  weaponGroup.remove(flash);
 },45);


 /* raio */

 const dir=
  new THREE.Vector3();

 camera.getWorldDirection(
  dir
 );

 const ray=
  new THREE.Raycaster(
   camera.position,
   dir,
   0,
   250
  );

 const targets=
  zombies.map(z=>z.mesh);

 const hits=
  ray.intersectObjects(
   targets,
   true
  );

 if(!hits.length)
  return;


 let obj=
  hits[0].object;

 let target=null;

 for(
  const z of zombies
 ){

  if(
   obj===z.mesh||
   z.mesh.getObjectById(
    obj.id
   )
  ){

   target=z;
   break;
  }
 }

 if(!target)
  return;


 target.hp-=w.damage;


 if(target.hp<=0){

  scene.remove(
   target.mesh
  );

  const i=
   zombies.indexOf(target);

  if(i>=0)
   zombies.splice(i,1);

  kills++;

  document.getElementById("kills")
   .textContent=kills;
 }
}


/* =====================================================
   ZUMBIS
===================================================== */

function updateZombies(){

 for(
  const z of zombies
 ){

  const dx=
   player.x-
   z.mesh.position.x;

  const dz=
   player.z-
   z.mesh.position.z;

  const dist=
   Math.hypot(dx,dz);

  if(dist>2.8){

   z.mesh.position.x+=
    dx/dist*z.speed;

   z.mesh.position.z+=
    dz/dist*z.speed;

   /*
    IMPORTANTE:
    somente gira no eixo Y.
    Nunca gira X ou Z.
   */

   z.mesh.rotation.set(
    0,
    Math.atan2(dx,dz),
    0
   );

   z.phase+=.18;

   const walk=
    Math.sin(z.phase)*.55;

   z.legs[0].rotation.x=
    walk;

   z.legs[1].rotation.x=
    -walk;

   z.arms[0].rotation.x=
    -walk*.5;

   z.arms[1].rotation.x=
    walk*.5;

  }else{

   /* SEM DEITAR */

   z.mesh.rotation.x=0;
   z.mesh.rotation.z=0;

   z.mesh.position.y=0;

   z.attack++;

   const arm=
    Math.sin(
     z.attack*.15
    )*.15;

   z.arms[0].rotation.x=
    -1+arm;

   z.arms[1].rotation.x=
    -1-arm;


   if(
    z.attack%75===0
   ){

    player.health-=6;

    document.getElementById("hp")
     .style.width=
      Math.max(
       0,
       player.health
      )+"%";

    const d=
     document.getElementById(
      "damage"
     );

    d.style.opacity=.55;

    setTimeout(()=>{
     d.style.opacity=0;
    },140);


    if(
     player.health<=0
    )
     gameOver();
   }
  }
 }
}


/* =====================================================
   TROCAR ARMA
===================================================== */

document.getElementById("switch")
 .onclick=()=>{

  weaponIndex++;

  if(
   weaponIndex>=
   weapons.length
  )
   weaponIndex=0;

  createWeapon();

  document.getElementById(
   "weapon"
  ).textContent=
   weapons[weaponIndex].name;
 };


/* =====================================================
   GAME OVER
===================================================== */

let dead=false;
let kills=0;

function gameOver(){

 if(dead)return;

 dead=true;

 document.getElementById(
  "finalKills"
 ).textContent=kills;

 document.getElementById(
  "gameover"
 ).style.display="flex";
}


/* =====================================================
   START
===================================================== */

let started=false;

document.getElementById("start")
 .onclick=()=>{

  started=true;

  document.getElementById("menu")
   .style.display="none";

  initAudio();
 };


/* =====================================================
   LOOP
===================================================== */

function animate(){

 requestAnimationFrame(
  animate
 );

 if(!started||dead)
  return;

 updatePlayer();

 updateZombies();

 if(firing)
  shoot();

 renderer.render(
  scene,
  camera
 );
}

animate();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
