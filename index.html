<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEWDARK FINAL</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#020405;color:#fff;
 font-family:Arial,sans-serif;
 touch-action:none
}
canvas{display:block;touch-action:none}

button{
 border:0;color:white;font-weight:bold;
 user-select:none;-webkit-user-select:none
}

#menu,#shop,#settings,#gameover{
 position:fixed;inset:0;z-index:100;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 35%,#26342f,#050707 60%,#000);
 text-align:center
}

.panel{
 width:min(92%,470px);
 max-height:92vh;
 overflow:auto;
 padding:28px 20px;
 background:#050707ed;
 border:1px solid #ffffff22;
 border-radius:24px;
 box-shadow:0 0 70px #000
}

.logo{
 font-size:44px;
 font-weight:900;
 letter-spacing:6px
}
.logo span{color:#d6323d}
.sub{color:#999;margin:7px 0 22px}

.main,.secondary{
 padding:15px 24px;
 border-radius:14px;
 margin:5px;
 font-size:17px
}
.main{background:#c72e38}
.secondary{background:#303634}

#shop,#settings,#gameover{display:none}

#hud{
 position:fixed;inset:0;z-index:10;
 pointer-events:none;
 text-shadow:2px 2px 5px #000
}

#status{
 position:absolute;
 top:12px;left:12px;
 background:#000b;
 padding:9px 11px;
 border-radius:12px;
 font-weight:bold
}

#healthBack{
 width:180px;height:10px;
 margin-top:5px;
 background:#391015;
 border-radius:10px;
 overflow:hidden
}

#health{
 width:100%;height:100%;
 background:#dc3542
}

#ammo{
 position:absolute;right:15px;top:10px;
 font-size:29px;font-weight:bold
}

#weapon{
 position:absolute;right:15px;top:48px;
 font-size:14px
}

#score{
 position:absolute;right:15px;top:69px;
 font-size:14px
}

#wave{
 position:absolute;right:15px;top:90px;
 font-size:14px
}

#coins{
 position:absolute;right:15px;top:111px;
 font-size:15px;font-weight:bold
}

#cross{
 position:absolute;
 left:50%;top:50%;
 transform:translate(-50%,-50%);

 font-weight:bold
}

#damage{

 background:#b0000040;
 opacity:0;
 pointer-events:none
}

#joy{

 left:18px;bottom:20px;
 width:140px;height:140px;
 border-radius:50%;
 border:2px solid #ffffff22;
 background:#ffffff08
}

#stick{
 position:absolute;
 left:50%;top:50%;
 width:58px;height:58px;
 border-radius:50%;
 background:#ffffff35;
 transform:translate(-50%,-50%)
}

.action{
 position:fixed;z-index:26;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 touch-action:none
}

#fire{
 right:18px;bottom:24px;
 width:100px;height:100px;
 background:#aa2933dd;
 font-size:25px
}

#jump{
 right:130px;bottom:28px;
 width:70px;height:70px;
 background:#315f8ddd;
 font-size:22px
}

#reload{
 right:130px;bottom:112px;
 width:65px;height:65px;
 background:#555c;
 font-size:24px
}

#swap{
 right:50px;bottom:128px;
 width:65px;height:65px;
 background:#333c;
 font-size:22px
}

#map{
 position:fixed;
 right:15px;top:140px;
 z-index:24;
 width:145px;height:145px;
 border:2px solid #ffffff44;
 border-radius:12px;
 background:#07100ddd;
 overflow:hidden
}

#mapCanvas{
 width:100%;height:100%
}

#gear{
 position:fixed;
 right:15px;bottom:15px;
 z-index:60;
 width:43px;height:43px;
 border-radius:12px;
 background:#111c;
 font-size:20px
}

.shopItem{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:12px;
 margin:8px 0;
 background:#111716;
 border-radius:13px;
 text-align:left
}

.shopItem button{
 background:#c72e38;
 padding:9px 13px;
 border-radius:9px
}

.locked{opacity:.5}

.setting{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 0;
 border-bottom:1px solid #ffffff12
}

#editor{
 position:fixed;inset:0;
 z-index:250;
 display:none;
 background:#0009
}

#editorInfo{
 position:absolute;
 top:10px;left:50%;
 transform:translateX(-50%);
 background:#000d;
 padding:9px 13px;
 border-radius:10px;
 white-space:nowrap
}

#editorBar{
 position:absolute;
 left:50%;bottom:12px;
 transform:translateX(-50%);
 background:#080a0bee;
 padding:9px;
 border-radius:15px;
 display:flex;gap:5px
}

#editorBar button{
 padding:9px 12px;
 background:#333;
 border-radius:9px
}

.editable{
 outline:2px dashed white!important
}

#rotate{
 display:none;
 position:fixed;inset:0;
 z-index:999;
 background:#030506;
 align-items:center;
 justify-content:center;
 text-align:center;
 font-size:22px;
 font-weight:bold;
 padding:30px
}

#scope{
 display:none;
 position:fixed;inset:0;
 z-index:28;
 pointer-events:none
}

.scopeCircle{
 position:absolute;
 left:50%;top:50%;
 width:min(70vw,420px);
 height:min(70vw,420px);
 transform:translate(-50%,-50%);
 border:2px solid #ffffffaa;
 border-radius:50%;
 box-shadow:0 0 0 100vmax #0008
}

.scopeLineH,.scopeLineV{
 position:absolute;
 background:#ffffff99
}
.scopeLineH{
 width:min(70vw,420px);height:1px;
 left:50%;top:50%;
 transform:translate(-50%,-50%)
}
.scopeLineV{
 width:1px;height:min(70vw,420px);
 left:50%;top:50%;
 transform:translate(-50%,-50%)
}

#weaponFlash{
 position:fixed;
 z-index:27;
 pointer-events:none;
 width:35px;height:35px;
 border-radius:50%;
 background:#fff5a8;
 box-shadow:0 0 30px #ff9b3d;
 opacity:0
}

@media(orientation:portrait){
 #rotate{display:flex}
}
</style>
</head>

<body>

  <button class="main" onclick="location.reload()">
   JOGAR NOVAMENTE

</div>

<div id="damage"></div>

<div id="hud">
 <div id="status">
  ❤️ <span id="hp">100</span>
  <div id="healthBack">
   <div id="health"></div>
  </div>
 </div>

 <div id="ammo">12 / 60</div>
 <div id="weapon">PISTOLA</div>

<div id="map">

<button class="action" id="fire">●</button>

<div id="scope">
 <div class="scopeCircle"></div>
 <div class="scopeLineH"></div>
 <div class="scopeLineV"></div>
</div>

<div id="weaponFlash"></div>

<div id="editor">
 <div id="editorInfo">
  Arraste os controles para onde quiser
 </div>
 <div id="editorBar">
  <button id="minus">−</button>
  <button id="plus">+</button>
  <button id="saveLayout">SALVAR</button>
  <button id="resetLayout">RESETAR</button>
  <button id="exitEditor">SAIR</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer,clock;
let started=false;
let gameEnded=false;

let zombies=[];
let particles=[];
let buildings=[];

let hp=100;
let score=0;
let wave=1;
let coins=Number(localStorage.getItem("ndCoins")||0);

let moveX=0;
let moveY=0;

let yaw=0;
let pitch=0;

let looking=false;
let lastX=0;
let lastY=0;

let velocityY=0;
let onGround=true;

let reloadBusy=false;
let lastShot=0;

let muzzleTimer=0;

const guns=[

 {
  id:"pistol",
  name:"PISTOLA",
  mag:12,
  ammo:12,
  reserve:72,
  damage:3,
  delay:320,
  spread:.012,
  sound:"pistol",
  owned:true
 },

 {
  id:"machine",
  name:"METRALHADORA",
  mag:35,
  ammo:35,
  reserve:140,
  damage:2,
  delay:95,
  spread:.025,
  sound:"machine",
  owned:false
 },

 {
  id:"sniper",
  name:"SNIPER",
  mag:5,
  ammo:5,
  reserve:25,
  damage:12,
  delay:1000,
  spread:.002,
  sound:"sniper",
  owned:false
 }

];

let gunIndex=0;
let gun=guns[0];

let owned=JSON.parse(
 localStorage.getItem("ndOwned")||
 '["pistol"]'
);

const store=[

 {
  id:"machine",
  name:"🔫 Metralhadora",
  price:150
 },

 {
  id:"sniper",
  name:"🎯 Sniper",
  price:300
 },

 {
  id:"skin1",
  name:"🧟 Skin Sombria",
  price:100
 },

 {
  id:"skin2",
  name:"☠️ Skin Caveira",
  price:200
 },

 {
  id:"hero",
  name:"👤 Personagem Elite",
  price:350
 }

];

const AudioContextClass=
 window.AudioContext||
 window.webkitAudioContext;

let audio=null;

function initAudio(){

 if(!audio){

  audio=new AudioContextClass();

 }

 if(audio.state==="suspended")
  audio.resume();

}

function gunSound(type){

 if(!audio)return;

 let now=audio.currentTime;

 let osc=audio.createOscillator();
 let gain=audio.createGain();

 let filter=audio.createBiquadFilter();

 filter.type="lowpass";

 if(type==="pistol"){

  osc.type="sawtooth";
  osc.frequency.setValueAtTime(125,now);
  osc.frequency.exponentialRampToValueAtTime(
   55,now+.12
  );

  gain.gain.setValueAtTime(.11,now);
  gain.gain.exponentialRampToValueAtTime(
   .001,now+.13
  );

  filter.frequency.value=1800;

 }

 else if(type==="machine"){

  osc.type="square";
  osc.frequency.setValueAtTime(165,now);
  osc.frequency.exponentialRampToValueAtTime(
   75,now+.075
  );

  gain.gain.setValueAtTime(.075,now);
  gain.gain.exponentialRampToValueAtTime(
   .001,now+.09
  );

  filter.frequency.value=2200;

 }

 else{

  osc.type="sawtooth";
  osc.frequency.setValueAtTime(75,now);
  osc.frequency.exponentialRampToValueAtTime(
   32,now+.28
  );

  gain.gain.setValueAtTime(.16,now);
  gain.gain.exponentialRampToValueAtTime(
   .001,now+.3
  );

  filter.frequency.value=1300;

 }

 osc.connect(filter);
 filter.connect(gain);
 gain.connect(audio.destination);

 osc.start(now);
 osc.stop(
  now+
  (type==="sniper"?".3":".14")
 );

}

function reloadSound(){

 if(!audio)return;

 let o=audio.createOscillator();
 let g=audio.createGain();

 o.type="square";
 o.frequency.value=180;

 g.gain.setValueAtTime(.035,audio.currentTime);
 g.gain.exponentialRampToValueAtTime(
  .001,
  audio.currentTime+.12
 );

 o.connect(g);
 g.connect(audio.destination);

 o.start();
 o.stop(audio.currentTime+.12);

}

function saveProgress(){

 localStorage.setItem(
  "ndCoins",
  coins
 );

 localStorage.setItem(
  "ndOwned",
  JSON.stringify(owned)
 );

}

function addCoins(n){

 coins+=n;

 saveProgress();
 updateHUD();

}

function mat(color){

 return new THREE.MeshStandardMaterial({
  color:color,
  roughness:.8
 });

}

function box(w,h,d,color){

 let m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(color)
 );

 m.castShadow=true;
 m.receiveShadow=true;

 return m;

}

function createLighting(){

 scene.add(
  new THREE.HemisphereLight(
   0x9db1c4,
   0x030505,
   1.05
  )
 );

 let moon=
  new THREE.DirectionalLight(
   0xb9caff,
   1.7
  );

 moon.position.set(
  -35,55,-30
 );

 moon.castShadow=true;

 moon.shadow.mapSize.width=1024;
 moon.shadow.mapSize.height=1024;

 scene.add(moon);

}

function createWorld(){

 let ground=new THREE.Mesh(
  new THREE.PlaneGeometry(220,220),
  mat(0x141917)
 );

 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;

 scene.add(ground);

 let roadMat=mat(0x0e1110);

 let r1=new THREE.Mesh(
  new THREE.PlaneGeometry(18,220),
  roadMat
 );

 r1.rotation.x=-Math.PI/2;
 r1.position.y=.01;

 scene.add(r1);

 let r2=new THREE.Mesh(
  new THREE.PlaneGeometry(220,18),
  roadMat
 );

 r2.rotation.x=-Math.PI/2;
 r2.position.y=.012;

 scene.add(r2);

 for(let i=0;i<38;i++){

  let w=5+Math.random()*8;
  let d=5+Math.random()*8;
  let h=5+Math.random()*9;

  let x=(Math.random()-.5)*145;
  let z=(Math.random()-.5)*145;

  if(
   Math.abs(x)<15||
   Math.abs(z)<15
  ){

   i--;
   continue;

  }

  let b=box(
   w,h,d,
   [0x303532,0x393b39,0x292d2b,0x42413d][i%4]
  );

  b.position.set(
   x,h/2,z
  );

  scene.add(b);

  buildings.push({
   x,z,w,d
  });

  /*
   JANELAS EM TODAS AS FACHADAS
  */

  for(
   let yy=1.5;
   yy<h-.5;
   yy+=1.7
  ){

   for(
    let xx=-w*.3;
    xx<=w*.3;
    xx+=1.15
   ){

    let win=box(
     .55,.65,.045,
     Math.random()>.3
      ?0xcaa354
      :0x101820
    );

    win.position.set(
     x+xx,
     yy,
     z-d/2-.03
    );

    scene.add(win);

    let win2=box(
     .045,.65,.55,
     Math.random()>.3
      ?0xcaa354
      :0x101820
    );

    win2.position.set(
     x+w/2+.03,
     yy,
     z+xx
    );

    scene.add(win2);

   }

  }

  let door=box(
   1.1,1.9,.08,
   0x171817
  );

  door.position.set(
   x,.95,z-d/2-.05
  );

  scene.add(door);

 }

 /*
  POSTES
 */

 for(let i=0;i<24;i++){

  let x=(Math.random()-.5)*160;
  let z=(Math.random()-.5)*160;

  let pole=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .07,.1,5,8
   ),
   mat(0x202322)
  );

  pole.position.set(x,2.5,z);

  scene.add(pole);

  let light=new THREE.PointLight(
   0xffb45f,
   2.1,
   15
  );

  light.position.set(
   x,5,z
  );

  scene.add(light);

 }

 /*
  CARROS
 */

 for(let i=0;i<12;i++){

  let car=box(
   2.3,.65,4.3,
   [0x253139,0x432b2d,0x3d3d32,0x202628][i%4]
  );

  car.position.set(
   (Math.random()-.5)*115,
   .38,
   (Math.random()-.5)*115
  );

  car.rotation.y=
   Math.random()*Math.PI;

  scene.add(car);

 }

}

function createWeapon(){

 let old=
  camera.getObjectByName("WEAPON");

 if(old)
  camera.remove(old);

 let group=new THREE.Group();

 group.name="WEAPON";

 let scale=
  gunIndex===2?1.25:
  gunIndex===1?1.1:1;

 let body=box(
  .28*scale,
  .24*scale,
  .9*scale,
  gunIndex===0
   ?0x252525
   :gunIndex===1
   ?0x15191a
   :0x22201e
 );

 body.position.set(
  .4,-.3,-.75
 );

 group.add(body);

 let barrelLength=
  gunIndex===2?1.05:
  gunIndex===1?.75:.58;

 let barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .045,.055,
   barrelLength,
   12
  ),
  mat(0x050505)
 );

 barrel.rotation.x=Math.PI/2;

 barrel.position.set(
  .4,
  -.29,
  -.75-barrelLength/2
 );

 group.add(barrel);

 /*
  MIRA DA SNIPER
 */

 if(gunIndex===2){

  let scope=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .055,.055,.38,12
   ),
   mat(0x111111)
  );

  scope.rotation.x=Math.PI/2;

  scope.position.set(
   .4,-.13,-.72
  );

  group.add(scope);

 }

 let grip=box(
  .15,.38,.2,
  0x111111
 );

 grip.position.set(
  .4,-.5,-.52
 );

 group.add(grip);

 camera.add(group);

 scene.add(camera);

}

function createZombie(){

 let z=new THREE.Group();

 let skin=[
  0x4b564e,
  0x596158,
  0x454d48,
  0x6b6559
 ][Math.floor(Math.random()*4)];

 /*
  ZUMBI MAGRO
 */

 let torso=box(
  .55,.9,.32,skin
 );

 torso.position.y=1.05;

 z.add(torso);

 /*
  PESCOÇO
 */

 let neck=box(
  .15,.18,.15,skin
 );

 neck.position.y=1.58;

 z.add(neck);

 /*
  CABEÇA
 */

 let head=new THREE.Mesh(
  new THREE.SphereGeometry(
   .29,16,12
  ),
  mat(skin)
 );

 head.scale.set(
  .85,1.15,.85
 );

 head.position.y=1.83;

 z.add(head);

 /*
  OLHOS
 */

 let eyeMat=
  new THREE.MeshBasicMaterial({
   color:0xff1515
  });

 for(let x of[-.10,.10]){

  let eye=new THREE.Mesh(
   new THREE.SphereGeometry(
    .035,8,8
   ),
   eyeMat
  );

  eye.position.set(
   x,1.85,-.255
  );

  z.add(eye);

 }

 /*
  BRAÇOS LONGOS
 */

 for(let x of[-.43,.43]){

  let arm=new THREE.Group();

  let upper=box(
   .11,.48,.11,skin
  );

  upper.position.y=-.24;

  arm.add(upper);

  let hand=box(
   .13,.18,.13,skin
  );

  hand.position.y=-.55;

  arm.add(hand);

  arm.position.set(
   x,1.32,0
  );

  arm.rotation.z=
   x<0?.25:-.25;

  z.add(arm);

  arm.userData.arm=true;

 }

 /*
  PERNAS FINAS
 */

 for(let x of[-.17,.17]){

  let leg=box(
   .13,.7,.14,
   0x242a28
  );

  leg.position.set(
   x,.43,0
  );

  z.add(leg);

 }

 let angle=
  Math.random()*Math.PI*2;

 let distance=
  30+Math.random()*55;

 z.position.set(
  camera.position.x+
   Math.cos(angle)*distance,
  0,
  camera.position.z+
   Math.sin(angle)*distance
 );

 z.userData={
  hp:6+Math.floor(wave*.7),
  speed:1.05+
   Math.random()*1.25+
   wave*.045,
  attack:0,
  anim:Math.random()*Math.PI*2
 };

 scene.add(z);

 zombies.push(z);

}

function blood(pos){

 for(let i=0;i<8;i++){

  let p=new THREE.Mesh(
   new THREE.SphereGeometry(
    .02+Math.random()*.035,
    5,5
   ),
   new THREE.MeshBasicMaterial({
    color:0x9e1118
   })
  );

  p.position.copy(pos);

  p.userData={
   life:.3+Math.random()*.5,
   vx:(Math.random()-.5)*3,
   vy:.5+Math.random()*2.5,
   vz:(Math.random()-.5)*3
  };

  scene.add(p);

  particles.push(p);

 }

}

function muzzleFlash(){

 let f=
  document.getElementById(
   "weaponFlash"
  );

 f.style.left=
  (innerWidth*.5+35)+"px";

 f.style.top=
  (innerHeight*.5+25)+"px";

 f.style.opacity="1";

 clearTimeout(muzzleTimer);

 muzzleTimer=setTimeout(
  ()=>f.style.opacity="0",
  55
 );

}

function shoot(){

 if(
  !camera||
  reloadBusy||
  gameEnded
 )return;

 let now=performance.now();

 if(
  now-lastShot<
  gun.delay
 )return;

 lastShot=now;

 if(gun.ammo<=0){

  reload();

  return;

 }

 initAudio();

 gun.ammo--;

 gunSound(gun.sound);

 muzzleFlash();

 /*
  RECUO
 */

 let kick=
  gunIndex===2?.035:
  gunIndex===1?.012:.018;

 camera.rotation.x+=kick;

 setTimeout(
  ()=>{
   if(camera)
    camera.rotation.x-=kick*.7;
  },
  45
 );

 /*
  SNIPER ABRE MIRA
 */

 if(gunIndex===2){

  document.getElementById(
   "scope"
  ).style.display="block";

 }

 let ray=new THREE.Raycaster();

 /*
  PEQUENA DISPERSÃO
 */

 let sx=
  (Math.random()-.5)*
  gun.spread;

 let sy=
  (Math.random()-.5)*
  gun.spread;

 ray.setFromCamera(
  new THREE.Vector2(sx,sy),
  camera
 );

 let targets=[];

 zombies.forEach(z=>{

  z.traverse(o=>{

   if(o.isMesh)
    targets.push(o);

  });

 });

 let hits=
  ray.intersectObjects(
   targets,
   false
  );

 if(hits.length){

  let root=hits[0].object;

  while(
   root.parent&&
   !zombies.includes(root)
  ){

   root=root.parent;

  }

  if(zombies.includes(root)){

   /*
    HEADSHOT
   */

   let damage=gun.damage;

   if(
    hits[0].object.position.y>
    1.65
   ){

    damage*=2;

   }

   blood(hits[0].point);

   root.userData.hp-=damage;

   if(root.userData.hp<=0){

    blood(
     root.position.clone()
      .add(
       new THREE.Vector3(0,1,0)
      )
    );

    scene.remove(root);

    zombies=
     zombies.filter(
      x=>x!==root
     );

    score++;

    addCoins(
     gunIndex===2?10:5
    );

    if(score%8===0)
     wave++;

   }

  }

 }

 updateHUD();

}

function reload(){

 if(
  reloadBusy||
  gun.ammo>=gun.mag||
  gun.reserve<=0
 )return;

 reloadBusy=true;

 initAudio();
 reloadSound();

 updateHUD();

 setTimeout(
  ()=>{
   let need=
    gun.mag-gun.ammo;

   let take=
    Math.min(
     need,
     gun.reserve
    );

   gun.ammo+=take;
   gun.reserve-=take;

   reloadBusy=false;

   updateHUD();

  },
  gunIndex===2?1400:850
 );

}

function changeWeapon(){

 if(reloadBusy)return;

 /*
  procura a próxima arma desbloqueada
 */

 for(let i=1;i<=guns.length;i++){

  let next=
   (gunIndex+i)%guns.length;

  if(
   guns[next].owned||
   owned.includes(
    guns[next].id
   )
  ){

   gunIndex=next;

   break;

  }

 }

 gun=guns[gunIndex];

 document.getElementById(
  "scope"
 ).style.display=
  gunIndex===2
  ?"block":"none";

 createWeapon();

 updateHUD();

}

function jump(){

 if(
  !started||
  gameEnded||
  !onGround
 )return;

 velocityY=6.4;
 onGround=false;

}

function updateZombieAnimation(z,dt){

 z.userData.anim+=dt*7;

 let a=Math.sin(
  z.userData.anim
 )*.28;

 z.children.forEach(o=>{

  if(
   o.userData&&
   o.userData.arm
  ){

   o.rotation.x=a;

  }

 });

}

function update(dt){

 if(!camera)return;

 /*
  MOVIMENTO CORRIGIDO
 */

 let speed=5.5;

 /*
  direção para frente baseada no YAW
 */

 let forwardX=
  -Math.sin(yaw);

 let forwardZ=
  -Math.cos(yaw);

 let rightX=
  Math.cos(yaw);

 let rightZ=
  -Math.sin(yaw);

 let dx=
  forwardX*(-moveY)+
  rightX*moveX;

 let dz=
  forwardZ*(-moveY)+
  rightZ*moveX;

 let len=Math.hypot(dx,dz);

 if(len>1){

  dx/=len;
  dz/=len;

 }

 camera.position.x+=
  dx*speed*dt;

 camera.position.z+=
  dz*speed*dt;

 /*
  PULO
 */

 velocityY-=15*dt;

 camera.position.y+=
  velocityY*dt;

 if(camera.position.y<=1.7){

  camera.position.y=1.7;
  velocityY=0;
  onGround=true;

 }

 /*
  ZUMBIS
 */

 for(let z of zombies){

  let dx=
   camera.position.x-
   z.position.x;

  let dz=
   camera.position.z-
   z.position.z;

  let dist=
   Math.hypot(dx,dz);

  if(dist>1.55){

   z.position.x+=
    dx/dist*
    z.userData.speed*
    dt;

   z.position.z+=
    dz/dist*
    z.userData.speed*
    dt;

   updateZombieAnimation(
    z,dt
   );

  }
  else{

   z.userData.attack-=dt;

   if(z.userData.attack<=0){

    hp-=7;

    z.userData.attack=.75;

    let d=
     document.getElementById(
      "damage"
     );

    d.style.opacity="1";

    setTimeout(
     ()=>d.style.opacity="0",
     100
    );

    if(hp<=0){

     hp=0;

     gameOver();

    }

   }

  }

  z.lookAt(
   camera.position.x,
   z.position.y,
   camera.position.z
  );

 }

 /*
  LIMITE PARA EVITAR TRAVAMENTO
 */

 let maxZombies=
  Math.min(
   18,
   5+wave*2
  );

 while(
  zombies.length<
  maxZombies
 ){

  createZombie();

 }

 /*
  PARTICULAS
 */

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  let p=particles[i];

  p.userData.life-=dt;

  p.position.x+=
   p.userData.vx*dt;

  p.position.y+=
   p.userData.vy*dt;

  p.position.z+=
   p.userData.vz*dt;

  p.userData.vy-=7*dt;

  if(
   p.userData.life<=0
  ){

   scene.remove(p);

   particles.splice(i,1);

  }

 }

 updateHUD();
 drawMap();

}

function updateHUD(){

 document.getElementById(
  "hp"
 ).textContent=
  Math.max(
   0,
   Math.floor(hp)
  );

 document.getElementById(
  "health"
 ).style.width=
  Math.max(0,hp)+"%";

 document.getElementById(
  "ammo"
 ).textContent=
  reloadBusy
   ?"RECARREGANDO..."
   :gun.ammo+
    " / "+
    gun.reserve;

 document.getElementById(
  "weapon"
 ).textContent=
  gun.name;

 document.getElementById(
  "score"
 ).textContent=
  "Abates: "+score;

 document.getElementById(
  "wave"
 ).textContent=
  "Onda: "+wave;

 document.getElementById(
  "coins"
 ).textContent=
  "🪙 "+coins;

 document.getElementById(
  "shopCoins"
 ).textContent=
  coins;

}

function drawMap(){

 let c=
  document.getElementById(
   "mapCanvas"
  );

 let ctx=c.getContext("2d");

 let w=c.width;
 let h=c.height;

 ctx.clearRect(
  0,0,w,h
 );

 ctx.fillStyle="#07100d";

 ctx.fillRect(
  0,0,w,h
 );

 /*
  ruas
 */

 ctx.strokeStyle="#252d29";
 ctx.lineWidth=5;

 ctx.beginPath();

 ctx.moveTo(w/2,0);
 ctx.lineTo(w/2,h);

 ctx.moveTo(0,h/2);
 ctx.lineTo(w,h/2);

 ctx.stroke();

 /*
  prédios
 */

 let scale=.7;

 ctx.strokeStyle="#3d4541";
 ctx.lineWidth=1;

 for(let b of buildings){

  let x=
   w/2+
   (b.x-camera.position.x)*
   scale;

  let y=
   h/2+
   (b.z-camera.position.z)*
   scale;

  if(
   x>-15&&
   x<w+15&&
   y>-15&&
   y<h+15
  ){

   ctx.strokeRect(
    x-b.w*scale/2,
    y-b.d*scale/2,
    b.w*scale,
    b.d*scale
   );

  }

 }

 /*
  zumbis
 */

 ctx.fillStyle="#ff3038";

 for(let z of zombies){

  let x=
   w/2+
   (z.position.x-camera.position.x)*
   scale;

  let y=
   h/2+
   (z.position.z-camera.position.z)*
   scale;

  if(
   x>=0&&
   x<=w&&
   y>=0&&
   y<=h
  ){

   ctx.beginPath();

   ctx.arc(
    x,y,3,0,Math.PI*2
   );

   ctx.fill();

  }

 }

 /*
  jogador
 */

 ctx.fillStyle="#42e6ff";

 ctx.beginPath();

 ctx.arc(
  w/2,
  h/2,
  5,
  0,
  Math.PI*2
 );

 ctx.fill();

}

function gameOver(){

 if(gameEnded)return;

 gameEnded=true;

 document.getElementById(
  "scope"
 ).style.display="none";

 saveProgress();

 document.getElementById(
  "finalText"
 ).textContent=
  "Abates: "+score+
  " • Onda: "+wave+
  " • Moedas: "+coins;

 document.getElementById(
  "gameover"
 ).style.display="flex";

}

function startGame(){

 if(started)return;

 started=true;

 initAudio();

 scene=new THREE.Scene();

 scene.background=
  new THREE.Color(
   0x05090b
  );

 scene.fog=new THREE.Fog(
  0x05090b,
  18,
  120
 );

 camera=
  new THREE.PerspectiveCamera(
   68,
   innerWidth/innerHeight,
   .05,
   250
  );

 camera.position.set(
  0,1.7,8
 );

 camera.rotation.order="YXZ";

 renderer=
  new THREE.WebGLRenderer({
   antialias:true,
   powerPreference:
    "high-performance"
  });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(
   devicePixelRatio,
   +document.getElementById(
    "quality"
   ).value
  )
 );

 renderer.shadowMap.enabled=true;

 document.body.appendChild(
  renderer.domElement
 );

 clock=new THREE.Clock();

 hp=100;
 score=0;
 wave=1;

 gunIndex=0;
 gun=guns[0];

 reloadBusy=false;
 gameEnded=false;

 createLighting();
 createWorld();
 createWeapon();

 for(let i=0;i<7;i++)
  createZombie();

 document.getElementById(
  "menu"
 ).style.display="none";

 updateHUD();

 requestAnimationFrame(loop);

}

function loop(){

 if(!started)return;

 requestAnimationFrame(loop);

 let dt=Math.min(
  clock.getDelta(),
  .04
 );

 if(!gameEnded)
  update(dt);

 renderer.render(
  scene,
  camera
 );

}

/*
 JOYSTICK
 */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

let joyActive=false;

joy.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  joyActive=true;

  joy.setPointerCapture(
   e.pointerId
  );

  moveJoystick(e);

 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  if(joyActive)
   moveJoystick(e);

 }
);

joy.addEventListener(
 "pointerup",
 ()=>{

  joyActive=false;

  moveX=0;
  moveY=0;

  stick.style.transform=
   "translate(-50%,-50%)";

 }
);

function moveJoystick(e){

 let r=
  joy.getBoundingClientRect();

 let x=
  e.clientX-
  (r.left+r.width/2);

 let y=
  e.clientY-
  (r.top+r.height/2);

 let limit=44;

 let d=Math.hypot(x,y);

 if(d>limit){

  x=x/d*limit;
  y=y/d*limit;

 }

 moveX=x/limit;

 /*
  IMPORTANTE:
  aqui o eixo vertical fica normal.
  cima = valor negativo,
  e no movimento é convertido
  para frente.
 */

 moveY=y/limit;

 stick.style.transform=
  `translate(
   calc(-50% + ${x}px),
   calc(-50% + ${y}px)
  )`;

}

/*
 CAMERA
 */

document.addEventListener(
 "pointerdown",
 e=>{

  if(!camera)return;

  if(
   e.target.closest("button")||
   e.target.closest("#joy")||
   e.target.closest("#map")
  )
   return;

  if(e.clientX<175)
   return;

  looking=true;

  lastX=e.clientX;
  lastY=e.clientY;

 }
);

document.addEventListener(
 "pointermove",
 e=>{

  if(
   !looking||
   !camera
  )
   return;

  let dx=
   e.clientX-lastX;

  let dy=
   e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  let sens=
   +document.getElementById(
    "sensitivity"
   ).value;

  yaw-=dx*sens;

  pitch-=dy*sens*.78;

  pitch=Math.max(
   -1,
   Math.min(1,pitch)
  );

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

 }
);

document.addEventListener(
 "pointerup",
 ()=>looking=false
);

 BOTÕES
 */

document.getElementById(
 "start"
).onclick=startGame;

document.getElementById(
 "fire"
).addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  shoot();
 }
);

 "jump"
).onclick=jump;

).onclick=reload;

).onclick=changeWeapon;

/*
 LOJA
 */

function renderShop(){

 let list=
  document.getElementById(
   "shopList"
  );

 list.innerHTML="";

 store.forEach(item=>{

  let bought=
   owned.includes(item.id);

  let div=
   document.createElement("div");

  div.className=
   "shopItem"+
   (bought?" locked":"");

  div.innerHTML=`
   <div>
    <b>${item.name}</b><br>
    <small>
     ${bought
      ?"DESBLOQUEADO"
      :"🪙 "+item.price}
    </small>
   </div>

   <button
    data-id="${item.id}"
    ${bought?"disabled":""}>
    ${bought?"✓":"COMPRAR"}
   </button>
  `;

  list.appendChild(div);

 });

 list.querySelectorAll(
  "button[data-id]"
 ).forEach(btn=>{

  btn.onclick=()=>{

   let item=
    store.find(
     x=>x.id===btn.dataset.id
    );

   if(!item)return;

   if(coins<item.price){

    alert(
     "Você não tem moedas suficientes."
    );

    return;

   }

   coins-=item.price;

   owned.push(item.id);

   /*
    libera arma
   */

   if(item.id==="machine"){

    guns[1].owned=true;

   }

   if(item.id==="sniper"){

    guns[2].owned=true;

   }

   saveProgress();

   renderShop();
   updateHUD();

  };

 });

}

guns.forEach(g=>{

 if(
  owned.includes(g.id)
 )
  g.owned=true;

});

document.getElementById(
 "openShop"
).onclick=()=>{

 renderShop();

 document.getElementById(
  "menu"
 ).style.display="none";

 document.getElementById(
  "shop"
 ).style.display="flex";

};

document.getElementById(
 "closeShop"
).onclick=()=>{

 document.getElementById(
  "shop"
 ).style.display="none";

 document.getElementById(
  "menu"
 ).style.display="flex";

};

 CONFIGURAÇÕES
 */

).onclick=()=>{

 document.getElementById(

 ).style.display="none";

 document.getElementById(

 if(!started){

/*
 EDITOR DE CONTROLES
 */

const editableIds=[
 "joy",
 "fire",
 "jump",
 "reload",
 "swap",
 "map",
 "gear"
];

let selected=null;
let dragging=null;

function loadLayout(){

 let data=
  localStorage.getItem(
   "ndLayout"
  );

 if(!data)return;

 try{

  let o=JSON.parse(data);

  editableIds.forEach(id=>{

   if(!o[id])return;

   let e=
    document.getElementById(id);

   e.style.left=o[id].left;
   e.style.top=o[id].top;

   e.style.right="auto";
   e.style.bottom="auto";

  });

 }catch(e){}

}

function saveLayout(){

 let data={};

 editableIds.forEach(id=>{

  let e=
   document.getElementById(id);

  let r=
   e.getBoundingClientRect();

  data[id]={
   left:r.left+"px",
   top:r.top+"px"
  };

 });

 localStorage.setItem(
  "ndLayout",
  JSON.stringify(data)
 );

}

loadLayout();

document.getElementById(
 "editControls"
).onclick=()=>{

 document.getElementById(
  "settings"
 ).style.display="none";

 document.getElementById(
  "editor"
 ).style.display="block";

 editableIds.forEach(id=>
  document.getElementById(id)
   .classList.add("editable")
 );

};

editableIds.forEach(id=>{

 let e=
  document.getElementById(id);

 e.addEventListener(
  "pointerdown",
  ev=>{

   if(
    document.getElementById(
     "editor"
    ).style.display!=="block"
   )
    return;

   ev.stopPropagation();

   selected=e;

   let r=
    e.getBoundingClientRect();

   dragging={
    x:ev.clientX-r.left,
    y:ev.clientY-r.top
   };

   e.setPointerCapture(
    ev.pointerId
   );

  }
 );

 e.addEventListener(
  "pointermove",
  ev=>{

   if(
    !dragging||
    selected!==e
   )
    return;

   e.style.left=
    (ev.clientX-dragging.x)+"px";

   e.style.top=
    (ev.clientY-dragging.y)+"px";

   e.style.right="auto";
   e.style.bottom="auto";

  }
 );

 e.addEventListener(
  "pointerup",
  ()=>dragging=null
 );

});

function resizeSelected(amount){

 if(!selected)return;

 let r=
  selected.getBoundingClientRect();

 let size=Math.max(
  40,
  Math.min(
   180,
   r.width+amount
  )
 );

 selected.style.width=
  size+"px";

 if(selected.id!=="map")
  selected.style.height=
   size+"px";

}

document.getElementById(
 "minus"
).onclick=
 ()=>resizeSelected(-10);

document.getElementById(
 "plus"
).onclick=
 ()=>resizeSelected(10);

document.getElementById(
 "saveLayout"
).onclick=saveLayout;

document.getElementById(
 "resetLayout"
).onclick=()=>{

 localStorage.removeItem(
  "ndLayout"
 );

 location.reload();

};

document.getElementById(
 "exitEditor"
).onclick=()=>{

 saveLayout();

 document.getElementById(
  "editor"
 ).style.display="none";

 editableIds.forEach(id=>
  document.getElementById(id)
   .classList.remove("editable")
 );

};

/*
 RESIZE
 */

addEventListener(
 "resize",
 ()=>{

  if(!camera||!renderer)
   return;

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

  renderer.setPixelRatio(
   Math.min(
    devicePixelRatio,
    +document.getElementById(
     "quality"
    ).value
   )
  );

 }
);

updateHUD();

</script>
