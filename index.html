/* =========================
   SOM
========================= */

let audioCtx=null;

function sound(
freq,
duration=.08,
type="square"
){

if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

const o=
audioCtx.createOscillator();

const g=
audioCtx.createGain();

o.type=type;
o.frequency.value=freq;

g.gain.setValueAtTime(
.16,
audioCtx.currentTime
);

g.gain.exponentialRampToValueAtTime(
.001,
audioCtx.currentTime+
duration
);

o.connect(g);
g.connect(audioCtx.destination);

o.start();

o.stop(
audioCtx.currentTime+
duration
);

}

function weaponSound(){

}

e.clientX-
(r.left+r.width/2);

let dy=
e.clientY-
(r.top+r.height/2);

const max=42;

const dist=
Math.hypot(dx,dy);

if(dist>max){

dx=dx/dist*max;
dy=dy/dist*max;

}

joyX=dx/max;
joyY=dy/max;

knob.style.left=
37+dx+"px";

knob.style.top=
37+dy+"px";

}

joy.onpointerdown=
e=>{

joyActive=true;

joy.setPointerCapture(
e.pointerId
);

moveJoy(e);

};

joy.onpointermove=
e=>{

if(joyActive)
moveJoy(e);

};

joy.onpointerup=
()=>{

joyActive=false;

joyX=0;
joyY=0;

knob.style.left="37px";
knob.style.top="37px";

};


/* =========================
   CÂMERA
========================= */

let look=false;
let lx=0;
let ly=0;

renderer.domElement.onpointerdown=
e=>{

look=true;
lx=e.clientX;
ly=e.clientY;

};

renderer.domElement.onpointermove=
e=>{

if(!look)return;

const dx=
e.clientX-lx;

const dy=
e.clientY-ly;

lx=e.clientX;
ly=e.clientY;

player.angle-=
dx*.004;

player.pitch-=
dy*.003;

player.pitch=
Math.max(
-1.1,
Math.min(
1.1,
player.pitch
)
);

};

renderer.domElement.onpointerup=
()=>look=false;


/* =========================
   CORRER
========================= */

let running=false;

document.getElementById(
"run"
).onpointerdown=
()=>{

running=!running;

};


/* =========================
   MOVIMENTO
========================= */

function updatePlayer(){

const speed=
running?.23:.12;

const forward=
-joyY;

const side=
joyX;

const fx=
-Math.sin(
player.angle
);

const fz=
-Math.cos(
player.angle
);

const rx=
Math.cos(
player.angle
);

const rz=
-Math.sin(
player.angle
);

const nx=
player.x+
(
fx*forward+
rx*side
)*speed;

const nz=
player.z+
(
fz*forward+
rz*side
)*speed;

if(
!blocked(nx,player.z)
)
player.x=nx;

if(
!blocked(player.x,nz)
)
player.z=nz;

camera.position.set(
player.x,
player.y,
player.z
);

camera.rotation.y=
player.angle;

camera.rotation.x=
player.pitch;

}


/* =========================
   PORTAS
========================= */

function updateDoors(){

for(
const d of doors
){

const dist=
Math.hypot(
player.x-d.x,
player.z-d.z
);

if(
dist<4 &&
!d.open
){

d.mesh.rotation.y=
-Math.PI/2;

d.open=true;

}

}

}


/* =========================
   TROCAR ARMA
========================= */

document.getElementById(
"switch"
).onclick=
()=>{

weaponIndex++;

if(
weaponIndex>=weapons.length
)
weaponIndex=0;

createGun();

document.getElementById(
"weapon"
).textContent=
weapons[weaponIndex].name;

const sniper=
weaponIndex===4;

document.getElementById(
"aim"
).style.display=
sniper?"block":"none";

document.getElementById(
"zoomBtn"
).style.display=
sniper?"block":"none";

camera.fov=72;

camera.updateProjectionMatrix();

};


/* =========================
   MIRA
========================= */

document.getElementById(
"aim"
).onclick=
()=>{

if(
weaponIndex!==4
)return;

aiming=!aiming;

document.getElementById(
"cross"
).style.display=
aiming?"none":"block";

camera.fov=
aiming?45:72;

camera.updateProjectionMatrix();

};


/* =========================
   ZOOM
========================= */

document.getElementById(
"zoomBtn"
).onclick=
()=>{

if(!aiming)return;

zoomLevel++;

if(zoomLevel>3)
zoomLevel=1;

camera.fov=
zoomLevel===1?45:
zoomLevel===2?32:22;

camera.updateProjectionMatrix();

};


/* =========================
   TIRO
========================= */

let firing=false;
let lastShot=0;

document.getElementById(
"fire"
).onpointerdown=
()=>firing=true;

document.getElementById(
"fire"
).onpointerup=
()=>firing=false;


function shoot(){

const now=
performance.now();

const w=
weapons[weaponIndex];

if(
now-lastShot<w.delay
)
return;

lastShot=now;

weaponSound();


/* recuo */

weaponGroup.position.z=.13;

setTimeout(
()=>{
weaponGroup.position.z=0;
},
55
);


/* flash */

const flash=
new THREE.PointLight(
0xff9d30,
18,
9
);

flash.position.set(
.43,-.35,-2
);

weaponGroup.add(flash);

setTimeout(
()=>{
weaponGroup.remove(flash);
},
40
);


/* raio */

const direction=
new THREE.Vector3();

camera.getWorldDirection(
direction
);

const ray=
new THREE.Raycaster(
camera.position.clone(),
direction,
0,
250
);

const hits=
ray.intersectObjects(
zombies.map(z=>z.mesh),
true
);

if(
hits.length
){

const obj=
hits[0].object;

const z=
zombies.find(z=>
z.mesh===obj ||
z.mesh.children.includes(obj) ||
z.mesh.getObjectById(obj.id)
);

if(z){

z.hp-=w.damage;

blood(
hits[0].point
);

if(
z.hp<=0
){

scene.remove(
z.mesh
);

zombies.splice(
zombies.indexOf(z),
1
);

kills++;

document.getElementById(
"kills"
).textContent=
kills;

}

}

}

}


/* =========================
   SANGUE
========================= */

function blood(pos){

for(
let i=0;
i<5;
i++
){

const p=
new THREE.Mesh(
new THREE.SphereGeometry(
.035,6,6
),
new THREE.MeshBasicMaterial({
color:0xb00000
})
);

p.position.copy(pos);

scene.add(p);

let v=
new THREE.Vector3(
(Math.random()-.5)*.08,
Math.random()*.08,
(Math.random()-.5)*.08
);

let life=0;

function drop(){

p.position.add(v);

v.y-=.005;

life++;

if(
life<18
)
requestAnimationFrame(
drop
);
else
scene.remove(p);

}

drop();

}

}


/* =========================
   ZUMBIS
========================= */

function updateZombies(){

for(
const z of zombies
){

const dx=
player.x-
z.mesh.position.x;

const dz=
player.z-
z.mesh.position.z;

const dist=
Math.hypot(dx,dz);


/* NUNCA DEITA */

z.mesh.position.y=0;
z.mesh.rotation.z=0;

if(
dist>2.8
){

z.mesh.position.x+=
dx/dist*z.speed;

z.mesh.position.z+=
dz/dist*z.speed;

z.mesh.lookAt(
player.x,
2.2,
player.z
);


/* caminhada */

z.phase+=.16;

const walk=
Math.sin(
z.phase
)*.65;

z.leftLeg.rotation.x=
walk;

z.rightLeg.rotation.x=
-walk;

z.leftArm.rotation.x=
-walk*.35;

z.rightArm.rotation.x=
walk*.35;

}

else{

/* ataque em pé */

z.attackTimer++;

z.mesh.lookAt(
player.x,
2.2,
player.z
);

z.leftArm.rotation.x=
-.9+
Math.sin(
z.attackTimer*.3
)*.15;

z.rightArm.rotation.x=
-.9-
Math.sin(
z.attackTimer*.3
)*.15;

if(
z.attackTimer%75===0
){

zombieSound();

player.health-=6;

damageEffect();

if(
player.health<=0
)
gameOver();

}

}

}

}


/* =========================
   DANO
========================= */

function damageEffect(){

const d=
document.getElementById(
"damage"
);

d.style.opacity=.55;

setTimeout(
()=>{
d.style.opacity=0;
},
130
);

document.getElementById(
"hp"
).style.width=
Math.max(
0,
player.health
)+"%";

}


/* =========================
   MINIMAPA
========================= */

const mini=
document.getElementById(
"miniCanvas"
);

const ctx=
mini.getContext("2d");

mini.width=210;
mini.height=210;

function minimap(){

ctx.clearRect(
0,0,210,210
);

ctx.fillStyle=
"#507649";

ctx.fillRect(
0,0,210,210
);


/* ruas */

ctx.strokeStyle="#555";
ctx.lineWidth=9;

ctx.beginPath();
ctx.moveTo(105,0);
ctx.lineTo(105,210);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,105);
ctx.lineTo(210,105);
ctx.stroke();


const scale=.18;


/* construções */

ctx.fillStyle="#777";

for(
const c of walls
){

const x=
105+
(c.x-player.x)*scale;

const y=
105+
(c.z-player.z)*scale;

if(
x>-20&&
x<230&&
y>-20&&
y<230
){

ctx.fillRect(
x-c.w*scale/2,
y-c.d*scale/2,
c.w*scale,
c.d*scale
);

}

}


/* zumbis */

ctx.fillStyle="#f11";

for(
const z of zombies
){

const x=
105+
(z.mesh.position.x-player.x)*scale;

const y=
105+
(z.mesh.position.z-player.z)*scale;

if(
x>=0&&
x<=210&&
y>=0&&
y<=210
){

ctx.beginPath();

ctx.arc(
x,y,3,0,Math.PI*2
);

ctx.fill();

}

}


/* jogador */

ctx.save();

ctx.translate(
105,105
);

ctx.rotate(
player.angle
);

ctx.fillStyle=
"#20ff55";

ctx.beginPath();

ctx.moveTo(
0,-10
);

ctx.lineTo(
6,7
);

ctx.lineTo(
-6,7
);

ctx.closePath();

ctx.fill();

ctx.restore();

}


/* =========================
   GAME OVER
========================= */

let kills=0;
let dead=false;

function gameOver(){

if(dead)return;

dead=true;

document.getElementById(
"finalKills"
).textContent=
kills;

document.getElementById(
"gameover"
).style.display=
"flex";

}


/* =========================
   COMEÇAR
========================= */

document.getElementById(
"start"
).onclick=
()=>{

document.getElementById(
"menu"
).style.display=
"none";

if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

audioCtx.resume();

}

};


/* =========================
   LOOP
========================= */

function animate(){

requestAnimationFrame(
animate
);

if(dead)return;

updatePlayer();
updateDoors();
updateZombies();
minimap();

if(firing)
shoot();

renderer.render(
scene,
camera
);

}

animate();


/* =========================
   RESIZE
========================= */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});

</script>
</body>
</html>
