<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEW DARK V12</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#02050a;
 font-family:Arial,sans-serif
}
canvas{display:block;touch-action:none}

#menu{
 position:fixed;inset:0;z-index:100;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 color:white;text-align:center;
 background:radial-gradient(circle,#354b68,#020407 72%)
}
#menu h1{
 margin:0;font-size:58px;letter-spacing:8px;
 text-shadow:0 0 25px #83adff
}
#menu p{color:#ccd5df}
button{
 color:white;background:#173b5c;
 border:2px solid white;border-radius:10px;
 padding:14px 25px;font-weight:bold;font-size:17px
}

#hud{
 position:fixed;top:12px;left:12px;
 z-index:20;color:white;font-weight:bold;
 text-shadow:2px 2px 5px #000
}
#bar{
 width:190px;height:18px;
 border:2px solid white;background:#222
}
#hp{height:100%;width:100%;background:#27dd58}

#weapon{
 position:fixed;top:14px;right:15px;
 z-index:20;color:white;font-weight:bold
}
#zoom{
 display:none;position:fixed;top:40px;right:15px;
 z-index:20;color:white;font-weight:bold
}

#cross{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:28px;z-index:15
}

#scope{
 display:none;position:fixed;inset:0;
 pointer-events:none;z-index:16
}
#scope:before{
 content:"";position:absolute;inset:0;
 background:radial-gradient(circle,
 transparent 0 23%,rgba(0,0,0,.96) 27%)
}
#scope:after{
 content:"";position:absolute;
 left:50%;top:20%;height:60%;width:2px;
 background:white
}
#scopeLine{
 position:absolute;left:22%;right:22%;
 top:50%;height:2px;background:white
}

#damage{
 position:fixed;inset:0;
 background:#d40000;opacity:0;
 z-index:14;pointer-events:none
}

#joy{
 position:fixed;left:20px;bottom:20px;
 width:135px;height:135px;border-radius:50%;
 border:3px solid #ffffff66;
 background:#ffffff12;z-index:30
}
#knob{
 position:absolute;left:38px;top:38px;
 width:55px;height:55px;border-radius:50%;
 background:#ffffff80
}

.action{
 position:fixed;z-index:30;
 width:70px;height:70px;
 border-radius:50%;padding:0
}
#fire{
 right:20px;bottom:20px;
 width:95px;height:95px;background:#8e1515
}
#switch{right:130px;bottom:115px}
#run{right:130px;bottom:35px}
#zoomBtn{
 display:none;right:210px;bottom:115px
}

#mini{
 position:fixed;right:12px;bottom:12px;
 width:150px;height:150px;
 border:3px solid white;border-radius:50%;
 overflow:hidden;z-index:20
}
#miniCanvas{width:100%;height:100%}

#gameover{
 display:none;position:fixed;inset:0;z-index:100;
 background:#000e;color:white;
 align-items:center;justify-content:center;
 flex-direction:column;text-align:center
}
</style>
</head>

<body>

<p>V12 • ZOMBIE SURVIVAL</p>
<button id="start">JOGAR</button>
</div>

<div id="hud">
VIDA

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* ==============================
   CENA
============================== */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111b29);
scene.fog=new THREE.Fog(0x111b29,55,650);

});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* ==============================
   LUZ / LUA
============================== */

scene.add(new THREE.HemisphereLight(
0x9bb7df,0x202c20,.8
));

const moonLight=new THREE.DirectionalLight(
0xb9caff,1.7
);
moonLight.position.set(-180,250,-150);
moonLight.castShadow=true;
scene.add(moonLight);

const moon=new THREE.Mesh(
new THREE.SphereGeometry(20,32,32),
new THREE.MeshBasicMaterial({color:0xfff1bd})
);
moon.position.set(-250,260,-400);
scene.add(moon);

/* ==============================
   CHÃO
============================== */

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(2000,2000),
new THREE.MeshStandardMaterial({
color:0x354b38,
roughness:1
})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* ==============================
   RUAS
============================== */

function road(w,d){
const r=new THREE.Mesh(
new THREE.BoxGeometry(w,.07,d),
new THREE.MeshStandardMaterial({
color:0x393c41,roughness:.95
})
);
r.position.y=.04;
scene.add(r);
}
road(48,1000);
road(1000,48);

/* ==============================
   COLISÕES / CASAS
============================== */

const walls=[];

function wall(x,z,w,d){
walls.push({x,z,w,d});
}

function blocked(x,z){
return walls.some(c=>
x>c.x-c.w/2-.7 &&
x<c.x+c.w/2+.7 &&
z>c.z-c.d/2-.7 &&
z<c.z+c.d/2+.7
);
}

function house(x,z,w,d,h){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:0x806453,roughness:.9
})
);
body.position.y=h/2;
body.castShadow=true;
g.add(body);

const roof=new THREE.Mesh(
new THREE.ConeGeometry(
Math.max(w,d)*.72,5,4
),
new THREE.MeshStandardMaterial({
color:0x282a2d
})
);
roof.rotation.y=Math.PI/4;
roof.position.y=h+2.5;
g.add(roof);

g.position.set(x,0,z);
scene.add(g);

wall(x,z,w,d);
}

house(-65,-75,30,27,15);
house(65,-75,32,28,17);
house(-70,75,34,28,16);
house(70,75,30,30,18);
house(-150,-115,42,35,22);
house(150,-120,42,35,25);
house(-150,125,45,38,23);
house(150,125,45,38,28);

/* prédios */

function building(x,z,w,d,h){

const b=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:0x5d6268,roughness:.85
})
);
b.position.set(x,h/2,z);
b.castShadow=true;
scene.add(b);
wall(x,z,w,d);
}

building(-225,-70,55,45,38);
building(225,-75,60,48,45);
building(-225,80,50,50,42);
building(225,85,55,45,50);

/* ==============================
   POSTES
============================== */

function lamp(x,z){

const pole=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.17,7,10),
new THREE.MeshStandardMaterial({
color:0x25292c,metalness:.7
})
);
pole.position.set(x,3.5,z);
scene.add(pole);

const light=new THREE.PointLight(
0xffd48b,2.3,30
);
light.position.set(x,7,z);
scene.add(light);
}

for(let i=-400;i<=400;i+=45){
lamp(i,-30);
lamp(i,30);
}

/* ==============================
   CARROS
============================== */

function car(x,z,color){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(4.8,1.3,8),
new THREE.MeshStandardMaterial({
color,metalness:.35,roughness:.35
})
);
body.position.y=1.15;
g.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(4,1.15,4),
new THREE.MeshStandardMaterial({
color:0x10161b,roughness:.2
})
);
cabin.position.y=2.15;
g.add(cabin);

const wheelMat=new THREE.MeshStandardMaterial({
color:0x070707
});

for(const p of [
[-2.4,.8,-2.5],
[2.4,.8,-2.5],
[-2.4,.8,2.5],
[2.4,.8,2.5]
]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.8,.8,.55,18),
wheelMat
);
wheel.rotation.z=Math.PI/2;
wheel.position.set(...p);
g.add(wheel);
}

g.position.set(x,0,z);
scene.add(g);
}

car(-18,-58,0x982727);
car(18,-58,0x28548e);
car(-18,58,0x777777);
car(18,58,0xb18b2c);

/* ==============================
   ZUMBIS
============================== */

const zombies=[];

function zombie(x,z){

const g=new THREE.Group();

const skin=new THREE.MeshStandardMaterial({
color:0x78866f,roughness:1
});

const clothes=new THREE.MeshStandardMaterial({
color:0x3e5040,roughness:.95
});

/* pernas e pés */

for(const xx of [-.24,.24]){

const leg=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.17,1.8,10),
clothes
);
leg.position.set(xx,.9,0);
g.add(leg);

const foot=new THREE.Mesh(
new THREE.BoxGeometry(.32,.18,.65),
new THREE.MeshStandardMaterial({
color:0x17191b
})
);
foot.position.set(xx,.12,-.2);
g.add(foot);
}

/* corpo */

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.32,.48,1.9,14),
clothes
);
body.position.y=2.1;
g.add(body);

/* cabeça */

const head=new THREE.Mesh(
new THREE.SphereGeometry(.55,20,20),
skin
);
head.position.y=3.75;
g.add(head);

/* olhos */

const red=new THREE.MeshBasicMaterial({
color:0xff0505
});

for(const xx of [-.18,.18]){
const eye=new THREE.Mesh(
new THREE.SphereGeometry(.075,10,10),red
);
eye.position.set(xx,3.84,-.51);
g.add(eye);
}

/* nariz */

const nose=new THREE.Mesh(
new THREE.SphereGeometry(.09,8,8),skin
);
nose.position.set(0,3.67,-.54);
g.add(nose);

/* boca */

const mouth=new THREE.Mesh(
new THREE.BoxGeometry(.4,.13,.06),
new THREE.MeshBasicMaterial({color:0x120505})
);
mouth.position.set(0,3.56,-.53);
g.add(mouth);

/* braços */

for(const xx of [-.62,.62]){
const arm=new THREE.Mesh(
new THREE.CylinderGeometry(.11,.16,1.8,10),
skin
);
arm.position.set(xx,2.15,0);
arm.rotation.z=xx<0?-.3:.3;
g.add(arm);

const hand=new THREE.Mesh(
new THREE.SphereGeometry(.17,10,10),skin
);
hand.position.set(xx*1.1,1.35,.05);
g.add(hand);
}

g.position.set(x,0,z);
scene.add(g);

zombies.push({
mesh:g,hp:3,
speed:.018+Math.random()*.015,
attack:0,phase:Math.random()*10
});
}

for(let i=0;i<45;i++){
const a=Math.random()*Math.PI*2;
const d=120+Math.random()*430;
zombie(Math.sin(a)*d,Math.cos(a)*d);
}

/* ==============================
   JOGADOR
============================== */

const player={
x:0,y:1.7,z:0,
angle:0,pitch:0,health:100
};

camera.position.set(0,1.7,0);

/* ==============================
   ARMAS V12
============================== */

const weapons=[
{name:"PISTOLA",damage:2,delay:230},
{name:"AK-47",damage:2,delay:150},
{name:"UMP",damage:2,delay:130},
{name:"SCAR",damage:3,delay:180},
{name:"SNIPER",damage:6,delay:550}
];

let weaponIndex=0;
let zoomLevel=1;

const weaponGroup=new THREE.Group();
camera.add(weaponGroup);
scene.add(camera);

/*
   Peças arredondadas:
   cilindros + cápsulas + esferas
*/

function roundedPart(
radius,length,color=0x1d2226
){
const m=new THREE.MeshStandardMaterial({
color,metalness:.85,roughness:.22
});
const p=new THREE.Mesh(
new THREE.CylinderGeometry(
radius,radius,length,20
),m
);
return p;
}

function createGun(){

while(weaponGroup.children.length)
weaponGroup.remove(weaponGroup.children[0]);

const metal=new THREE.MeshStandardMaterial({
color:0x202529,
metalness:.9,
roughness:.2
});

const dark=new THREE.MeshStandardMaterial({
color:0x111416,
roughness:.35
});

const wood=new THREE.MeshStandardMaterial({
color:0x513a28,
roughness:.8
});

let bodyLength=1.2;
let barrelLength=1.5;

/* PISTOLA */

if(weaponIndex===0){

const slide=new THREE.Mesh(
new THREE.BoxGeometry(.42,.25,1.2),
metal
);
slide.position.set(.43,-.36,-1);
weaponGroup.add(slide);

const barrel=roundedPart(.07,1.0);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.43,-.36,-1.85);
weaponGroup.add(barrel);

const grip=new THREE.Mesh(
new THREE.BoxGeometry(.28,.7,.4),
dark
);
grip.rotation.x=.22;
grip.position.set(.43,-.75,-.62);
weaponGroup.add(grip);

}

/* AK */

if(weaponIndex===1){

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.22,.25,1.25,16),
metal
);
body.rotation.x=Math.PI/2;
body.position.set(.43,-.36,-1);
weaponGroup.add(body);

const barrel=roundedPart(.075,2.3);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.43,-.36,-2.65);
weaponGroup.add(barrel);

const stock=new THREE.Mesh(
new THREE.CylinderGeometry(.18,.24,.9,12),
wood
);
stock.rotation.x=Math.PI/2;
stock.position.set(.43,-.36,.05);
weaponGroup.add(stock);

const mag=new THREE.Mesh(
new THREE.CylinderGeometry(.16,.2,.8,14),
dark
);
mag.rotation.x=-.25;
mag.position.set(.43,-.78,-1);
weaponGroup.add(mag);

}

/* UMP */

if(weaponIndex===2){

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.25,.85,6,14),
metal
);
body.rotation.x=Math.PI/2;
body.position.set(.43,-.37,-1);
weaponGroup.add(body);

const barrel=roundedPart(.08,1.9);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.43,-.37,-2.2);
weaponGroup.add(barrel);

const mag=new THREE.Mesh(
new THREE.CapsuleGeometry(.14,.65,5,10),
dark
);
mag.rotation.x=.1;
mag.position.set(.43,-.78,-1);
weaponGroup.add(mag);

}

/* SCAR */

if(weaponIndex===3){

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.24,1.15,6,14),
metal
);
body.rotation.x=Math.PI/2;
body.position.set(.43,-.36,-1);
weaponGroup.add(body);

const barrel=roundedPart(.08,2.7);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.43,-.36,-2.75);
weaponGroup.add(barrel);

const stock=new THREE.Mesh(
new THREE.BoxGeometry(.3,.35,.9),
dark
);
stock.position.set(.43,-.38,.05);
weaponGroup.add(stock);

const mag=new THREE.Mesh(
new THREE.CapsuleGeometry(.14,.72,5,10),
dark
);
mag.rotation.x=-.15;
mag.position.set(.43,-.78,-1);
weaponGroup.add(mag);

}

/* SNIPER */

if(weaponIndex===4){

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.23,1.3,6,16),
metal
);
body.rotation.x=Math.PI/2;
body.position.set(.43,-.37,-1);
weaponGroup.add(body);

const barrel=roundedPart(.065,3.8);
barrel.rotation.x=Math.PI/2;
barrel.position.set(.43,-.37,-3);
weaponGroup.add(barrel);

/* luneta */

const scope=roundedPart(.12,.95,0x0d1012);
scope.rotation.x=Math.PI/2;
scope.position.set(.43,-.05,-1.45);
weaponGroup.add(scope);

/* lentes */

for(const z of [-1.9,-1.0]){
const lens=new THREE.Mesh(
new THREE.CylinderGeometry(
.13,.13,.05,20
),
new THREE.MeshBasicMaterial({
color:0x273d52
})
);
lens.rotation.x=Math.PI/2;
lens.position.set(.43,-.05,z);
weaponGroup.add(lens);
}

const stock=new THREE.Mesh(
new THREE.BoxGeometry(.32,.4,1),
dark
);
stock.position.set(.43,-.4,.08);
weaponGroup.add(stock);
}
}

createGun();

/* ==============================
   CONTROLES
============================== */

let joyX=0,joyY=0,moving=false;
let running=false;

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function moveJoy(e){

const r=joy.getBoundingClientRect();

let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);

const max=44;
const dist=Math.hypot(dx,dy);

if(dist>max){
dx=dx/dist*max;
dy=dy/dist*max;
}

joyX=dx/max;
joyY=dy/max;

knob.style.left=(40+dx)+"px";
knob.style.top=(40+dy)+"px";
}

joy.addEventListener("pointerdown",e=>{
moving=true;
joy.setPointerCapture(e.pointerId);
moveJoy(e);
});

joy.addEventListener("pointermove",e=>{
if(moving)moveJoy(e);
});

joy.addEventListener("pointerup",()=>{
moving=false;
joyX=0;
joyY=0;
knob.style.left="38px";
knob.style.top="38px";
});

document.getElementById("run")
.onpointerdown=()=>running=true;

document.getElementById("run")
.onpointerup=()=>running=false;

/* câmera */

let looking=false,lastX=0,lastY=0;

renderer.domElement.onpointerdown=e=>{
looking=true;
lastX=e.clientX;
lastY=e.clientY;
};

renderer.domElement.onpointermove=e=>{

if(!looking)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

player.angle-=dx*.004;
player.pitch-=dy*.003;

player.pitch=Math.max(
-1.15,Math.min(1.15,player.pitch)
);
};

renderer.domElement.onpointerup=()=>{
looking=false;
};

/* ==============================
   MOVIMENTO
============================== */

function updatePlayer(){

const speed=running?.2:.12;

const forward=-joyY;
const side=joyX;

const fx=-Math.sin(player.angle);
const fz=-Math.cos(player.angle);

const rx=Math.cos(player.angle);
const rz=-Math.sin(player.angle);

const nx=player.x+
(fx*forward+rx*side)*speed;

const nz=player.z+
(fz*forward+rz*side)*speed;

if(!blocked(nx,player.z))
player.x=nx;

if(!blocked(player.x,nz))
player.z=nz;

camera.position.set(
player.x,player.y,player.z
);

camera.rotation.order="YXZ";
camera.rotation.y=player.angle;
camera.rotation.x=player.pitch;
}

/* ==============================
   TIRO
============================== */

const bullets=[];
let firing=false;
let lastShot=0;
let kills=0;

function shoot(){

const now=performance.now();
const w=weapons[weaponIndex];

if(now-lastShot<w.delay)return;

lastShot=now;

weaponGroup.position.z=.14;

setTimeout(()=>{
weaponGroup.position.z=0;
},60);

const dir=new THREE.Vector3();
camera.getWorldDirection(dir);

bullets.push({
pos:camera.position.clone(),
dir,
damage:w.damage,
life:0
});

/* clarão */

const flash=new THREE.PointLight(
0xffa13b,10,10
);
flash.position.set(.43,-.37,-2);
weaponGroup.add(flash);

setTimeout(()=>{
weaponGroup.remove(flash);
},45);
}

document.getElementById("fire")
.onpointerdown=()=>firing=true;

document.getElementById("fire")
.onpointerup=()=>firing=false;

/* ==============================
   IMPACTO
============================== */

function impact(pos){

for(let i=0;i<8;i++){

const p=new THREE.Mesh(
new THREE.SphereGeometry(
.035+Math.random()*.04,6,6
),
new THREE.MeshBasicMaterial({
color:0xa80b0b
})
);

p.position.copy(pos);
scene.add(p);

const v=new THREE.Vector3(
(Math.random()-.5)*.09,
Math.random()*.09,
(Math.random()-.5)*.09
);

let life=0;

function particle(){

p.position.add(v);
v.y-=.004;
life++;

if(life>18){
scene.remove(p);
return;
}

requestAnimationFrame(particle);
}

particle();
}
}

/* ==============================
   BALAS
============================== */

function updateBullets(){

for(let i=bullets.length-1;i>=0;i--){

const b=bullets[i];

b.pos.addScaledVector(b.dir,.9);
b.life++;

let hit=false;

for(let j=zombies.length-1;j>=0;j--){

const z=zombies[j];
const center=z.mesh.position.clone();
center.y+=2;

if(b.pos.distanceTo(center)<2.1){

impact(b.pos);
z.hp-=b.damage;
hit=true;

if(z.hp<=0){

scene.remove(z.mesh);
zombies.splice(j,1);

kills++;
document.getElementById("kills")
.textContent=kills;
}

break;
}
}

if(hit||b.life>100)
bullets.splice(i,1);
}
}

/* ==============================
   ZUMBIS
============================== */

function updateZombies(){

for(const z of zombies){

const dx=player.x-z.mesh.position.x;
const dz=player.z-z.mesh.position.z;
const dist=Math.hypot(dx,dz);

if(dist>2.5){

z.mesh.position.x+=dx/dist*z.speed;
z.mesh.position.z+=dz/dist*z.speed;

z.mesh.lookAt(
player.x,1.7,player.z
);

z.phase+=.15;

z.mesh.position.y=
Math.sin(z.phase)*.025;

}else{

z.attack++;

if(z.attack>35){

player.health-=6;
z.attack=0;

damage();

if(player.health<=0)
gameOver();
}
}
}
}

/* ==============================
   DANO
============================== */

function damage(){

const d=document.getElementById("damage");
d.style.opacity=.65;

setTimeout(()=>d.style.opacity=0,130);

document.getElementById("hp")
.style.width=Math.max(
0,player.health
)+"%";
}

/* ==============================
   TROCA DE ARMA
============================== */

document.getElementById("switch")
.onclick=()=>{

weaponIndex++;

if(weaponIndex>=weapons.length)
weaponIndex=0;

createGun();

document.getElementById("weapon")
.textContent=weapons[weaponIndex].name;

const sniper=weaponIndex===4;

document.getElementById("scope")
.style.display=sniper?"block":"none";

document.getElementById("zoomBtn")
.style.display=sniper?"block":"none";

document.getElementById("zoom")
.style.display=sniper?"block":"none";

document.getElementById("cross")
.style.display=sniper?"none":"block";

zoomLevel=1;
camera.fov=72;
camera.updateProjectionMatrix();
};

/* ==============================
   ZOOM
============================== */

document.getElementById("zoomBtn")
.onclick=()=>{

zoomLevel++;

if(zoomLevel>3)zoomLevel=1;

document.getElementById("zoom")
.textContent="ZOOM "+zoomLevel+"X";

camera.fov=
zoomLevel===1?72:
zoomLevel===2?45:28;

camera.updateProjectionMatrix();
};

/* ==============================
   MINIMAPA
============================== */

const mc=document.getElementById("miniCanvas");
const ctx=mc.getContext("2d");

mc.width=300;
mc.height=300;

function minimap(){

ctx.clearRect(0,0,300,300);

ctx.fillStyle="#142018";
ctx.fillRect(0,0,300,300);

const scale=.22;

ctx.strokeStyle="#555";
ctx.lineWidth=12;

ctx.beginPath();
ctx.moveTo(150,0);
ctx.lineTo(150,300);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,150);
ctx.lineTo(300,150);
ctx.stroke();

/* prédios */

ctx.fillStyle="#777";

for(const c of walls){

const x=150+(c.x-player.x)*scale;
const y=150+(c.z-player.z)*scale;

ctx.fillRect(
x-c.w*scale/2,
y-c.d*scale/2,
c.w*scale,
c.d*scale
);
}

/* zumbis */

ctx.fillStyle="#ff2020";

for(const z of zombies){

const x=150+
(z.mesh.position.x-player.x)*scale;

const y=150+
(z.mesh.position.z-player.z)*scale;

if(x>0&&x<300&&y>0&&y<300){

ctx.beginPath();
ctx.arc(x,y,4,0,Math.PI*2);
ctx.fill();
}
}

/* jogador */

ctx.save();
ctx.translate(150,150);
ctx.rotate(player.angle);

ctx.fillStyle="#39ff66";
ctx.beginPath();
ctx.moveTo(0,-11);
ctx.lineTo(8,8);
ctx.lineTo(-8,8);
ctx.closePath();
ctx.fill();

ctx.restore();
}

/* ==============================
   GAME OVER
============================== */

let dead=false;

function gameOver(){

if(dead)return;

dead=true;

document.getElementById("finalKills")
.textContent=kills;

document.getElementById("gameover")
.style.display="flex";
}

/* ==============================
   INÍCIO
============================== */

document.getElementById("start")
.onclick=()=>{
document.getElementById("menu")
.style.display="none";
};

/* ==============================
   LOOP
============================== */

function animate(){

requestAnimationFrame(animate);

if(dead)return;

updatePlayer();
updateBullets();
updateZombies();
minimap();

if(firing)shoot();

renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,innerHeight
);
});

</script>
