<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   CENA 3D
===================================================== */

const scene=new THREE.Scene();

scene.background=
  new THREE.Color(0x7db8e8);

scene.fog=
  new THREE.Fog(0x7db8e8,80,700);


/* =====================================================
   CÂMERA
===================================================== */

const camera=
  new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .05,
    1200
  );

camera.position.set(
  0,
  1.7,
  0
);


/* =====================================================
   RENDERIZADOR
===================================================== */

const renderer=
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.5)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


/* =====================================================
   LUZ / SOL
===================================================== */

const hemi=
  new THREE.HemisphereLight(
    0xbfe8ff,
    0x34452f,
    1.8
  );

scene.add(hemi);

const sun=
  new THREE.DirectionalLight(
    0xffffff,
    3.5
  );

sun.position.set(
  -150,
  300,
  -150
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);


/* =====================================================
   TERRENO
===================================================== */

const ground=
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      2000,
      2000
    ),
    new THREE.MeshStandardMaterial({
      color:0x4c7043,
      roughness:1
    })
  );

ground.rotation.x=
  -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   RUAS
===================================================== */

function road(
  x,z,w,d
){

  const r=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,.08,d
      ),
      new THREE.MeshStandardMaterial({
        color:0x45484a,
        roughness:1
      })
    );

  r.position.set(
    x,.04,z
  );

  r.receiveShadow=true;

  scene.add(r);
}

road(
  0,0,
  65,1800
);

road(
  0,0,
  1800,65
);


/* =====================================================
   COLISÕES
===================================================== */

const walls=[];

function collision(
  x,z,w,d
){

  walls.push({
    x,z,w,d
  });
}

function blocked(
  x,z
){

  const r=.65;

  return walls.some(c=>
    x>c.x-c.w/2-r &&
    x<c.x+c.w/2+r &&
    z>c.z-c.d/2-r &&
    z<c.z+c.d/2+r
  );
}


/* =====================================================
   CASAS 3D
===================================================== */

function createHouse(
  x,z,w,d,h
){

  const group=
    new THREE.Group();

  const wallMat=
    new THREE.MeshStandardMaterial({
      color:0x966247,
      roughness:.9
    });

  const wall=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      wallMat
    );

  wall.position.y=
    h/2;

  wall.castShadow=true;
  wall.receiveShadow=true;

  group.add(wall);


  /* telhado */

  const roof=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        Math.max(w,d)*.72,
        5,
        4
      ),
      new THREE.MeshStandardMaterial({
        color:0x382a25,
        roughness:.9
      })
    );

  roof.rotation.y=
    Math.PI/4;

  roof.position.y=
    h+2.5;

  roof.castShadow=true;

  group.add(roof);


  /* porta */

  const door=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.3,
        3.6,
        .18
      ),
      new THREE.MeshStandardMaterial({
        color:0x3c2417
      })
    );

  door.position.set(
    0,
    1.8,
    d/2+.1
  );

  group.add(door);


  /* janelas */

  const glassMat=
    new THREE.MeshStandardMaterial({
      color:0x63b6e2,
      roughness:.15,
      metalness:.2
    });

  for(
    const side of [-1,1]
  ){

    const window=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.5,
          1.6,
          .1
        ),
        glassMat
      );

    window.position.set(
      side*w*.27,
      h*.58,
      d/2+.08
    );

    group.add(window);
  }


  /* luz interna */

  const light=
    new THREE.PointLight(
      0xffc96b,
      4,
      18
    );

  light.position.set(
    0,
    h*.55,
    0
  );

  group.add(light);


  group.position.set(
    x,0,z
  );

  scene.add(group);


  collision(
    x-w/2,
    z,
    .4,
    d
  );

  collision(
    x+w/2,
    z,
    .4,
    d
  );

  collision(
    x,
    z-d/2,
    w,
    .4
  );

  collision(
    x,
    z+d/2,
    w-3,
    .4
  );
}

createHouse(
  -90,-100,
  38,32,16
);

createHouse(
  90,-100,
  38,32,17
);

createHouse(
  -100,100,
  40,34,18
);

createHouse(
  100,100,
  40,34,17
);

createHouse(
  -250,-170,
  50,40,22
);

createHouse(
  250,-170,
  50,40,22
);


/* =====================================================
   CARROS 3D
===================================================== */

function createCar(
  x,z,color
){

  const g=
    new THREE.Group();

  const paint=
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.6,
      roughness:.25
    });

  const dark=
    new THREE.MeshStandardMaterial({
      color:0x111315,
      roughness:.35
    });

  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5.5,
        1.25,
        8
      ),
      paint
    );

  body.position.y=1.1;
  body.castShadow=true;

  g.add(body);


  const cabin=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        4.1,
        1.25,
        4
      ),
      dark
    );

  cabin.position.y=2;

  g.add(cabin);


  for(
    const p of [
      [-2.6,.7,-2.5],
      [ 2.6,.7,-2.5],
      [-2.6,.7, 2.5],
      [ 2.6,.7, 2.5]
    ]
  ){

    const wheel=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .8,
          .8,
          .55,
          18
        ),
        dark
      );

    wheel.rotation.z=
      Math.PI/2;

    wheel.position.set(
      p[0],
      p[1],
      p[2]
    );

    g.add(wheel);
  }

  g.position.set(
    x,0,z
  );

  scene.add(g);
}

createCar(
  -20,-58,0xa52b2b
);

createCar(
  20,-58,0x235c9d
);

createCar(
  -20,58,0x777777
);

createCar(
  20,58,0xc28c2d
);


/* =====================================================
   ZUMBIS 3D
===================================================== */

const zombies=[];

function createZombie(
  x,z
){

  const g=
    new THREE.Group();


  const skin=
    new THREE.MeshStandardMaterial({
      color:0x87977b,
      roughness:1
    });

  const shirt=
    new THREE.MeshStandardMaterial({
      color:0x465746,
      roughness:.9
    });

  const pants=
    new THREE.MeshStandardMaterial({
      color:0x252b2f,
      roughness:.9
    });

  const shoe=
    new THREE.MeshStandardMaterial({
      color:0x101112
    });


  /* corpo */

  const body=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .32,
        .72,
        6,
        12
      ),
      shirt
    );

  body.position.y=2.25;

  body.scale.y=1.15;

  body.castShadow=true;

  g.add(body);


  /* cabeça */

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .48,
        20,
        16
      ),
      skin
    );

  head.position.y=3.45;

  head.castShadow=true;

  g.add(head);


  /* olhos */

  const eyeMat=
    new THREE.MeshStandardMaterial({
      color:0xff0000,
      emissive:0x990000
    });

  for(
    const side of [-1,1]
  ){

    const eye=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .065,
          10,
          10
        ),
        eyeMat
      );

    eye.position.set(
      side*.17,
      3.5,
      -.44
    );

    g.add(eye);
  }


  /* nariz */

  const nose=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .08,
        10,
        10
      ),
      skin
    );

  nose.position.set(
    0,
    3.35,
    -.47
  );

  g.add(nose);


  /* boca */

  const mouth=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .28,
        .09,
        .06
      ),
      new THREE.MeshStandardMaterial({
        color:0x170303
      })
    );

  mouth.position.set(
    0,
    3.18,
    -.44
  );

  g.add(mouth);


  /* orelhas */

  for(
    const side of [-1,1]
  ){

    const ear=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .1,
          10,
          10
        ),
        skin
      );

    ear.position.set(
      side*.48,
      3.43,
      0
    );

    g.add(ear);
  }


  /* braços */

  const armGeo=
    new THREE.CapsuleGeometry(
      .11,
      .7,
      5,
      10
    );

  const leftArm=
    new THREE.Mesh(
      armGeo,
      skin
    );

  const rightArm=
    new THREE.Mesh(
      armGeo,
      skin
    );

  leftArm.position.set(
    -.55,
    2.35,
    0
  );

  rightArm.position.set(
    .55,
    2.35,
    0
  );

  leftArm.rotation.z=.15;
  rightArm.rotation.z=-.15;

  g.add(
    leftArm,
    rightArm
  );


  /* pernas */

  const legGeo=
    new THREE.CapsuleGeometry(
      .13,
      .75,
      5,
      10
    );

  const leftLeg=
    new THREE.Mesh(
      legGeo,
      pants
    );

  const rightLeg=
    new THREE.Mesh(
      legGeo,
      pants
    );

  leftLeg.position.set(
    -.19,
    1.05,
    0
  );

  rightLeg.position.set(
    .19,
    1.05,
    0
  );

  g.add(
    leftLeg,
    rightLeg
  );


  /* pés */

  const footGeo=
    new THREE.BoxGeometry(
      .28,
      .18,
      .55
    );

  const leftFoot=
    new THREE.Mesh(
      footGeo,
      shoe
    );

  const rightFoot=
    new THREE.Mesh(
      footGeo,
      shoe
    );

  leftFoot.position.set(
    -.19,
    .55,
    -.13
  );

  rightFoot.position.set(
    .19,
    .55,
    -.13
  );

  g.add(
    leftFoot,
    rightFoot
  );


  g.position.set(
    x,0,z
  );

  scene.add(g);


  zombies.push({
    mesh:g,
    leftLeg,
    rightLeg,
    leftArm,
    rightArm,
    hp:100,
    speed:.025+Math.random()*.012,
    phase:Math.random()*10,
    attack:0
  });
}


/* cria zumbis */

for(let i=0;i<20;i++){

  const a=
    Math.random()*Math.PI*2;

  const d=
    180+Math.random()*500;

  createZombie(
    Math.sin(a)*d,
    Math.cos(a)*d

/* =====================================================
   PLAYER
===================================================== */

const player={
  x:0,
  y:1.7,
  z:0,
  angle:0,
  pitch:0,

/* =====================================================
   ARMAS 3D
===================================================== */

const weapons=[
  {
    name:"PISTOLA",
    damage:50,
    delay:300,
    color:0x777777
  },
  {
    name:"AK-47",
    damage:25,
    delay:120,
    color:0x65452b
  },
  {
    name:"UMP",

    delay:100,

  },
  {

  },

let weaponIndex=0;


/* grupo da arma */

const gun=
  new THREE.Group();

camera.add(gun);

scene.add(camera);


/* =====================================================
   MODELO DA ARMA
===================================================== */

function box(
  w,h,d,color
){

  return new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color:color,
      metalness:.7,
      roughness:.25
    })
  );
}

function makeGun(){

  while(gun.children.length)
    gun.remove(
      gun.children[0]
    );

  const w=
    weapons[weaponIndex];

  const body=
    box(
      .45,
      .35,
      1.3,
      w.color
    );

  body.position.set(
    .42,
    -.34,
    -1
  );

  gun.add(body);


  const barrel=
    box(
      .12,
      .12,
      1.9,
      0x111111
    );

  barrel.position.set(
    .42,
    -.34,
    -2.45
  );

  gun.add(barrel);


  const grip=
    box(
      .25,
      .65,
      .4,
      0x151515
    );

  grip.position.set(
    .42,
    -.78,
    -.65
  );

  grip.rotation.x=.15;

  gun.add(grip);


  if(
    weaponIndex===1 ||
    weaponIndex===2 ||
    weaponIndex===3
  ){

    const magazine=
      box(
        .22,
        .65,
        .3,
        0x171717
      );

    magazine.position.set(
      .42,
      -.76,
      -1
    );

    gun.add(magazine);
  }


  if(
    weaponIndex===4
  ){

    const scope=
      box(
        .18,
        .18,
        .9,
        0x111111
      );

    scope.position.set(
      .42,
      -.04,
      -1.45
    );

    gun.add(scope);
  }
}

makeGun();


/* =====================================================
   SOM
===================================================== */

let audio=null;

function audioStart(){

  if(!audio){

    audio=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if(
    audio.state==="suspended"
  )
    audio.resume();
}

function sound(
  freq,
  duration
){

  if(!audio)
    return;

  const osc=
    audio.createOscillator();

  const gain=
    audio.createGain();

  osc.type="sawtooth";

  osc.frequency.value=
    freq;

  gain.gain.setValueAtTime(
    .13,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime+duration
  );
}


/* =====================================================
   CONTROLES
===================================================== */

const joy=
  document.getElementById("joy");

const knob=
  document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(e){

  const r=
    joy.getBoundingClientRect();

  let dx=
    e.clientX-
    (r.left+r.width/2);

  let dy=
    e.clientY-
    (r.top+r.height/2);

  const max=43;

  const dist=
    Math.hypot(dx,dy);

  if(dist>max){

    dx=dx/dist*max;
    dy=dy/dist*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  knob.style.left=
    41+dx+"px";

  knob.style.top=
    41+dy+"px";
}

joy.onpointerdown=e=>{

  joyActive=true;

  joy.setPointerCapture(
    e.pointerId
  );

  moveJoy(e);
};

joy.onpointermove=e=>{

  if(joyActive)
    moveJoy(e);
};

joy.onpointerup=()=>{

  joyActive=false;

  joyX=0;
  joyY=0;

  knob.style.left="41px";
  knob.style.top="41px";
};


/* =====================================================
   CÂMERA
===================================================== */

let looking=false;
let lastX=0;
let lastY=0;

renderer.domElement.onpointerdown=e=>{

  if(
    e.clientX<170 &&
    e.clientY>innerHeight-180
  )
    return;

  if(
    e.clientX>innerWidth-170 &&
    e.clientY>innerHeight-180
  )
    return;

  looking=true;

  lastX=e.clientX;
  lastY=e.clientY;
};

renderer.domElement.onpointermove=e=>{

  if(!looking)
    return;

  const dx=
    e.clientX-lastX;

  const dy=
    e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  player.angle-=dx*.004;

  player.pitch-=dy*.003;

  player.pitch=
    Math.max(
      -1.0,
      Math.min(
        1.0,
        player.pitch
      )
    );
};

renderer.domElement.onpointerup=()=>{
  looking=false;
};


/* =====================================================
   CORRER
===================================================== */

document.getElementById("run")
.onclick=()=>{

  player.running=
    !player.running;

  document.getElementById(
    "run"
  ).style.background=
    player.running
      ? "#a00000"
      : "#260000";
};


/* =====================================================
   TROCAR ARMA
===================================================== */

document.getElementById("change")
.onclick=()=>{

  weaponIndex++;

  if(
    weaponIndex>=weapons.length
  )
    weaponIndex=0;

  document.getElementById(
    "weapon"
  ).textContent=
    weapons[weaponIndex].name;

  makeGun();
};


/* =====================================================
   TIRO
===================================================== */

let firing=false;
let lastShot=0;

const fire=
  document.getElementById("fire");

fire.onpointerdown=e=>{

  e.preventDefault();

  audioStart();

  firing=true;
};

fire.onpointerup=()=>{
  firing=false;
};

fire.onpointercancel=()=>{
  firing=false;
};


function shoot(){

  const now=
    performance.now();

  const w=
    weapons[weaponIndex];

  if(
    now-lastShot<w.delay
  )
    return;

  lastShot=now;

  sound(
    weaponIndex===4
      ? 80
      : 130,
    .09
  );


  /* recoil */

  gun.position.z=.18;

  setTimeout(()=>{
    gun.position.z=0;
  },70);


  /* raio */

  const direction=
    new THREE.Vector3();

  camera.getWorldDirection(
    direction
  );

  const ray=
    new THREE.Raycaster(
      camera.position.clone(),
      direction,
      0,
      300
    );


  let closest=null;
  let closestDist=Infinity;

  for(
    const z of zombies
  ){

    const center=
      z.mesh.position.clone();

    center.y+=2;

    const to=
      center.clone().sub(
        camera.position
      );

    const distance=
      to.length();

    if(
      distance>300
    )
      continue;

    const angle=
      direction.angleTo(
        to.normalize()
      );

    if(
      angle<.12 &&
      distance<closestDist
    ){

      closest=z;
      closestDist=distance;
    }
  }


  if(closest){

    closest.hp-=w.damage;

    if(
      closest.hp<=0
    ){

      scene.remove(
        closest.mesh
      );

      const i=
        zombies.indexOf(
          closest
        );

      if(i>=0)
        zombies.splice(i,1);

      kills++;

      document.getElementById(
        "kills"
      ).textContent=kills;


      setTimeout(()=>{

        if(!dead){

          const a=
            Math.random()*Math.PI*2;

          const d=
            250+
            Math.random()*350;

          createZombie(
            player.x+
            Math.sin(a)*d,
            player.z+
            Math.cos(a)*d
          );
        }

      },1000);
    }
  }
}


/* =====================================================
   MOVIMENTO
===================================================== */

function updatePlayer(){

  const speed=
    player.running
      ? .23
      : .12;

  const forward=
    -joyY;

  const side=
    joyX;

  const fx=
    -Math.sin(
      player.angle
    );

  const fz=
    -Math.cos(
      player.angle
    );

  const rx=
    Math.cos(
      player.angle
    );

  const rz=
    -Math.sin(
      player.angle
    );

  const nx=
    player.x+
    (
      fx*forward+
      rx*side
    )*speed;

  const nz=
    player.z+
    (
      fz*forward+
      rz*side
    )*speed;

  if(
    !blocked(
      nx,
      player.z
    )
  )
    player.x=nx;

  if(
    !blocked(
      player.x,
      nz
    )
  )
    player.z=nz;


  camera.position.set(
    player.x,
    player.y,
    player.z
  );

  camera.rotation.order=
    "YXZ";

  camera.rotation.y=
    player.angle;

  camera.rotation.x=
    player.pitch;
}


/* =====================================================
   ZUMBIS
===================================================== */

function updateZombies(){

  for(
    const z of zombies
  ){

    const dx=
      player.x-
      z.mesh.position.x;

    const dz=
      player.z-
      z.mesh.position.z;

    const dist=
      Math.hypot(dx,dz);


    /* SEM DEITAR */

    z.mesh.position.y=0;

    if(dist>2.4){

      const nx=
        z.mesh.position.x+
        dx/dist*z.speed;

      const nz=
        z.mesh.position.z+
        dz/dist*z.speed;

      if(
        !blocked(
          nx,
          z.mesh.position.z
        )
      )
        z.mesh.position.x=nx;

      if(
        !blocked(
          z.mesh.position.x,
          nz
        )
      )
        z.mesh.position.z=nz;


      /* olha somente no eixo vertical */

      const angle=
        Math.atan2(
          dx,
          dz
        );

      z.mesh.rotation.y=
        angle;


      /* caminhada */

      z.phase+=.15;

      const walk=
        Math.sin(
          z.phase
        )*.45;

      z.leftLeg.rotation.x=
        walk;

      z.rightLeg.rotation.x=
        -walk;

      z.leftArm.rotation.x=
        -walk*.5;

      z.rightArm.rotation.x=
        walk*.5;

    }else{

      /* ataque */

      z.attack++;

      z.mesh.rotation.y=
        Math.atan2(
          dx,
          dz
        );

      z.leftArm.rotation.x=
        -1;

      z.rightArm.rotation.x=
        -1;

      if(
        z.attack%70===0
      ){

        player.health-=8;

        document.getElementById(
          "hp"
        ).style.width=
          Math.max(
            0,
            player.health
          )+"%";

        damageEffect();

        sound(55,.2);

        if(
          player.health<=0
        )
          gameOver();
      }
    }
  }
}


/* =====================================================
   DANO
===================================================== */

function damageEffect(){

  const d=
    document.getElementById(
      "damage"
    );

  d.style.opacity=.5;

  setTimeout(()=>{
    d.style.opacity=0;
  },130);
}


/* =====================================================
   GAME OVER
===================================================== */

let kills=0;
let dead=false;

function gameOver(){

  if(dead)
    return;

  dead=true;

  document.getElementById(
    "finalKills"
  ).textContent=kills;

  document.getElementById(
    "gameover"
  ).style.display="flex";
}


/* =====================================================
   START
===================================================== */

document.getElementById(
  "start"
).onclick=()=>{

  audioStart();

  document.getElementById(
    "menu"
  ).style.display="none";
};


/* =====================================================
   LOOP
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(dead)
    return;

  updatePlayer();
  updateZombies();

  if(firing)
    shoot();

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
