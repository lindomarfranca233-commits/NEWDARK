<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Zombie Survival 3D</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}

#hud{
 position:fixed;
 top:12px;
 left:12px;
 z-index:20;
 color:white;
 font-family:Arial;
 font-weight:bold;
 text-shadow:2px 2px 4px #000;
}

#lifeBox{
 width:190px;
 height:20px;
 border:2px solid white;
 background:#222;
 margin-top:5px;
}

#life{
 width:100%;
 height:100%;
 background:#19d64b;
}

#cross{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 color:white;
 font-size:30px;
 z-index:10;
 text-shadow:0 0 5px black;
}

#shoot{
 position:fixed;
 right:25px;
 bottom:30px;
 width:90px;
 height:90px;
 border-radius:50%;
 border:3px solid white;
 background:#8e0000;
 color:white;
 font-weight:bold;
 font-size:17px;
 z-index:30;
}

#run{
 position:fixed;
 right:130px;
 bottom:42px;
 width:65px;
 height:65px;
 border-radius:50%;
 border:2px solid white;
 background:#333;
 color:white;
 z-index:30;
}

#stickArea{
 position:fixed;
 left:25px;
 bottom:30px;
 width:125px;
 height:125px;
 border-radius:50%;
 border:3px solid rgba(255,255,255,.4);
 background:rgba(255,255,255,.08);
 z-index:30;
}

#stick{
 position:absolute;
 width:55px;
 height:55px;
 left:32px;
 top:32px;
 border-radius:50%;
 background:rgba(255,255,255,.5);
}

#damage{
 position:fixed;
 inset:0;
 background:rgba(255,0,0,.4);
 opacity:0;
 z-index:15;
 pointer-events:none;
}

#gameOver{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:rgba(0,0,0,.8);
 color:white;
 z-index:100;
 font-family:Arial;
 text-align:center;
}

#gameOver h1{
 font-size:45px;
 margin-bottom:15px;
}

#restart{
 padding:15px 25px;
 font-size:18px;
 border:0;
 border-radius:8px;
}
</style>
</head>

<body>

<div id="hud">
 VIDA
 <div id="lifeBox"><div id="life"></div></div>
 ZUMBIS: <span id="kills">0</span>
</div>

<div id="cross">+</div>
<div id="damage"></div>

<div id="stickArea">
 <div id="stick"></div>
</div>

<button id="run">🏃</button>
<button id="shoot">🔫<br>ATIRAR</button>

<div id="gameOver">
 <h1>VOCÊ MORREU</h1>
 <p>Você eliminou <span id="finalKills">0</span> zumbis.</p>
 <br>
 <button id="restart">JOGAR NOVAMENTE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

let scene,camera,renderer;

let player={
 x:0,
 y:1.7,
 z:0,
 health:100,
 speed:0.11,
 angle:0,
 pitch:0
};

let zombies=[];
let bullets=[];
let cars=[];
let trees=[];
let buildings=[];

let kills=0;
let gameEnded=false;

let moveX=0;
let moveY=0;
let running=false;

let shooting=false;
let lastShot=0;

/* =========================================================
   CENA
========================================================= */

scene=new THREE.Scene();

scene.background=new THREE.Color(0x02050a);

scene.fog=new THREE.FogExp2(0x02050a,0.008);

/* =========================================================
   CÂMERA
========================================================= */

camera=new THREE.PerspectiveCamera(
 70,
 innerWidth/innerHeight,
 .05,
 1200
);

camera.position.set(
 player.x,
 player.y,
 player.z
);

/* =========================================================
   RENDER
========================================================= */

renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* =========================================================
   ILUMINAÇÃO NOTURNA
========================================================= */

const moonLight=new THREE.DirectionalLight(
 0x9bb7ff,
 1.1
);

moonLight.position.set(-100,150,-100);
moonLight.castShadow=true;

moonLight.shadow.mapSize.width=1024;
moonLight.shadow.mapSize.height=1024;

scene.add(moonLight);

const ambient=new THREE.HemisphereLight(
 0x405070,
 0x080a08,
 .45
);

scene.add(ambient);

/* =========================================================
   LUA
========================================================= */

const moonGeo=new THREE.SphereGeometry(25,32,32);

const moonMat=new THREE.MeshBasicMaterial({
 color:0xffffdd
});

const moon=new THREE.Mesh(moonGeo,moonMat);

moon.position.set(-250,300,-400);

scene.add(moon);

/* =========================================================
   CHÃO
========================================================= */

const groundGeo=new THREE.PlaneGeometry(
 2000,
 2000
);

const groundMat=new THREE.MeshStandardMaterial({
 color:0x17231a,
 roughness:1
});

const ground=new THREE.Mesh(
 groundGeo,
 groundMat
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* =========================================================
   ESTRADA
========================================================= */

function createRoad(x,z,w,d){

 const geo=new THREE.BoxGeometry(w,.08,d);

 const mat=new THREE.MeshStandardMaterial({
   color:0x151719,
   roughness:.9
 });

 const road=new THREE.Mesh(geo,mat);

 road.position.set(x,.03,z);

 scene.add(road);

}

createRoad(0,0,35,1000);
createRoad(0,0,1000,35);

/* =========================================================
   PRÉDIOS
========================================================= */

function createBuilding(x,z,w,h,d){

 const geo=new THREE.BoxGeometry(w,h,d);

 const mat=new THREE.MeshStandardMaterial({
   color:0x343536,
   roughness:.9
 });

 const b=new THREE.Mesh(geo,mat);

 b.position.set(x,h/2,z);

 b.castShadow=true;
 b.receiveShadow=true;

 scene.add(b);

 buildings.push(b);

 /* janelas */

 for(let i=0;i<3;i++){

   const windowGeo=new THREE.BoxGeometry(
     .8,
     1.2,
     .05
   );

   const windowMat=new THREE.MeshBasicMaterial({
     color:0xb58d35
   });

   const win=new THREE.Mesh(
     windowGeo,
     windowMat
   );

   win.position.set(
     x-w/2+.7+i*1.4,
     h*.65,
     z-d/2-.03
   );

   scene.add(win);
 }
}

createBuilding(-75,-70,35,25,35);
createBuilding(75,-80,40,30,40);
createBuilding(-90,80,45,28,35);
createBuilding(90,75,35,22,40);

createBuilding(-160,-160,55,35,45);
createBuilding(160,-170,45,28,50);

/* =========================================================
   ÁRVORES
========================================================= */

function createTree(x,z,s=1){

 const trunkGeo=new THREE.CylinderGeometry(
   .35*s,
   .5*s,
   5*s,
   8
 );

 const trunkMat=new THREE.MeshStandardMaterial({
   color:0x39251a
 });

 const trunk=new THREE.Mesh(
   trunkGeo,
   trunkMat
 );

 trunk.position.set(x,2.5*s,z);

 trunk.castShadow=true;

 scene.add(trunk);

 const leafGeo=new THREE.SphereGeometry(
   3*s,
   10,
   10
 );

 const leafMat=new THREE.MeshStandardMaterial({
   color:0x102d18
 });

 const leaves=new THREE.Mesh(
   leafGeo,
   leafMat
 );

 leaves.position.set(x,6*s,z);

 leaves.castShadow=true;

 scene.add(leaves);

 trees.push({trunk,leaves});
}

for(let i=0;i<80;i++){

 let x=(Math.random()-.5)*800;
 let z=(Math.random()-.5)*800;

 if(Math.abs(x)<50 || Math.abs(z)<50) continue;

 createTree(
   x,
   z,
   .7+Math.random()*1.3
 );
}

/* =========================================================
   CARROS
========================================================= */

function createCar(x,z,color){

 const group=new THREE.Group();

 /* corpo */

 const bodyGeo=new THREE.BoxGeometry(
   5,
   1.3,
   9
 );

 const bodyMat=new THREE.MeshStandardMaterial({
   color:color,
   roughness:.6,
   metalness:.15
 });

 const body=new THREE.Mesh(
   bodyGeo,
   bodyMat
 );

 body.position.y=1.3;
 body.castShadow=true;

 group.add(body);

 /* teto */

 const roofGeo=new THREE.BoxGeometry(
   4.3,
   1.1,
   4.5
 );

 const roofMat=new THREE.MeshStandardMaterial({
   color:0x15191d,
   roughness:.4
 });

 const roof=new THREE.Mesh(
   roofGeo,
   roofMat
 );

 roof.position.y=2.35;

 group.add(roof);

 /* rodas */

 const wheelGeo=new THREE.CylinderGeometry(
   .9,
   .9,
   .5,
   16
 );

 const wheelMat=new THREE.MeshStandardMaterial({
   color:0x080808
 });

 const wheelPositions=[
  [-2.5,.9,-3],
  [2.5,.9,-3],
  [-2.5,.9,3],
  [2.5,.9,3]
 ];

 for(const p of wheelPositions){

   const wheel=new THREE.Mesh(
     wheelGeo,
     wheelMat
   );

   wheel.rotation.z=Math.PI/2;

   wheel.position.set(
     p[0],
     p[1],
     p[2]
   );

   wheel.castShadow=true;

   group.add(wheel);
 }

 group.position.set(x,0,z);

 group.rotation.y=Math.random()*Math.PI*2;

 scene.add(group);

 cars.push(group);
}

createCar(-25,-25,0x9b2020);
createCar(30,-30,0x263f7a);
createCar(-30,30,0x777777);
createCar(28,30,0xb18425);

/* =========================================================
   ZUMBIS
========================================================= */

function createZombie(x,z){

 const group=new THREE.Group();

 /* pernas */

 const legMat=new THREE.MeshStandardMaterial({
   color:0x222222
 });

 const legGeo=new THREE.BoxGeometry(
   .45,
   1.5,
   .55
 );

 const leg1=new THREE.Mesh(legGeo,legMat);
 const leg2=new THREE.Mesh(legGeo,legMat);

 leg1.position.set(-.3,.75,0);
 leg2.position.set(.3,.75,0);

 group.add(leg1,leg2);

 /* corpo */

 const bodyGeo=new THREE.BoxGeometry(
   1.3,
   1.8,
   .8
 );

 const bodyMat=new THREE.MeshStandardMaterial({
   color:0x40543b
 });

 const body=new THREE.Mesh(
   bodyGeo,
   bodyMat
 );

 body.position.y=2;

 body.castShadow=true;

 group.add(body);

 /* cabeça */

 const headGeo=new THREE.SphereGeometry(
   .55,
   12,
   12
 );

 const headMat=new THREE.MeshStandardMaterial({
   color:0x71806a
 });

 const head=new THREE.Mesh(
   headGeo,
   headMat
 );

 head.position.y=3.25;

 head.castShadow=true;

 group.add(head);

 /* olhos */

 const eyeGeo=new THREE.SphereGeometry(
   .08,
   8,
   8
 );

 const eyeMat=new THREE.MeshBasicMaterial({
   color:0xff0000
 });

 const eye1=new THREE.Mesh(eyeGeo,eyeMat);
 const eye2=new THREE.Mesh(eyeGeo,eyeMat);

 eye1.position.set(-.2,3.35,-.48);
 eye2.position.set(.2,3.35,-.48);

 group.add(eye1,eye2);

 /* braços */

 const armGeo=new THREE.BoxGeometry(
   .4,
   1.7,
   .45
 );

 const arm1=new THREE.Mesh(armGeo,bodyMat);
 const arm2=new THREE.Mesh(armGeo,bodyMat);

 arm1.position.set(-.95,2,0);
 arm2.position.set(.95,2,0);

 group.add(arm1,arm2);

 group.position.set(x,0,z);

 scene.add(group);

 zombies.push({
   mesh:group,
   hp:3,
   speed:.025+Math.random()*.025,
   attack:0,
   growl:Math.random()*300
 });
}

/* criar muitos */

for(let i=0;i<35;i++){

 let a=Math.random()*Math.PI*2;
 let d=80+Math.random()*500;

 createZombie(
   Math.cos(a)*d,
   Math.sin(a)*d
 );
}

/* =========================================================
   ARMA
========================================================= */

const weapon=new THREE.Group();

const gunMat=new THREE.MeshStandardMaterial({
 color:0x171717,
 metalness:.7,
 roughness:.3
});

const gunBody=new THREE.Mesh(
 new THREE.BoxGeometry(.45,.5,1.8),
 gunMat
);

gunBody.position.set(
 .45,
 -.42,
 -.9
);

weapon.add(gunBody);

const barrel=new THREE.Mesh(
 new THREE.CylinderGeometry(
   .09,.09,1.5,12
 ),
 gunMat
);

barrel.rotation.x=Math.PI/2;

barrel.position.set(
 .45,
 -.4,
 -1.9
);

weapon.add(barrel);

camera.add(weapon);
scene.add(camera);

/* =========================================================
   SOM
========================================================= */

let audioCtx=null;

function audioStart(){

 if(!audioCtx){

   audioCtx=
   new(window.AudioContext||
   window.webkitAudioContext)();

 }
}

function gunSound(){

 audioStart();

 const osc=
 audioCtx.createOscillator();

 const gain=
 audioCtx.createGain();

 osc.type="sawtooth";

 osc.frequency.setValueAtTime(
   130,
   audioCtx.currentTime
 );

 osc.frequency.exponentialRampToValueAtTime(
   45,
   audioCtx.currentTime+.12
 );

 gain.gain.setValueAtTime(
   .6,
   audioCtx.currentTime
 );

 gain.gain.exponentialRampToValueAtTime(
   .01,
   audioCtx.currentTime+.14
 );

 osc.connect(gain);
 gain.connect(audioCtx.destination);

 osc.start();
 osc.stop(audioCtx.currentTime+.14);
}

function zombieSound(){

 audioStart();

 const osc=
 audioCtx.createOscillator();

 const gain=
 audioCtx.createGain();

 osc.type="sawtooth";

 osc.frequency.setValueAtTime(
   90,
   audioCtx.currentTime
 );

 osc.frequency.linearRampToValueAtTime(
   40,
   audioCtx.currentTime+.4
 );

 gain.gain.value=.08;

 osc.connect(gain);
 gain.connect(audioCtx.destination);

 osc.start();
 osc.stop(audioCtx.currentTime+.4);
}

/* =========================================================
   TIRO
========================================================= */

function shoot(){

 if(gameEnded)return;

 const now=performance.now();

 if(now-lastShot<180)return;

 lastShot=now;

 gunSound();

 /* flash */

 const flash=new THREE.PointLight(
   0xffbb55,
   5,
   8
 );

 flash.position.set(
   .45,
   -.4,
   -2.5
 );

 weapon.add(flash);

 setTimeout(()=>{
   weapon.remove(flash);
 },60);

 /* bala */

 const direction=new THREE.Vector3();

 camera.getWorldDirection(direction);

 bullets.push({
   position:camera.position.clone(),
   direction:direction,
   life:0
 });
}

/* =========================================================
   CONTROLES DE TOQUE
========================================================= */

const stickArea=
document.getElementById("stickArea");

const stick=
document.getElementById("stick");

let joystickActive=false;

stickArea.addEventListener(
 "pointerdown",
 e=>{
   joystickActive=true;
   stickArea.setPointerCapture(e.pointerId);
   updateJoystick(e);
 }
);

stickArea.addEventListener(
 "pointermove",
 e=>{
   if(joystickActive)
     updateJoystick(e);
 }
);

stickArea.addEventListener(
 "pointerup",
 ()=>{
   joystickActive=false;
   moveX=0;
   moveY=0;

   stick.style.left="32px";
   stick.style.top="32px";
 }
);

function updateJoystick(e){

 const r=stickArea.getBoundingClientRect();

 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;

 const max=42;

 const dist=Math.hypot(dx,dy);

 if(dist>max){

   dx=dx/dist*max;
   dy=dy/dist*max;

 }

 moveX=dx/max;
 moveY=dy/max;

 stick.style.left=(32+dx)+"px";
 stick.style.top=(32+dy)+"px";
}

/* correr */

document.getElementById("run")
.addEventListener("pointerdown",()=>{
 running=true;
});

document.getElementById("run")
.addEventListener("pointerup",()=>{
 running=false;
});

/* atirar */

document.getElementById("shoot")
.addEventListener("pointerdown",()=>{
 audioStart();
 shooting=true;
});

document.getElementById("shoot")
.addEventListener("pointerup",()=>{
 shooting=false;
});

/* teclado */

const keys={};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* =========================================================
   OLHAR COM O DEDO
========================================================= */

let lookActive=false;
let lastLookX=0;
let lastLookY=0;

renderer.domElement.addEventListener(
 "pointerdown",
 e=>{
   lookActive=true;
   lastLookX=e.clientX;
   lastLookY=e.clientY;
 }
);

renderer.domElement.addEventListener(
 "pointermove",
 e=>{

   if(!lookActive)return;

   const dx=e.clientX-lastLookX;
   const dy=e.clientY-lastLookY;

   lastLookX=e.clientX;
   lastLookY=e.clientY;

   player.angle-=dx*.004;
   player.pitch-=dy*.003;

   player.pitch=
   Math.max(
     -1.2,
     Math.min(1.2,player.pitch)
   );
 }
);

renderer.domElement.addEventListener(
 "pointerup",
 ()=>{
   lookActive=false;
 }
);

/* =========================================================
   ATUALIZAÇÃO DO JOGADOR
========================================================= */

function updatePlayer(){

 let x=moveX;
 let y=moveY;

 if(keys["w"])y=-1;
 if(keys["s"])y=1;
 if(keys["a"])x=-1;
 if(keys["d"])x=1;

 const speed=
 running
 ?player.speed*1.7
 :player.speed;

 /* frente */

 const forwardX=
 Math.sin(player.angle);

 const forwardZ=
 Math.cos(player.angle);

 /* lateral */

 const rightX=
 Math.cos(player.angle);

 const rightZ=
 -Math.sin(player.angle);

 player.x+=
 (-forwardX*y+rightX*x)*speed;

 player.z+=
 (-forwardZ*y+rightZ*x)*speed;

 /* limite */

 player.x=
 Math.max(-900,Math.min(900,player.x));

 player.z=
 Math.max(-900,Math.min(900,player.z));

 camera.position.set(
   player.x,
   player.y,
   player.z
 );

 camera.rotation.order="YXZ";

 camera.rotation.y=
 player.angle;

 camera.rotation.x=
 player.pitch;
}

/* =========================================================
   BALAS
========================================================= */

function updateBullets(){

 for(let i=bullets.length-1;i>=0;i--){

   const b=bullets[i];

   b.position.addScaledVector(
     b.direction,
     .9
   );

   b.life++;

   let hit=false;

   for(let j=zombies.length-1;j>=0;j--){

     const z=zombies[j];

     const dist=
     b.position.distanceTo(
       z.mesh.position
     );

     if(dist<2.5){

       z.hp--;

       hit=true;

       if(z.hp<=0){

         scene.remove(z.mesh);

         zombies.splice(j,1);

         kills++;

         document.getElementById(
           "kills"
         ).textContent=kills;
       }

       break;
     }
   }

   if(hit || b.life>100){

     bullets.splice(i,1);
   }
 }
}

/* =========================================================
   ZUMBIS
========================================================= */

function updateZombies(){

 for(const z of zombies){

   const dx=
   player.x-z.mesh.position.x;

   const dz=
   player.z-z.mesh.position.z;

   const distance=
   Math.hypot(dx,dz);

   if(distance>2.3){

     z.mesh.position.x+=
     dx/distance*z.speed;

     z.mesh.position.z+=
     dz/distance*z.speed;

     z.mesh.lookAt(
       player.x,
       1.5,
       player.z
     );

   }else{

     z.attack++;

     if(z.attack>35){

       player.health-=7;

       z.attack=0;

       damageEffect();

       if(player.health<=0){
         endGame();
       }
     }
   }

   z.growl--;

   if(
     z.growl<=0 &&
     distance<80
   ){

     zombieSound();

     z.growl=
     300+Math.random()*500;
   }
 }
}

/* =========================================================
   DANO
========================================================= */

function damageEffect(){

 const damage=
 document.getElementById("damage");

 damage.style.opacity=.8;

 setTimeout(()=>{
   damage.style.opacity=0;
 },150);

 document.getElementById(
   "life"
 ).style.width=
 Math.max(0,player.health)+"%";
}

/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

 if(gameEnded)return;

 gameEnded=true;

 document.getElementById(
   "finalKills"
 ).textContent=kills;

 document.getElementById(
   "gameOver"
 ).style.display="flex";
}

document.getElementById("restart")
.addEventListener("click",()=>{
 location.reload();
});

/* =========================================================
   LOOP
========================================================= */

function animate(){

 requestAnimationFrame(animate);

 if(gameEnded)return;

 updatePlayer();
 updateBullets();
 updateZombies();

 /* tiro automático enquanto segura */

 if(shooting){
   shoot();
 }

 renderer.render(
   scene,
   camera
 );
}

animate();

/* =========================================================
   REDIMENSIONAMENTO
========================================================= */

addEventListener("resize",()=>{

 camera.aspect=
 innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
   innerWidth,
   innerHeight
 );

});

</script>

</body>
</html>
