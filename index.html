<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEW DARK V13</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#76b9ec;font-family:Arial,sans-serif;
 user-select:none
}
canvas{display:block;touch-action:none}

#menu,#gameover{
 position:fixed;inset:0;z-index:100;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 color:white;text-align:center;
 background:linear-gradient(#61afe9,#14283d)
}
#menu h1{
 font-size:55px;letter-spacing:8px;
 text-shadow:3px 3px 8px #000;
 margin:0 0 8px
}
button{
 border:2px solid white;border-radius:12px;
 background:#17486b;color:white;
 padding:13px 20px;font-weight:bold
}

#hud{
 position:fixed;top:10px;left:10px;
 z-index:30;color:white;font-weight:bold;
 text-shadow:2px 2px 4px #000
}
#bar{
 width:170px;height:17px;
 border:2px solid white;background:#333
}
#hp{height:100%;width:100%;background:#21d65a}

#weapon{
 position:fixed;right:12px;top:10px;
 z-index:30;color:white;font-weight:bold;
 text-shadow:2px 2px 4px #000
}

#cross{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 z-index:20;color:white;font-size:27px;
 text-shadow:0 0 5px #000
}

#damage{
 position:fixed;inset:0;z-index:25;
 pointer-events:none;background:#e00000;
 opacity:0
}

#scope{
 display:none;position:fixed;inset:0;
 z-index:24;pointer-events:none
}
#scope:before{
 content:"";position:absolute;inset:0;
 background:radial-gradient(
 circle,transparent 0 22%,
 rgba(0,0,0,.97) 28%
 )
}
#scope:after{
 content:"";position:absolute;
 left:50%;top:15%;bottom:15%;
 width:2px;background:white
}
#scopeLine{
 position:absolute;left:15%;right:15%;
 top:50%;height:2px;background:white
}

#zoom{
 display:none;
 position:fixed;right:12px;top:48px;
 z-index:30;color:white;font-weight:bold
}

#joy{
 position:fixed;left:18px;bottom:18px;
 width:130px;height:130px;
 border:3px solid #ffffff55;
 border-radius:50%;
 background:#ffffff12;
 z-index:40
}
#knob{
 position:absolute;left:37px;top:37px;
 width:52px;height:52px;border-radius:50%;
 background:#ffffff88
}

.action{
 position:fixed;z-index:40;
 width:68px;height:68px;
 border-radius:50%;padding:0
}
#fire{
 right:18px;bottom:18px;
 width:92px;height:92px;background:#941b1b
}
#switch{
 right:125px;bottom:105px;
 background:#23577b
}
#aim{
 display:none;right:200px;bottom:105px;
 background:#2e5875
}
#zoomBtn{
 display:none;right:200px;bottom:28px;
 background:#394d5d
}

#mini{
 position:fixed;
 right:10px;
 top:82px;
 width:105px;height:105px;
 border:2px solid white;
 border-radius:50%;
 overflow:hidden;
 z-index:35;
 background:#52784b;
 opacity:.9
}
#miniCanvas{
 width:100%;height:100%
}

#gameover{display:none}
</style>
</head>

<body>

<div id="menu">
 <h1>NEW DARK</h1>
 <p>V13 • SURVIVAL</p>
 <button id="start">JOGAR</button>
</div>

<div id="hud">
 VIDA
 <div id="bar"><div id="hp"></div></div>
 🧟 <span id="kills">0</span>
</div>

<div id="weapon">PISTOLA</div>

<div id="cross">+</div>

<div id="scope">
 <div id="scopeLine"></div>
</div>

<div id="zoom">ZOOM 1X</div>

<div id="damage"></div>

<div id="joy">
 <div id="knob"></div>
</div>

<button id="fire" class="action">🔫<br>ATIRAR</button>
<button id="switch" class="action">🔄</button>
<button id="aim" class="action">🎯</button>
<button id="zoomBtn" class="action">🔭</button>

<div id="mini">
 <canvas id="miniCanvas"></canvas>
</div>

<div id="gameover">
 <h1>VOCÊ MORREU</h1>
 <p>Zumbis eliminados: <span id="finalKills">0</span></p>
 <button onclick="location.reload()">JOGAR NOVAMENTE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   CENA
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x76baf0);

scene.fog=new THREE.Fog(
 0x76baf0,80,750
);

const camera=new THREE.PerspectiveCamera(
 70,
 innerWidth/innerHeight,
 .05,
 1500
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* =========================================================
   ILUMINAÇÃO
========================================================= */

scene.add(
 new THREE.HemisphereLight(
  0xbfe8ff,
  0x45583b,
  1.5
 )
);

const sun=new THREE.DirectionalLight(
  0xffffff,3
);

sun.position.set(-180,300,-180);
sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);

/* =========================================================
   TERRENO
========================================================= */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(2200,2200),
 new THREE.MeshStandardMaterial({
  color:0x4e7047,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* =========================================================
   RUAS
========================================================= */

function road(x,z,w,d){

const r=new THREE.Mesh(
 new THREE.BoxGeometry(w,.08,d),
 new THREE.MeshStandardMaterial({
  color:0x42474a,
  roughness:.95
 })
);

r.position.set(x,.04,z);
r.receiveShadow=true;

scene.add(r);
}

road(0,0,55,1100);
road(0,0,1100,55);

/* =========================================================
   COLISÕES
========================================================= */

const walls=[];

function addCollision(x,z,w,d){

walls.push({
 x,z,w,d
 });
}

function blocked(x,z){

const r=.65;

return walls.some(c=>
 x>c.x-c.w/2-r &&
 x<c.x+c.w/2+r &&
 z>c.z-c.d/2-r &&
 z<c.z+c.d/2+r
 );
}

/* =========================================================
   CASAS COM PORTAS
========================================================= */

const doors=[];

function createHouse(x,z,w,d,h){

const g=new THREE.Group();

/* paredes */

const wallMat=
new THREE.MeshStandardMaterial({
 color:0x96705a,
 roughness:.9
});

const wall=new THREE.Mesh(
 new THREE.BoxGeometry(w,h,d),
 wallMat
);

wall.position.y=h/2;
wall.castShadow=true;
wall.receiveShadow=true;

g.add(wall);

/* telhado */

const roof=new THREE.Mesh(
 new THREE.ConeGeometry(
  Math.max(w,d)*.7,
  5,
  4
 ),
 new THREE.MeshStandardMaterial({
  color:0x35302d,
  roughness:.8
 )
);

roof.rotation.y=Math.PI/4;
roof.position.y=h+2.5;
roof.castShadow=true;

g.add(roof);

/* porta */

const door=new THREE.Mesh(
 new THREE.BoxGeometry(
  2.2,3.5,.18
 ),
 new THREE.MeshStandardMaterial({
  color:0x4c2d1c,
  roughness:.8
 })
);

door.position.set(
 0,1.75,d/2+.12
);

door.userData.open=false;

g.add(door);

/* maçaneta */

const handle=new THREE.Mesh(
 new THREE.SphereGeometry(.09,10,10),
 new THREE.MeshStandardMaterial({
  color:0xd5ad4a,
  metalness:.8
 })
);

handle.position.set(
 .65,1.75,d/2+.25
);

g.add(handle);

/* janela */

for(const side of [-1,1]){

const win=new THREE.Mesh(
 new THREE.BoxGeometry(
  2.5,1.5,.1
 ),
 new THREE.MeshStandardMaterial({
  color:0x65b5e4,
  roughness:.2,
  metalness:.1
 })
);

win.position.set(
 side*w*.27,
 h*.58,
 d/2+.08
);

g.add(win);
}

/* luz interna */

const insideLight=new THREE.PointLight(
 0xffd98a,
 5,
 18
);

insideLight.position.set(
 0,h*.55,0
);

g.add(insideLight);

/* piso */

const floor=new THREE.Mesh(
 new THREE.BoxGeometry(
  w-.4,.1,d-.4
 ),
 new THREE.MeshStandardMaterial({
  color:0x765b4b
 })
);

floor.position.y=.05;

g.add(floor);

/* escada interna */

for(let i=0;i<7;i++){

const step=new THREE.Mesh(
 new THREE.BoxGeometry(
  2.8,.35,1
 ),
 new THREE.MeshStandardMaterial({
  color:0x604433
 })
);

step.position.set(
 -w/3+i*.12,
 .25+i*.38,
 -d/4+i*.3
);

g.add(step);
}

g.position.set(x,0,z);

scene.add(g);

/* colisões deixam a frente aberta */
addCollision(
 x,z-d/2,
 w,.4
);

addCollision(
 x-w/2,z,
 .4,d
);

addCollision(
 x+w/2,z,
 .4,d
);

addCollision(
 x,z+d/2,
 (w-2.8),.4
);

doors.push({
 mesh:door,
 x:x,
 z:z+d/2,
 open:false
 });
}

/* casas */

createHouse(-70,-80,34,30,16);
createHouse(70,-80,34,30,17);
createHouse(-75,80,36,31,17);
createHouse(75,80,36,31,18);

createHouse(-155,-115,42,35,22);
createHouse(155,-115,42,35,23);

/* =========================================================
   PRÉDIOS
========================================================= */

function building(x,z,w,d,h){

const b=new THREE.Mesh(
 new THREE.BoxGeometry(w,h,d),
 new THREE.MeshStandardMaterial({
  color:0x70767a,
  roughness:.85
 })
);

b.position.set(x,h/2,z);
b.castShadow=true;
b.receiveShadow=true;

scene.add(b);

addCollision(x,z,w,d);

/* janelas */

for(let y=5;y<h-2;y+=5){

for(let xx=-w/2+4;xx<w/2-3;xx+=6){

const win=new THREE.Mesh(
 new THREE.BoxGeometry(
  2.2,2.2,.08
 ),
 new THREE.MeshStandardMaterial({
  color:0x68b1db,
  roughness:.2
 })
);

win.position.set(
 x+xx,
 y,
 z-d/2-.06
);

scene.add(win);
}
}
}

building(-225,-70,55,45,38);
building(225,-70,60,48,45);
building(-225,80,52,48,42);
building(225,85,55,45,50);

/* =========================================================
   POSTES
========================================================= */

function createLamp(x,z){

const pole=new THREE.Mesh(
 new THREE.CylinderGeometry(
  .12,.16,7,12
 ),
 new THREE.MeshStandardMaterial({
  color:0x292d30,
  metalness:.7
 })
);

pole.position.set(x,3.5,z);
pole.castShadow=true;

scene.add(pole);

const bulb=new THREE.Mesh(
 new THREE.SphereGeometry(.25,12,12),
 new THREE.MeshStandardMaterial({
  color:0xffe6a3,
  emissive:0x8c6b28
 })
);

bulb.position.set(x,7,z);

scene.add(bulb);
}

for(let i=-450;i<=450;i+=45){
 createLamp(i,-32);
 createLamp(i,32);
}

/* =========================================================
   CARROS
========================================================= */

function createCar(x,z,color){

const g=new THREE.Group();

const paint=
new THREE.MeshStandardMaterial({
 color,
 metalness:.65,
 roughness:.25
});

const dark=
new THREE.MeshStandardMaterial({
 color:0x111315,
 roughness:.3
});

const body=new THREE.Mesh(
 new THREE.BoxGeometry(5.3,1.25,8),
 paint
);

body.position.y=1.15;
body.castShadow=true;

g.add(body);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(4.1,1.3,4),
 dark
);

cabin.position.y=2.1;

g.add(cabin);

const glass=
new THREE.MeshStandardMaterial({
 color:0x72b6d5,
 roughness:.1,
 metalness:.2
});

const windshield=new THREE.Mesh(
 new THREE.BoxGeometry(
  3.5,.85,.08
 ),
 glass
);

windshield.position.set(
 0,2.2,-2.03
);

g.add(windshield);

/* rodas */

for(const p of [
 [-2.55,.75,-2.5],
 [ 2.55,.75,-2.5],
 [-2.55,.75, 2.5],
 [ 2.55,.75, 2.5]
]){

const wheel=new THREE.Mesh(
 new THREE.CylinderGeometry(
  .8,.8,.55,20
 ),
 dark
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(...p);

g.add(wheel);
}

g.position.set(x,0,z);

scene.add(g);
}

createCar(-18,-58,0xa52b2b);
createCar(18,-58,0x245d9c);
createCar(-18,58,0x777777);
createCar(18,58,0xc28c2f);

/* =========================================================
   ZUMBIS
========================================================= */

const zombies=[];

function createZombie(x,z){

const g=new THREE.Group();

const skin=
new THREE.MeshStandardMaterial({
 color:0x849477,
 roughness:1
});

const shirt=
new THREE.MeshStandardMaterial({
 color:0x465848,
 roughness:.95
});

const pants=
new THREE.MeshStandardMaterial({
 color:0x292f34,
 roughness:.9
});

const shoe=
new THREE.MeshStandardMaterial({
 color:0x111315,
 roughness:.8
});

/* pernas */

const leftLeg=new THREE.Group();
const rightLeg=new THREE.Group();

const legGeo=
new THREE.CapsuleGeometry(
 .14,.85,5,10
);

const lLeg=new THREE.Mesh(
 legGeo,pants
);

lLeg.position.y=-.8;

leftLeg.add(lLeg);

const rLeg=new THREE.Mesh(
 legGeo,pants
);

rLeg.position.y=-.8;

rightLeg.add(rLeg);

/* pés */

const lFoot=new THREE.Mesh(
 new THREE.BoxGeometry(.42,.2,.72),
 shoe
);

lFoot.position.set(0,-1.7,-.2);
leftLeg.add(lFoot);

const rFoot=lFoot.clone();
rightLeg.add(rFoot);

leftLeg.position.set(-.25,1.8,0);
rightLeg.position.set(.25,1.8,0);

g.add(leftLeg,rightLeg);

/* corpo */

const torso=new THREE.Mesh(
 new THREE.CapsuleGeometry(
  .36,1,6,14
 ),
 shirt
);

torso.position.y=2.35;
torso.scale.y=1.25;

g.add(torso);

/* pescoço */

const neck=new THREE.Mesh(
 new THREE.CylinderGeometry(
  .16,.18,.3,12
 ),
 skin
);

neck.position.y=3.5;

g.add(neck);

/* cabeça */

const head=new THREE.Mesh(
 new THREE.SphereGeometry(
  .58,24,20
 ),
 skin
);

head.position.y=4.05;

g.add(head);

/* olhos */

const redEye=
new THREE.MeshStandardMaterial({
 color:0xff0000,
 emissive:0xaa0000
});

for(const side of [-1,1]){

const eye=new THREE.Mesh(
 new THREE.SphereGeometry(
  .09,12,12
 ),
 redEye
);

eye.position.set(
 side*.21,
 4.12,
 -.55
);

g.add(eye);

/* sobrancelha */

const brow=new THREE.Mesh(
 new THREE.BoxGeometry(
  .27,.07,.07
 ),
 new THREE.MeshStandardMaterial({
  color:0x33362f
 })
);

brow.position.set(
 side*.21,
 4.28,
 -.54
);

g.add(brow);

/* orelha */

const ear=new THREE.Mesh(
 new THREE.SphereGeometry(
  .14,10,10
 ),
 skin
);

ear.position.set(
 side*.57,
 4.03,
 0
);

g.add(ear);
}

/* nariz */

const nose=new THREE.Mesh(
 new THREE.SphereGeometry(
  .12,12,10
 ),
 skin
);

nose.position.set(
 0,3.94,-.6
);

g.add(nose);

/* boca */

const mouth=new THREE.Mesh(
 new THREE.BoxGeometry(
  .48,.16,.08
 ),
 new THREE.MeshStandardMaterial({
  color:0x160404
 })
);

mouth.position.set(
 0,3.78,-.58
);

g.add(mouth);

/* dentes */

for(let i=-1;i<=1;i++){

const tooth=new THREE.Mesh(
 new THREE.BoxGeometry(
  .08,.1,.05
 ),
 new THREE.MeshBasicMaterial({
  color:0xe1d4ad
 })
);

tooth.position.set(
 i*.11,
 3.82,
 -.62
);

g.add(tooth);
}

/* braços */

const leftArm=new THREE.Group();
const rightArm=new THREE.Group();

const armGeo=
new THREE.CapsuleGeometry(
 .13,.78,5,10
);

const la=new THREE.Mesh(
 armGeo,skin
);

la.position.y=-.72;
leftArm.add(la);

const ra=new THREE.Mesh(
 armGeo,skin
);

ra.position.y=-.72;
rightArm.add(ra);

leftArm.position.set(
 -.7,2.75,0
);

rightArm.position.set(
 .7,2.75,0
);

g.add(leftArm,rightArm);

/* mãos */

const handGeo=
new THREE.SphereGeometry(
 .19,14,12
);

const lh=new THREE.Mesh(
 handGeo,skin
);

lh.position.y=-1.48;

leftArm.add(lh);

const rh=lh.clone();
rightArm.add(rh);

g.position.set(x,0,z);

scene.add(g);

zombies.push({
 mesh:g,
 leftLeg,
 rightLeg,
 leftArm,
 rightArm,
 hp:3,
 phase:Math.random()*10,
 speed:.018+Math.random()*.012,
 attackTimer:0
 });
}

/* cria zumbis */

for(let i=0;i<35;i++){

const a=Math.random()*Math.PI*2;
const d=150+Math.random()*420;

createZombie(
 Math.sin(a)*d,
 Math.cos(a)*d
 );
}

/* =========================================================
   PLAYER
========================================================= */

const player={
 x:0,
 y:1.7,
 z:0,
 angle:0,
 pitch:0,
 health:100
};

camera.position.set(
 player.x,
 player.y,
 player.z
);

/* =========================================================
   ARMAS
========================================================= */

const weapons=[
 {
  name:"PISTOLA",
  damage:2,
  delay:250,
  color:0x777777,
  sound:520
 },
 {
  name:"AK-47",
  damage:2,
  delay:140,
  color:0x65462c,
  sound:330
 },
 {
  name:"UMP",
  damage:2,
  delay:120,
  color:0x333a40,
  sound:420
 },
 {
  name:"SCAR",
  damage:3,
  delay:170,
  color:0x1d2529,
  sound:370
 },
 {
  name:"SNIPER",
  damage:6,
  delay:550,
  color:0x566066,
  sound:250
 }
];

let weaponIndex=0;
let aiming=false;
let zoomLevel=1;

const weaponGroup=new THREE.Group();

camera.add(weaponGroup);
scene.add(camera);

/* =========================================================
   MODELO DAS ARMAS
========================================================= */

function box(w,h,d,color){

return new THREE.Mesh(
 new THREE.BoxGeometry(w,h,d),
 new THREE.MeshStandardMaterial({
  color,
  metalness:.8,
  roughness:.25
 })
);
}

function cylinder(r,l,color){

return new THREE.Mesh(
 new THREE.CylinderGeometry(
  r,r,l,20
 ),
 new THREE.MeshStandardMaterial({
  color,
  metalness:.85,
  roughness:.2
 })
);
}

function createGun(){

while(weaponGroup.children.length)
 weaponGroup.remove(
  weaponGroup.children[0]
 );

const W=weapons[weaponIndex];
const dark=0x101315;

/* pistola */

if(weaponIndex===0){

const body=box(
 .45,.25,1.25,W.color
);

body.position.set(
 .43,-.36,-1
);

weaponGroup.add(body);

const barrel=cylinder(
 .06,1.1,dark
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
 .43,-.36,-1.85
);

weaponGroup.add(barrel);

const grip=box(
 .28,.7,.42,dark
);

grip.position.set(
 .43,-.75,-.6
);

grip.rotation.x=.2;

weaponGroup.add(grip);
}

/* AK */

if(weaponIndex===1){

const body=box(
 .45,.42,1.4,W.color
);

body.position.set(
 .43,-.36,-1
);

weaponGroup.add(body);

const barrel=cylinder(
 .07,2.5,dark
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
 .43,-.36,-2.65
);

weaponGroup.add(barrel);

const stock=box(
 .35,.35,.9,0x54351f
);

stock.position.set(
 .43,-.4,.05
);

weaponGroup.add(stock);

const mag=box(
 .25,.7,.35,dark
);

mag.position.set(
 .43,-.8,-1
);

mag.rotation.x=-.2;

weaponGroup.add(mag);
}

/* UMP */

if(weaponIndex===2){

const body=box(
 .5,.45,1.3,W.color
);

body.position.set(
 .43,-.36,-1
);

weaponGroup.add(body);

const barrel=cylinder(
 .075,2,dark
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
 .43,-.36,-2.35
);

weaponGroup.add(barrel);

const mag=box(
 .24,.75,.35,dark
);

mag.position.set(
 .43,-.8,-1
);

weaponGroup.add(mag);
}

/* SCAR */

if(weaponIndex===3){

const body=box(
 .48,.42,1.5,W.color
);

body.position.set(
 .43,-.36,-1
);

weaponGroup.add(body);

const barrel=cylinder(
 .075,2.8,dark
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
 .43,-.36,-2.85
);

weaponGroup.add(barrel);

const mag=box(
 .25,.8,.35,dark
);

mag.position.set(
 .43,-.8,-1
);

weaponGroup.add(mag);

const stock=box(
 .35,.4,.85,dark
);

stock.position.set(
 .43,-.4,.05
);

weaponGroup.add(stock);
}

/* SNIPER */

if(weaponIndex===4){

const body=box(
 .5,.42,1.55,W.color
);

body.position.set(
 .43,-.36,-1
);

weaponGroup.add(body);

const barrel=cylinder(
 .065,3.8,dark
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
 .43,-.36,-3
);

weaponGroup.add(barrel);

/* luneta */

const scope=cylinder(
 .13,1,dark
);

scope.rotation.x=Math.PI/2;
scope.position.set(
 .43,-.02,-1.45
);

weaponGroup.add(scope);

const lens=new THREE.Mesh(
 new THREE.CylinderGeometry(
  .14,.14,.05,20
 ),
 new THREE.MeshBasicMaterial({
  color:0x315f80
 })
);

lens.rotation.x=Math.PI/2;
lens.position.set(
 .43,-.02,-1.96
);

weaponGroup.add(lens);

const stock=box(
 .35,.4,1,dark
);

stock.position.set(
 .43,-.4,.05
);

weaponGroup.add(stock);
}
}

createGun();

/* =========================================================
   SOM
========================================================= */

let audioCtx=null;

function sound(freq,duration,type="square"){

if(!audioCtx)
 audioCtx=
  new (
   window.AudioContext||
   window.webkitAudioContext
  )();

const osc=
 audioCtx.createOscillator();

const gain=
 audioCtx.createGain();

osc.type=type;
osc.frequency.value=freq;

gain.gain.setValueAtTime(
 .12,
 audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
 .001,
 audioCtx.currentTime+duration
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(
 audioCtx.currentTime+duration
 );
}

function weaponSound(){

const w=weapons[weaponIndex];

sound(
 w.sound,
 .08,
 "sawtooth"
);

setTimeout(()=>{
 sound(
  w.sound/2,
  .06,
  "square"
 );
},20);
}

function zombieSound(){

sound(
 90+Math.random()*35,
 .35,
 "sawtooth"
 );
}

/* =========================================================
   JOYSTICK
========================================================= */

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(e){

const r=joy.getBoundingClientRect();

let dx=
 e.clientX-
 (r.left+r.width/2);

let dy=
 e.clientY-
 (r.top+r.height/2);

const max=42;
const dist=Math.hypot(dx,dy);

if(dist>max){

dx=dx/dist*max;
dy=dy/dist*max;
}

joyX=dx/max;
joyY=dy/max;

knob.style.left=
 37+dx+"px";

knob.style.top=
 37+dy+"px";
}

joy.onpointerdown=e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
};

joy.onpointermove=e=>{
 if(joyActive)
  moveJoy(e);
};

joy.onpointerup=()=>{

joyActive=false;
joyX=0;
joyY=0;

knob.style.left="37px";
knob.style.top="37px";
};

/* =========================================================
   CÂMERA
========================================================= */

let look=false;
let lx=0;
let ly=0;

renderer.domElement.onpointerdown=e=>{

look=true;
lx=e.clientX;
ly=e.clientY;
};

renderer.domElement.onpointermove=e=>{

if(!look)return;

const dx=e.clientX-lx;
const dy=e.clientY-ly;

lx=e.clientX;
ly=e.clientY;

player.angle-=dx*.004;
player.pitch-=dy*.003;

player.pitch=
 Math.max(
  -1.1,
  Math.min(1.1,player.pitch)
 );
};

renderer.domElement.onpointerup=()=>{
 look=false;
};

/* =========================================================
   MOVIMENTO
========================================================= */

function updatePlayer(){

const speed=.12;

const forward=-joyY;
const side=joyX;

const fx=-Math.sin(player.angle);
const fz=-Math.cos(player.angle);

const rx=Math.cos(player.angle);
const rz=-Math.sin(player.angle);

const nx=
 player.x+
 (fx*forward+rx*side)*speed;

const nz=
 player.z+
 (fz*forward+rz*side)*speed;

if(!blocked(nx,player.z))
 player.x=nx;

if(!blocked(player.x,nz))
 player.z=nz;

camera.position.set(
 player.x,
 player.y,
 player.z
);

camera.rotation.order="YXZ";

camera.rotation.y=
 player.angle;

camera.rotation.x=
 player.pitch;
}

/* =========================================================
   PORTAS
========================================================= */

function updateDoors(){

for(const d of doors){

const dist=Math.hypot(
 player.x-d.x,
 player.z-d.z
);

if(dist<4){

if(!d.open){

d.mesh.rotation.y=
 -Math.PI/2;

d.open=true;
}
}
}
}

/* =========================================================
   TROCAR ARMA
========================================================= */

document.getElementById("switch")
.onclick=()=>{

weaponIndex++;

if(weaponIndex>=weapons.length)
 weaponIndex=0;

createGun();

document.getElementById("weapon")
.textContent=
 weapons[weaponIndex].name;

const sniper=
 weaponIndex===4;

document.getElementById("aim")
.style.display=
 sniper?"block":"none";

document.getElementById("zoomBtn")
.style.display=
 sniper?"block":"none";

if(!sniper){

aiming=false;

document.getElementById("scope")
.style.display="none";

document.getElementById("cross")
.style.display="block";
}

camera.fov=72;
camera.updateProjectionMatrix();
};

/* =========================================================
   MIRA
========================================================= */

document.getElementById("aim")
.onclick=()=>{

if(weaponIndex!==4)return;

aiming=!aiming;

document.getElementById("scope")
.style.display=
 aiming?"block":"none";

document.getElementById("cross")
.style.display=
 aiming?"none":"block";

camera.fov=
 aiming?45:72;

camera.updateProjectionMatrix();
};

/* =========================================================
   ZOOM
========================================================= */

document.getElementById("zoomBtn")
.onclick=()=>{

if(!aiming)return;

zoomLevel++;

if(zoomLevel>3)
 zoomLevel=1;

document.getElementById("zoom")
.textContent=
 "ZOOM "+zoomLevel+"X";

camera.fov=
 zoomLevel===1?45:
 zoomLevel===2?32:22;

camera.updateProjectionMatrix();
};

/* =========================================================
   TIRO
========================================================= */

let firing=false;
let lastShot=0;

document.getElementById("fire")
.onpointerdown=()=>{
 firing=true;
};

document.getElementById("fire")
.onpointerup=()=>{
 firing=false;
};

function shoot(){

const now=performance.now();
const w=weapons[weaponIndex];

if(now-lastShot<w.delay)
 return;

lastShot=now;

weaponSound();

/* recuo */

weaponGroup.position.z=.14;

setTimeout(()=>{
 weaponGroup.position.z=0;
},55);

/* flash */

const flash=
new THREE.PointLight(
 0xff9d30,
 14,
 10
);

flash.position.set(
 .43,-.35,-2
);

weaponGroup.add(flash);

setTimeout(()=>{
 weaponGroup.remove(flash);
},45);

/* raio */

const direction=
new THREE.Vector3();

camera.getWorldDirection(
 direction
);

const ray=
new THREE.Raycaster(
 camera.position.clone(),
 direction,
 0,
 250
);

const targets=
zombies.map(z=>z.mesh);

const hits=
ray.intersectObjects(
 targets,
 true
);

if(hits.length){

let hitObj=
 hits[0].object;

let z=
 zombies.find(
  z=>z.mesh.getObjectById(
   hitObj.id
  )
 );

if(!z){

z=zombies.find(z=>
 z.mesh.children.some(
  c=>c.id===hitObj.id
 )
 );
}

if(z){

z.hp-=w.damage;

blood(
 hits[0].point
 );

if(z.hp<=0){

scene.remove(z.mesh);

const index=
 zombies.indexOf(z);

if(index>=0)
 zombies.splice(index,1);

kills++;

document.getElementById(
 "kills"
).textContent=kills;
}
}
}
}

/* =========================================================
   SANGUE
========================================================= */

function blood(pos){

for(let i=0;i<7;i++){

const p=new THREE.Mesh(
 new THREE.SphereGeometry(
  .035+Math.random()*.04,
  6,6
 ),
 new THREE.MeshBasicMaterial({
  color:0xb00000
 })
);

p.position.copy(pos);

scene.add(p);

const v=new THREE.Vector3(
 (Math.random()-.5)*.1,
 Math.random()*.1,
 (Math.random()-.5)*.1
 );

let life=0;

function drop(){

p.position.add(v);
v.y-=.006;
life++;

if(life>20){

scene.remove(p);
return;
}

requestAnimationFrame(drop);
}

drop();
}
}

/* =========================================================
   ZUMBIS
========================================================= */

function updateZombies(){

for(const z of zombies){

const dx=
 player.x-z.mesh.position.x;

const dz=
 player.z-z.mesh.position.z;

const dist=
 Math.hypot(dx,dz);

if(dist>2.7){

/* sempre em pé */

z.mesh.position.y=0;

/* aproximação */

z.mesh.position.x+=
 dx/dist*z.speed;

z.mesh.position.z+=
 dz/dist*z.speed;

/* olha para o jogador */

z.mesh.lookAt(
 player.x,
 2,
 player.z
 );

/* animação de caminhada */

z.phase+=.16;

const walk=
 Math.sin(z.phase)*.7;

z.leftLeg.rotation.x=
 walk;

z.rightLeg.rotation.x=
 -walk;

z.leftArm.rotation.x=
 -walk*.55;

z.rightArm.rotation.x=
 walk*.55;

/* movimento do corpo */

z.mesh.rotation.z=
 Math.sin(z.phase*2)*.025;

}else{

/* ataque SEM DEITAR */

z.mesh.position.y=0;

z.attackTimer++;

const attackMove=
 Math.sin(
  z.attackTimer*.35
 )*.18;

z.leftArm.rotation.x=
 -1.0+attackMove;

z.rightArm.rotation.x=
 -1.0-attackMove;

/* balança o corpo */

z.mesh.rotation.z=
 Math.sin(
  z.attackTimer*.3
 )*.04;

if(
 z.attackTimer%70===0
 ){

zombieSound();

player.health-=7;

damageEffect();

if(player.health<=0)
 gameOver();
}
}
}
}

/* =========================================================
   DANO
========================================================= */

function damageEffect(){

const d=
document.getElementById("damage");

d.style.opacity=.6;

setTimeout(()=>{
 d.style.opacity=0;
},150);

document.getElementById("hp")
.style.width=
 Math.max(
 0,
 player.health
 )+"%";
}

/* =========================================================
   MINIMAPA
========================================================= */

const mini=
document.getElementById(
 "miniCanvas"
);

const ctx=
mini.getContext("2d");

mini.width=210;
mini.height=210;

function minimap(){

ctx.clearRect(0,0,210,210);

ctx.fillStyle="#507649";
ctx.fillRect(0,0,210,210);

const scale=.18;

/* ruas */

ctx.strokeStyle="#555";
ctx.lineWidth=9;

ctx.beginPath();
ctx.moveTo(105,0);
ctx.lineTo(105,210);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,105);
ctx.lineTo(210,105);
ctx.stroke();

/* prédios/casas */

ctx.fillStyle="#777";

for(const c of walls){

const x=
 105+
 (c.x-player.x)*scale;

const y=
 105+
 (c.z-player.z)*scale;

if(
 x>-20&&x<230&&
 y>-20&&y<230
 ){

ctx.fillRect(
 x-c.w*scale/2,
 y-c.d*scale/2,
 c.w*scale,
 c.d*scale
 );
}
}

/* zumbis */

ctx.fillStyle="#f11";

for(const z of zombies){

const x=
 105+
 (z.mesh.position.x-player.x)*scale;

const y=
 105+
 (z.mesh.position.z-player.z)*scale;

if(
 x>=0&&x<=210&&
 y>=0&&y<=210
 ){

ctx.beginPath();

ctx.arc(
 x,y,3,0,Math.PI*2
 );

ctx.fill();
}
}

/* jogador */

ctx.save();

ctx.translate(105,105);
ctx.rotate(player.angle);

ctx.fillStyle="#20ff55";

ctx.beginPath();

ctx.moveTo(0,-10);
ctx.lineTo(6,7);
ctx.lineTo(-6,7);
ctx.closePath();

ctx.fill();

ctx.restore();
}

/* =========================================================
   GAME OVER
========================================================= */

let kills=0;
let dead=false;

function gameOver(){

if(dead)return;

dead=true;

document.getElementById(
 "finalKills"
).textContent=kills;

document.getElementById(
 "gameover"
).style.display="flex";
}

/* =========================================================
   START
========================================================= */

document.getElementById("start")
.onclick=()=>{

document.getElementById("menu")
.style.display="none";

if(!audioCtx){
 audioCtx=
 new (
  window.AudioContext||
  window.webkitAudioContext
 )();
}
};

/* =========================================================
   LOOP
========================================================= */

function animate(){

requestAnimationFrame(animate);

if(dead)return;

updatePlayer();
updateDoors();
updateZombies();
minimap();

if(firing)
 shoot();

renderer.render(
 scene,
 camera
);
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
 "resize",
 ()=>{

camera.aspect=
 innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
 innerWidth,
 innerHeight
 );
});
