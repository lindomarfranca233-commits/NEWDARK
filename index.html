<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   VARIÁVEIS
========================= */

let scene;
let camera;
let renderer;
let clock;

let zombies=[];
let particles=[];

let hp=100;
let score=0;
let wave=1;

let moveX=0;
let moveY=0;

let yaw=0;
let pitch=0;

let jumping=false;
let verticalSpeed=0;

let looking=false;
let lastX=0;
let lastY=0;

let reloadBusy=false;
let lastShot=0;

let sensitivity=1;
let playerSpeed=5.4;

let running=false;


/* =========================
   ARMAS
========================= */

const weapons=[

 {
  name:"PISTOLA",
  mag:12,
  ammo:12,
  reserve:60,
  damage:3,
  delay:300,
  color:0x222222
 },

 {
  name:"METRALHADORA",
  mag:30,
  ammo:30,
  reserve:120,
  damage:2,
  delay:110,
  color:0x111111
 },

 {
  name:"SNIPER",
  mag:5,
  ammo:5,
  reserve:25,
  damage:15,
  delay:800,
  color:0x292929
 }

];

let weaponIndex=0;
let weapon=weapons[0];


/* =========================
   ÁUDIO
========================= */

let audio=null;

function startAudio(){

 try{

  if(!audio){
   audio=new(window.AudioContext||window.webkitAudioContext)();
  }

  if(audio.state==="suspended"){
   audio.resume();
  }

 }catch(e){}

}

function sound(freq,duration,type="square",volume=.035){

 if(!audio)return;

 try{

  let osc=audio.createOscillator();
  let gain=audio.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.value=volume;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  gain.gain.exponentialRampToValueAtTime(
   .001,
   audio.currentTime+duration
  );

  osc.stop(
   audio.currentTime+duration
  );

 }catch(e){}

}


/* =========================
   COMEÇAR
========================= */

function startGame(){

 if(running)return;

 running=true;

 startAudio();

 scene=new THREE.Scene();

 scene.background=
 new THREE.Color(0x05090b);

 scene.fog=
 new THREE.Fog(
  0x05090b,
  15,
  100
 );

 camera=
 new THREE.PerspectiveCamera(
  68,
  innerWidth/innerHeight,
  .05,
  220
 );

 camera.rotation.order="YXZ";

 camera.position.set(
  0,
  1.7,
  8
 );

 renderer=
 new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.35)
 );

 renderer.shadowMap.enabled=true;

 document.body.appendChild(
  renderer.domElement
 );

 clock=new THREE.Clock();

 hp=100;
 score=0;
 wave=1;

 weaponIndex=0;
 weapon=weapons[0];

 zombies=[];
 particles=[];

 createLights();
 createWorld();
 createWeapon();

 for(let i=0;i<6;i++){
  spawnZombie();
 }

 document.getElementById("menu")
 .style.display="none";

 updateHUD();

 requestAnimationFrame(loop);

}


/* =========================
   LUZ
========================= */

function createLights(){

 let hemi=
 new THREE.HemisphereLight(
  0x9fb5c8,
  0x050505,
  1.15
 );

 scene.add(hemi);

 let moon=
 new THREE.DirectionalLight(
  0xb9caff,
  1.7
 );

 moon.position.set(
  -30,
  45,
  -25
 );

 moon.castShadow=true;

 moon.shadow.mapSize.width=512;
 moon.shadow.mapSize.height=512;

 scene.add(moon);

}


/* =========================
   CIDADE
========================= */

function createWorld(){

 let ground=
 new THREE.Mesh(
  new THREE.PlaneGeometry(220,220),
  new THREE.MeshStandardMaterial({
   color:0x151a18,
   roughness:1
  })
 );

 ground.rotation.x=-Math.PI/2;

 ground.receiveShadow=true;

 scene.add(ground);


 /* ruas */

 let roadMaterial=
 new THREE.MeshStandardMaterial({
  color:0x101211,
  roughness:1
 });

 let road1=
 new THREE.Mesh(
  new THREE.PlaneGeometry(17,220),
  roadMaterial
 );

 road1.rotation.x=-Math.PI/2;
 road1.position.y=.01;

 scene.add(road1);

 let road2=
 new THREE.Mesh(
  new THREE.PlaneGeometry(220,17),
  roadMaterial
 );

 road2.rotation.x=-Math.PI/2;
 road2.position.y=.012;

 scene.add(road2);


 /* prédios */

 for(let i=0;i<30;i++){

  let w=5+Math.random()*7;
  let d=5+Math.random()*7;
  let h=4+Math.random()*8;

  let x=(Math.random()-.5)*120;
  let z=(Math.random()-.5)*120;

  if(
   Math.abs(x)<14 ||
   Math.abs(z)<14
  ){

   i--;
   continue;

  }

  let building=
  new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   new THREE.MeshStandardMaterial({
    color:0x303634,
    roughness:.9
   })
  );

  building.position.set(
   x,
   h/2,
   z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);


  /* janelas */

  for(
   let yy=1.4;
   yy<h;
   yy+=1.7
  ){

   for(
    let xx=-w*.3;
    xx<=w*.3;
    xx+=1.2
   ){

    let windowMesh=
    new THREE.Mesh(
     new THREE.BoxGeometry(
      .55,
      .5,
      .04
     ),
     new THREE.MeshBasicMaterial({
      color:
       Math.random()>.4
       ?0xc79a52
       :0x111820
     })
    );

    windowMesh.position.set(
     x+xx,
     yy,
     z-d/2-.03
    );

    scene.add(windowMesh);

   }

  }

 }

}


/* =========================
   ARMA
========================= */

function createWeapon(){

 let old=
 camera.getObjectByName("weapon");

 if(old){
  camera.remove(old);
 }

 let group=
 new THREE.Group();

 group.name="weapon";

 let body=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .25,
   .27,
   .85
  ),
  new THREE.MeshStandardMaterial({
   color:weapon.color,
   metalness:.8,
   roughness:.25
  })
 );

 body.position.set(
  .38,
  -.28,
  -.75
 );

 group.add(body);


 let barrel=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .045,
   .055,
   weaponIndex===2?.85:.5,
   10
  ),
  new THREE.MeshStandardMaterial({
   color:0x050505,
   metalness:.9,
   roughness:.2
  })
 );

 barrel.rotation.x=Math.PI/2;

 barrel.position.set(
  .38,
  -.27,
  weaponIndex===2?-1.28:-1.08
 );

 group.add(barrel);


 if(weaponIndex===2){

  let scope=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .065,
    .065,
    .4,
    10
   ),
   new THREE.MeshStandardMaterial({
    color:0x111111,
    metalness:.8
   })
  );

  scope.rotation.x=Math.PI/2;

  scope.position.set(
   .38,
   -.12,
   -.75
  );

  group.add(scope);

 }


 let grip=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .14,
   .36,
   .2
  ),
  new THREE.MeshStandardMaterial({
   color:0x151515
  })
 );

 grip.position.set(
  .38,
  -.5,
  -.55
 );

 grip.rotation.x=-.18;

 group.add(grip);

 camera.add(group);

 scene.add(camera);

}


/* =========================
   ZUMBI
========================= */

function spawnZombie(){

 let z=
 new THREE.Group();

 let skin=
 [
  0x4d5951,
  0x5c655c,
  0x424b46,
  0x686359
 ][
  Math.floor(Math.random()*4)
 ];

 let mat=
 new THREE.MeshStandardMaterial({
  color:skin,
  roughness:1
 });


 /* corpo */

 let body=
 new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .3,
   .85,
   6,
   10
  ),
  mat
 );

 body.position.y=.85;
 body.castShadow=true;

 z.add(body);


 /* cabeça */

 let head=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .34,
   14,
   10
  ),
  mat
 );

 head.position.y=1.6;
 head.castShadow=true;

 z.add(head);


 /* olhos */

 let eyeMat=
 new THREE.MeshBasicMaterial({
  color:0xff2020
 });

 for(let x of[-.11,.11]){

  let eye=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .045,
    6,
    6
   ),
   eyeMat
  );

  eye.position.set(
   x,
   1.63,
   -.31
  );

  z.add(eye);

 }


 /* braços */

 for(let x of[-.38,.38]){

  let arm=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .08,
    .55,
    5,
    7
   ),
   mat
  );

  arm.position.set(
   x,
   .92,
   0
  );

  arm.rotation.z=
   x>0?-0.2:0.2;

  z.add(arm);

 }


 /* pernas */

 for(let x of[-.13,.13]){

  let leg=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .085,
    .48,
    5,
    7
   ),
   mat
  );

  leg.position.set(
   x,
   .35,
   0
  );

  z.add(leg);

 }


 let angle=
 Math.random()*Math.PI*2;

 let distance=
 30+Math.random()*45;

 z.position.set(
  camera.position.x+
  Math.cos(angle)*distance,
  0,
  camera.position.z+
  Math.sin(angle)*distance
 );

 z.userData={
  hp:4+Math.floor(wave*.6),
  speed:1+Math.random()*.7,
  attack:0,
  phase:Math.random()*10
 };

 scene.add(z);

 zombies.push(z);

}


/* =========================
   ATIRAR
========================= */

function shoot(){

 if(
  !running ||
  reloadBusy
 )return;

 let now=
 performance.now();

 if(
  now-lastShot<
  weapon.delay
 )return;

 lastShot=now;

 if(weapon.ammo<=0){

  reload();

  return;

 }

 weapon.ammo--;

 sound(
  weaponIndex===2?65:
  weaponIndex===1?120:
  150,
  .08,
  "sawtooth",
  .055
 );


 camera.rotation.x+=
  weaponIndex===2?.03:.012;


 let ray=
 new THREE.Raycaster();

 ray.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 let targets=[];

 for(let z of zombies){

  z.traverse(obj=>{

   if(obj.isMesh){
    targets.push(obj);
   }

  });

 }

 let hits=
 ray.intersectObjects(
  targets,
  false
 );

 if(hits.length){

  let root=
  hits[0].object;

  while(
   root.parent &&
   !zombies.includes(root)
  ){

   root=root.parent;

  }

  if(zombies.includes(root)){

   root.userData.hp-=
   weapon.damage;

   if(root.userData.hp<=0){

    scene.remove(root);

    zombies=
    zombies.filter(
     z=>z!==root
    );

    score++;

    if(score%8===0){
     wave++;
    }

   }

  }

 }

 updateHUD();

}


/* =========================
   RECARREGAR
========================= */

function reload(){

 if(
  reloadBusy ||
  weapon.ammo>=weapon.mag ||
  weapon.reserve<=0
 )return;

 reloadBusy=true;

 sound(180,.08);

 updateHUD();

 setTimeout(()=>{

  let need=
  weapon.mag-weapon.ammo;

  let take=
  Math.min(
   need,
   weapon.reserve
  );

  weapon.ammo+=take;
  weapon.reserve-=take;

  reloadBusy=false;

  updateHUD();

 },800);

}


/* =========================
   TROCAR ARMA
========================= */

function changeWeapon(){

 if(
  !running ||
  reloadBusy
 )return;

 weaponIndex++;

 if(
  weaponIndex>=weapons.length
 ){
  weaponIndex=0;
 }

 weapon=weapons[weaponIndex];

 createWeapon();

 updateHUD();

}


/* =========================
   PULAR
========================= */

function jump(){

 if(
  !running ||
  jumping
 )return;

 jumping=true;

 verticalSpeed=7;

 sound(250,.06);

}


/* =========================
   HUD
========================= */

function updateHUD(){

 document.getElementById("hp")
 .textContent=
 Math.max(
  0,
  Math.floor(hp)
 );

 document.getElementById("health")
 .style.width=
 Math.max(
  0,
  hp
 )+"%";

 document.getElementById("ammo")
 .textContent=
 reloadBusy
 ?"RECARREGANDO..."
 :weapon.ammo+
 " / "+
 weapon.reserve;

 document.getElementById("weapon")
 .textContent=
 weapon.name;

 document.getElementById("score")
 .textContent=
 "Abates: "+score;

 document.getElementById("wave")
 .textContent=
 "Onda: "+wave;

}


/* =========================
   MAPA
========================= */

function drawMap(){

 let map=
 document.getElementById("map");

 let ctx=
 map.getContext("2d");

 ctx.clearRect(
  0,0,240,240
 );

 ctx.fillStyle="#07100d";

 ctx.fillRect(
  0,0,240,240
 );

 ctx.fillStyle="#202522";

 ctx.fillRect(
  110,0,20,240
 );

 ctx.fillRect(
  0,110,240,20
 );


 ctx.fillStyle="#e03440";

 for(let z of zombies){

  let x=
  120+
  (z.position.x-
   camera.position.x)*.7;

  let y=
  120+
  (z.position.z-
   camera.position.z)*.7;

  if(
   x>0&&x<240&&
   y>0&&y<240
  ){

   ctx.fillRect(
    x-2,
    y-2,
    4,
    4
   );

  }

 }


 ctx.fillStyle="#55aaff";

 ctx.beginPath();

 ctx.arc(
  120,
  120,
  5,
  0,
  Math.PI*2
 );

 ctx.fill();

}


/* =========================
   ATUALIZAÇÃO
========================= */

function update(dt){

 if(!camera)return;


 /* movimento corrigido */

 let forwardX=
 -Math.sin(yaw);

 let forwardZ=
 -Math.cos(yaw);

 let rightX=
 Math.cos(yaw);

 let rightZ=
 -Math.sin(yaw);

 if(
  Math.abs(moveX)+
  Math.abs(moveY)>.01
 ){

  let mx=
  moveX*rightX+
  (-moveY)*forwardX;

  let mz=
  moveX*rightZ+
  (-moveY)*forwardZ;

  let len=
  Math.hypot(mx,mz);

  if(len>0){

   mx/=len;
   mz/=len;

   camera.position.x+=
   mx*playerSpeed*dt;

   camera.position.z+=
   mz*playerSpeed*dt;

  }

 }


 /* pulo */

 if(jumping){

  verticalSpeed-=18*dt;

  camera.position.y+=
  verticalSpeed*dt;

  if(
   camera.position.y<=1.7
  ){

   camera.position.y=1.7;

   verticalSpeed=0;

   jumping=false;

  }

 }


 /* zumbis */

 for(let z of zombies){

  let dx=
  camera.position.x-
  z.position.x;

  let dz=
  camera.position.z-
  z.position.z;

  let dist=
  Math.hypot(dx,dz);

  if(dist>1.5){

   z.position.x+=
   dx/dist*
   z.userData.speed*
   dt;

   z.position.z+=
   dz/dist*
   z.userData.speed*
   dt;

  }else{

   z.userData.attack-=dt;

   if(
    z.userData.attack<=0
   ){

    hp-=6;

    z.userData.attack=.8;

    let damage=
    document.getElementById(
     "damage"
    );

    damage.style.opacity=1;

    setTimeout(()=>{
     damage.style.opacity=0;
    },100);

    if(hp<=0){

     gameOver();

     return;

    }

   }

  }

  z.userData.phase+=dt*5;

  z.rotation.z=
  Math.sin(
   z.userData.phase
  )*.025;

  z.lookAt(
   camera.position.x,
   z.position.y,
   camera.position.z
  );

 }


 let wanted=
 Math.min(
  4+wave*2,
  12
 );

 while(
  zombies.length<wanted
 ){

  spawnZombie();

 }


 drawMap();

 updateHUD();

}

 </button>

 };

/* =========================
   JOYSTICK
========================= */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

let joyActive=false;

joy.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  joyActive=true;

  joy.setPointerCapture(
   e.pointerId
  );

  moveJoystick(e);

 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  if(joyActive){
   moveJoystick(e);
  }

 }
);

joy.addEventListener(
 "pointerup",
 stopJoystick
);

joy.addEventListener(
 "pointercancel",
 stopJoystick
);

function stopJoystick(){

 joyActive=false;

 moveX=0;
 moveY=0;

 stick.style.transform=
 "translate(-50%,-50%)";

}

function moveJoystick(e){

 let r=
 joy.getBoundingClientRect();

 let x=
 e.clientX-
 (
  r.left+r.width/2
 );

 let y=
 e.clientY-
 (
  r.top+r.height/2
 );

 let limit=45;

 let d=
 Math.hypot(x,y);

 if(d>limit){

  x=x/d*limit;
  y=y/d*limit;

 }

 moveX=x/limit;
 moveY=y/limit;

 stick.style.transform=
 `translate(
  calc(-50% + ${x}px),
  calc(-50% + ${y}px)
 )`;

}


/* =========================
   CÂMERA
========================= */

document.addEventListener(
 "pointerdown",
 e=>{

  if(!running)return;

  if(
   e.clientX<
   innerWidth*.45
  )return;

  if(
   e.clientX>
   innerWidth-330 &&
   e.clientY>
   innerHeight-190
  )return;

  looking=true;

  lastX=e.clientX;
  lastY=e.clientY;

 }
);

document.addEventListener(
 "pointermove",
 e=>{

  if(
   !looking ||
   !running
  )return;

  let dx=
  e.clientX-lastX;

  let dy=
  e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  yaw-=
  dx*.003*sensitivity;

  pitch-=
  dy*.0022*sensitivity;

  pitch=
  Math.max(
   -1.05,
   Math.min(
    1.05,
    pitch
   )
  );

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

 }
);

document.addEventListener(
 "pointerup",
 ()=>{
  looking=false;
 }
);

/* =========================
   RESIZE
========================= */

window.addEventListener(
 "resize",
 ()=>{

  if(!camera||!renderer)return;

  camera.aspect=
  innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


/* =========================
   LOOP
========================= */

function loop(){

 if(!running)return;

 requestAnimationFrame(loop);

 let dt=
 Math.min(
  clock.getDelta(),
  .04
 );

 update(dt);

 renderer.render(
  scene,
  camera
 );

}
