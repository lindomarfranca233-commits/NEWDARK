<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   VERIFICAÇÃO
========================================================= */

if(typeof THREE==="undefined"){
 document.body.innerHTML=
 '<div style="color:white;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:20px">Erro ao carregar o 3D.<br><br>Confira sua internet e abra novamente.</div>';
 throw new Error("Three.js não carregou");
}

/* =========================================================
   CENA
========================================================= */

const scene=new THREE.Scene();

scene.background=
 new THREE.Color(0x82c9f5);

scene.fog=
 new THREE.Fog(0x82c9f5,100,650);

const camera=
 new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .1,
  1200
);

const renderer=
 new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.35)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
 THREE.PCFSoftShadowMap;

document.body.appendChild(
 renderer.domElement
);

/* =========================================================
   SOL FORTE
========================================================= */

const sun=
 new THREE.DirectionalLight(
  0xffffff,
  4.5
);

sun.position.set(
 -180,
 320,
 -220
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);

const skyLight=
 new THREE.HemisphereLight(
  0xdaf3ff,
  0x4f7044,
  2
);

scene.add(skyLight);

const sunBall=
 new THREE.Mesh(
  new THREE.SphereGeometry(22,16,12),
  new THREE.MeshBasicMaterial({
   color:0xffffc0
  })
);

sunBall.position.set(
 -330,270,-450
);

scene.add(sunBall);

/* =========================================================
   TERRENO
========================================================= */

const ground=
 new THREE.Mesh(
  new THREE.PlaneGeometry(1600,1600),
  new THREE.MeshStandardMaterial({
   color:0x628851,
   roughness:1
  })
 );

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* =========================================================
   RUAS
========================================================= */

function road(x,z,w,d){

 const r=
 new THREE.Mesh(
  new THREE.BoxGeometry(w,.08,d),
  new THREE.MeshStandardMaterial({
   color:0x404548,
   roughness:1
  })
 );

 r.position.set(x,.04,z);
 r.receiveShadow=true;

 scene.add(r);
}

road(0,0,70,1500);
road(0,0,1500,70);
road(-300,0,38,1500);
road(300,0,38,1500);

/* =========================================================
   COLISÕES
========================================================= */

const walls=[];

function addWall(x,z,w,d){
 walls.push({x,z,w,d});
}

function blocked(x,z){

 const radius=.65;

 return walls.some(c=>
  x>c.x-c.w/2-radius &&
  x<c.x+c.w/2+radius &&
  z>c.z-c.d/2-radius &&
  z<c.z+c.d/2+radius
 );
}

/* =========================================================
   CASAS
========================================================= */

function createHouse(x,z,w,d,h){

 const g=new THREE.Group();

 /* parede principal */

 const brick=
 new THREE.MeshStandardMaterial({
  color:0x9a4c37,
  roughness:.9
 });

 const house=
 new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  brick
 );

 house.position.y=h/2;
 house.castShadow=true;
 house.receiveShadow=true;

 g.add(house);

 /* linhas de tijolos */

 const mortar=
 new THREE.MeshStandardMaterial({
  color:0x67372d
 });

 for(let y=1.8;y<h;y+=2){

  const line=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    w+.04,.055,d+.04
   ),
   mortar
  );

  line.position.y=y;
  g.add(line);
 }

 /* porta */

 const door=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   2.4,3.7,.18
  ),
  new THREE.MeshStandardMaterial({
   color:0x422719,
   roughness:.8
  })
 );

 door.position.set(
  0,
  1.85,
  d/2+.12
 );

 g.add(door);

 /* maçaneta */

 const knob=
 new THREE.Mesh(
  new THREE.SphereGeometry(.09,8,8),
  new THREE.MeshStandardMaterial({
   color:0xd7b15a,
   metalness:.8
  })
 );

 knob.position.set(
  .65,1.85,d/2+.25
 );

 g.add(knob);

 /* janelas */

 for(const side of[-1,1]){

  const windowMesh=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    2.8,1.7,.12
   ),
   new THREE.MeshStandardMaterial({
    color:0x70c4eb,
    metalness:.1,
    roughness:.15
   })
  );

  windowMesh.position.set(
   side*w*.28,
   h*.55,
   d/2+.08
  );

  g.add(windowMesh);

  /* divisão da janela */

  const bar1=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .08,1.7,.15
   ),
   mortar
  );

  bar1.position.set(
   side*w*.28,
   h*.55,
   d/2+.16
  );

  g.add(bar1);
 }

 /* telhado */

 const roof=
 new THREE.Mesh(
  new THREE.ConeGeometry(
   Math.max(w,d)*.72,
   6,
   4
  ),
  new THREE.MeshStandardMaterial({
   color:0x423936,
   roughness:1
  })
 );

 roof.rotation.y=Math.PI/4;
 roof.position.y=h+3;
 roof.castShadow=true;

 g.add(roof);

 g.position.set(x,0,z);

 scene.add(g);

 addWall(x,z,w,d);
}

/* =========================================================
   CASAS NO MAPA
========================================================= */

createHouse(-90,-105,42,34,15);
createHouse(90,-105,42,34,15);
createHouse(-95,105,44,35,16);
createHouse(95,105,44,35,16);

createHouse(-190,-190,48,38,18);
createHouse(190,-190,48,38,18);
createHouse(-190,190,48,38,18);
createHouse(190,190,48,38,18);

/* =========================================================
   POSTES
========================================================= */

function createPole(x,z){

 const pole=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .18,.25,12,10
  ),
  new THREE.MeshStandardMaterial({
   color:0x36383a,

  })

 pole.position.set(x,6,z);

 scene.add(pole);

 const top=

  new THREE.BoxGeometry(

  ),

  })
 );

 top.position.set(x,11.2,z);

 const lamp=

for(let x=-500;x<=500;x+=55){

 createPole(x,-45);
 createPole(x,45);
}

/* =========================================================
   FIOS
========================================================= */

function wire(z,height){

 const points=[];

 for(let x=-550;x<=550;x+=20){

  points.push(
   new THREE.Vector3(
    x,
    height+
    Math.sin(x*.045)*.55,
    z
   )
  );
 }

 const curve=
 new THREE.CatmullRomCurve3(points);

 const geo=
 new THREE.TubeGeometry(
  curve,
 100,
 .035,
 5,
 false
 );

 const mesh=
 new THREE.Mesh(
  geo,
  new THREE.MeshBasicMaterial({
   color:0x151515
  })
 );

 scene.add(mesh);
}

wire(-45,11.3);
wire(45,11.3);

/* =========================================================
   CARROS
========================================================= */

function createCar(x,z,color){

 const g=new THREE.Group();

 const paint=
 new THREE.MeshStandardMaterial({
  color:color,
  metalness:.55,
  roughness:.28
 });

 new THREE.MeshStandardMaterial({
  color:0x121416,
  roughness:.4
 });

 const body=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   5.6,1.25,8
  ),

 );

 body.position.y=1.05;
 body.castShadow=true;

 g.add(body);

 const cabin=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   4.1,1.35,4.1
  ),

 );

 cabin.position.y=2;

 g.add(cabin);

 const glass=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   3.7,.9,.08
  ),
  new THREE.MeshStandardMaterial({
   color:0x6db8d7,
   roughness:.12,
   metalness:.1
  })
 );

 glass.position.set(
  0,2.12,-2.08
 );

 g.add(glass);

 for(const p of[
  [-2.7,.65,-2.5],
  [2.7,.65,-2.5],
  [-2.7,.65,2.5],
  [2.7,.65,2.5]
 ]){

  const wheel=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .75,.75,.52,12
   ),

  );

  wheel.rotation.z=Math.PI/2;
  wheel.position.set(...p);

  g.add(wheel);
 }

 g.position.set(x,0,z);

 scene.add(g);
}

createCar(-20,-70,0xb82f2f);
createCar(20,-70,0x2762a3);
createCar(-20,70,0x777777);
createCar(20,70,0xc79227);

/* =========================================================
   ZUMBIS
========================================================= */

const zombies=[];

function createZombie(x,z){

 const g=new THREE.Group();

 /* materiais */

 const skin=
 new THREE.MeshStandardMaterial({
  color:0x879b7c,
  roughness:.95
 });

 const skinDark=
 new THREE.MeshStandardMaterial({
  color:0x68765f,
  roughness:1
 });

 const shirt=
 new THREE.MeshStandardMaterial({
  color:0x4b5c4a,
  roughness:1
 });

 const pants=
 new THREE.MeshStandardMaterial({
  color:0x30353b,
  roughness:1
 });

 const shoe=
 new THREE.MeshStandardMaterial({
  color:0x151515
 });

 /* =====================
    pernas
 ===================== */

 const leftLeg=
 new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .13,.72,5,8
  ),
  pants
 );

 const rightLeg=
 leftLeg.clone();

 leftLeg.position.set(
  -.17,.62,0
 );

 rightLeg.position.set(
  .17,.62,0
 );

 g.add(leftLeg,rightLeg);

 /* pés */

 const leftFoot=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .32,.18,.58
  ),
  shoe
 );

 const rightFoot=leftFoot.clone();

 leftFoot.position.set(
  -.17,.08,-.16
 );

 rightFoot.position.set(
  .17,.08,-.16
 );

 g.add(leftFoot,rightFoot);

 /* =====================
    corpo
 ===================== */

 const torso=
 new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .3,.72,5,10
  ),
  shirt
 );

 torso.position.y=1.55;

 g.add(torso);

 /* =====================
    pescoço
 ===================== */

 const neck=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .11,.13,.2,8
  ),
  skin
 );

 neck.position.y=2.42;

 g.add(neck);

 /* =====================
    CABEÇA
 ===================== */

 const head=
 new THREE.Group();

 head.position.set(
  0,2.78,0
 );

 g.add(head);

 const headSkin=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .42,20,16
  ),
  skin
 );

 headSkin.scale.set(
  1,.98,.92
 );

 head.add(headSkin);

 /* =====================
    OLHOS
 ===================== */

 const eyeWhite=
 new THREE.MeshStandardMaterial({
  color:0xf0e8d4,
  roughness:.4
 });

 const eyePupil=
 new THREE.MeshBasicMaterial({

 });

 for(const s of[-1,1]){

  const eye=

   new THREE.SphereGeometry(
    .075,10,8

   s*.145,
   .055,

 /* =====================
    NARIZ

 const nose=
 new THREE.Mesh(

 nose.rotation.x=Math.PI/2;

 nose.position.set(

 );

 /* =====================
    BOCA
 ===================== */

 const mouth=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .27,.075,.045

  new THREE.MeshBasicMaterial({

  })

 mouth.position.set(

 for(let i=-1;i<=1;i++){

  const tooth=

   new THREE.BoxGeometry(
    .055,.06,.025

  tooth.position.set(
   i*.075,

 /* =====================
    BRAÇOS
 ===================== */

 const leftArm=

for(let i=0;i<28;i++){

  Math.random()*Math.PI*2;

  100+Math.random()*350;

 createZombie(
  Math.sin(a)*d,

   PLAYER

 angle:0,

 running:false

camera.position.set(

 1.8,

/* =========================================================

/* =========================================================
   MODELO DA ARMA
========================================================= */

function gunBox(w,h,d,color){

 return new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:color,
   metalness:.7,
   roughness:.25
  })
 );
}

function createGun(){

 while(gun.children.length)
  gun.remove(gun.children[0]);

 const colors=[
  0x777777,
  0x704b2e,
  0x333b42,
  0x20282d,
  0x59636b
 ];

 const body=
 gunBox(
  .5,.4,1.5,
  colors[weaponIndex]
 );

 body.position.set(
  .42,-.38,-1
 );

 gun.add(body);

 const barrel=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .065,.065,
   weaponIndex===4?3.5:2.4,
   12
  ),
  new THREE.MeshStandardMaterial({
   color:0x101214,
   metalness:.9,
   roughness:.2
  })
 );

 barrel.rotation.x=Math.PI/2;

 barrel.position.set(
  .42,-.38,
  weaponIndex===4?-2.8:-2.3
 );

 gun.add(barrel);

 const grip=
 gunBox(
  .28,.7,.4,
  0x191919
 );

 grip.position.set(
  .42,-.78,-.55
 );

 grip.rotation.x=.15;

 gun.add(grip);

 if(weaponIndex>0){

  const magazine=
  gunBox(
   .23,.7,.32,
   0x151719
  );

  magazine.position.set(
   .42,-.78,-1
  );

  magazine.rotation.x=
   weaponIndex===4?0:-.15;

  gun.add(magazine);
 }

 /* luneta do sniper */

 if(weaponIndex===4){

  const scope=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .11,.11,.9,12
   ),
   new THREE.MeshStandardMaterial({
    color:0x111111,
    metalness:.8
   })
  );

  scope.rotation.x=Math.PI/2;

  scope.position.set(
   .42,-.02,-1.35
  );

  gun.add(scope);
 }
}

createGun();

/* =========================================================
   SOM
========================================================= */

let audio=null;

function sound(freq,duration,type="square"){

 try{

  if(!audio)
   audio=new AudioContext();

  const osc=
   audio.createOscillator();

  const gain=
   audio.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
   .14,
   audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
   .001,
   audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
   audio.currentTime+duration
  );

 }catch(e){}
}

function gunSound(){

 const f=
  weapons[weaponIndex].freq;

 sound(f,.07,"sawtooth");

 setTimeout(
  ()=>sound(f*.5,.05,"square"),
  20
 );
}

/* =========================================================
   JOYSTICK
========================================================= */

const joy=
 document.getElementById("joy");

const knob=
 document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(e){

 const r=
  joy.getBoundingClientRect();

 let dx=
  e.clientX-
  (r.left+r.width/2);

 let dy=
  e.clientY-
  (r.top+r.height/2);

 const max=42;
 const dist=
  Math.hypot(dx,dy);

 if(dist>max){

  dx=dx/dist*max;
  dy=dy/dist*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 knob.style.left=
  (37+dx)+"px";

 knob.style.top=
  (37+dy)+"px";
}

joy.addEventListener(
 "pointerdown",
 e=>{
  joyActive=true;
  joy.setPointerCapture(e.pointerId);
  moveJoy(e);
 }
);

joy.addEventListener(
 "pointermove",
 e=>{
  if(joyActive)
   moveJoy(e);
 }
);

joy.addEventListener(
 "pointerup",
 ()=>{
  joyActive=false;
  joyX=0;
  joyY=0;
  knob.style.left="37px";
  knob.style.top="37px";
 }
);

/* =========================================================
   CÂMERA
========================================================= */

let look=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
 "pointerdown",
 e=>{
  look=true;
  lastX=e.clientX;
  lastY=e.clientY;
 }
);

renderer.domElement.addEventListener(
 "pointermove",
 e=>{

  if(!look)return;

  const dx=
   e.clientX-lastX;

  const dy=
   e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  player.angle-=dx*.004;
  player.pitch-=dy*.003;

  player.pitch=
   Math.max(
    -.85,
    Math.min(.85,player.pitch)
   );
 }
);

renderer.domElement.addEventListener(
 "pointerup",
 ()=>{
  look=false;
 }
);

/* =========================================================
   CORRER
========================================================= */

document.getElementById("run")
.addEventListener(
 "click",
 ()=>{

  player.running=
   !player.running;

  document.getElementById("run")
   .style.background=
   player.running?
   "#159447":
   "#24733c";
 }
);

/* =========================================================
   MOVIMENTO
========================================================= */

function updatePlayer(){

 const speed=
  player.running?
  .27:
  .13;

 const forward=-joyY;
 const side=joyX;

 const fx=
  -Math.sin(player.angle);

 const fz=
  -Math.cos(player.angle);

 const rx=
  Math.cos(player.angle);

 const rz=
  -Math.sin(player.angle);

 const nx=
  player.x+
  (fx*forward+rx*side)*speed;

 const nz=
  player.z+
  (fz*forward+rz*side)*speed;

 if(!blocked(nx,player.z))
  player.x=nx;

 if(!blocked(player.x,nz))
  player.z=nz;

 camera.position.set(
  player.x,
  1.8,
  player.z
 );

 camera.rotation.order="YXZ";

 camera.rotation.y=
  player.angle;

 camera.rotation.x=
  player.pitch;
}

/* =========================================================
   ZUMBIS
========================================================= */

function updateZombies(){

 for(const z of zombies){

  const dx=
   player.x-
   z.mesh.position.x;

  const dz=
   player.z-
   z.mesh.position.z;

  const dist=
   Math.hypot(dx,dz);

  /*
   IMPORTANTE:
   O zumbi fica sempre em pé.
   */

  z.mesh.rotation.x=0;
  z.mesh.rotation.z=0;
  z.mesh.position.y=0;

  if(dist>2.5){

   z.mesh.position.x+=
    dx/dist*.022;

   z.mesh.position.z+=
    dz/dist*.022;

   z.mesh.rotation.y=
    Math.atan2(dx,dz);

   z.phase+=.15;

   const walk=
    Math.sin(z.phase)*.45;

   z.leftLeg.rotation.x=
    walk;

   z.rightLeg.rotation.x=
    -walk;

   z.leftArm.rotation.x=
    -walk*.8;

   z.rightArm.rotation.x=
    walk*.8;

  }else{

   z.mesh.rotation.y=
    Math.atan2(dx,dz);

   z.attack++;

   const armMove=
    Math.sin(z.attack*.25)*.15;

   z.leftArm.rotation.x=
    -1.05+armMove;

   z.rightArm.rotation.x=
    -1.05-armMove;

   if(z.attack%90===0){

    player.health-=5;

    const damage=
     document.getElementById(
      "damage"
     );

    damage.style.opacity=.45;

    setTimeout(
     ()=>damage.style.opacity=0,
     120
    );

    document.getElementById("hp")
     .style.width=
     Math.max(
      0,
      player.health
     )+"%";

    sound(90,.18,"sawtooth");

    if(player.health<=0)
     gameOver();
   }
  }
 }
}

/* =========================================================
   TIRO
========================================================= */

function shoot(){

 const now=
  performance.now();

 const w=
  weapons[weaponIndex];

 if(now-lastShot<w.delay)
  return;

 lastShot=now;

 gunSound();

 gun.position.z=.13;

 setTimeout(
  ()=>gun.position.z=0,
  55
 );

 /* flash */

 const flash=
 new THREE.PointLight(
  0xffaa44,
  16,
  9
 );

 flash.position.set(
  .42,-.38,-2
 );

 gun.add(flash);

 setTimeout(
  ()=>gun.remove(flash),
  35
 );

 /* raio */

 const direction=
  new THREE.Vector3();

 camera.getWorldDirection(
  direction
 );

 const ray=
 new THREE.Raycaster(
  camera.position.clone(),
  direction,
  0,
  300
 );

 const hits=
  ray.intersectObjects(
   zombies.map(z=>z.mesh),
   true
 );

 if(!hits.length)
  return;

 const hit=
  hits[0].object;

 let target=null;

 for(const z of zombies){

  let obj=hit;

  while(obj){

   if(obj===z.mesh){

    target=z;
    break;
   }

   obj=obj.parent;
  }

  if(target)break;
 }

 if(!target)return;

 target.hp-=w.damage;

 if(target.hp<=0){

  scene.remove(
   target.mesh
  );

  const i=
   zombies.indexOf(target);

  if(i>=0)
   zombies.splice(i,1);

  kills++;

  document.getElementById(
   "kills"
  ).textContent=kills;
 }
}

/* =========================================================
   ATIRAR
========================================================= */

let firing=false;

const fire=
 document.getElementById("fire");

fire.addEventListener(
 "pointerdown",
 e=>{
  e.stopPropagation();

/* =========================================================
   MINIMAPA
========================================================= */

const mapCanvas=
 document.getElementById(
  "mapCanvas"
 );

const ctx=
 mapCanvas.getContext("2d");

mapCanvas.width=210;
mapCanvas.height=210;

function minimap(){

 ctx.clearRect(
  0,0,210,210
 );

 ctx.fillStyle="#668957";
 ctx.fillRect(
  0,0,210,210
 );

 const scale=.18;

 /* ruas */

 ctx.strokeStyle="#555";
 ctx.lineWidth=10;

 ctx.beginPath();
 ctx.moveTo(105,0);
 ctx.lineTo(105,210);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,105);
 ctx.lineTo(210,105);
 ctx.stroke();

 /* casas */

 ctx.fillStyle="#9b4c37";

 for(const c of walls){

  const x=
   105+
   (c.x-player.x)*scale;

  const y=
   105+
   (c.z-player.z)*scale;

  if(
   x>-20&&
   x<230&&
   y>-20&&
   y<230
  ){

   ctx.fillRect(
    x-c.w*scale/2,
    y-c.d*scale/2,
    c.w*scale,
    c.d*scale
   );
  }
 }

 /* zumbis */

 ctx.fillStyle="#e22";

 for(const z of zombies){

  const x=
   105+
   (z.mesh.position.x-player.x)
   *scale;

  const y=
   105+
   (z.mesh.position.z-player.z)
   *scale;

  if(
   x>=0&&x<=210&&
   y>=0&&y<=210
  ){

   ctx.beginPath();

   ctx.arc(
    x,y,3,0,Math.PI*2
   );

   ctx.fill();
  }
 }

 /* jogador */

 ctx.save();

 ctx.translate(105,105);
 ctx.rotate(player.angle);

 ctx.fillStyle="#20ff55";

 ctx.beginPath();
 ctx.moveTo(0,-10);
 ctx.lineTo(6,7);
 ctx.lineTo(-6,7);
 ctx.closePath();

 ctx.fill();

 ctx.restore();
}

/* =========================================================
   GAME OVER
========================================================= */

let kills=0;
let dead=false;

function gameOver(){

 if(dead)return;

 dead=true;

 document.getElementById(
  "finalKills"
 ).textContent=kills;

 document.getElementById(
  "gameover"
 ).style.display="flex";
}

========================================================= */

document.getElementById("start")

 "click",
 ()=>{

  document.getElementById(
   "menu"
  ).style.display="none";

  document.getElementById(
   "hud"
  ).style.display="block";

  document.getElementById(
   "weapon"
  ).style.display="block";

  document.getElementById(
   "cross"
  ).style.display="block";

  document.getElementById(
   "joy"
  ).style.display="block";

  document.getElementById(
   "fire"
  ).style.display="block";

  document.getElementById(
   "switch"
  ).style.display="block";

  document.getElementById(
   "run"
  ).style.display="block";

  try{

   if(!audio)
    audio=new AudioContext();

   if(audio.state==="suspended")
    audio.resume();

  }catch(e){}
 }
);

/* =========================================================
   LOOP
========================================================= */

function animate(){

 requestAnimationFrame(
  animate
 );

 if(!dead){

  updatePlayer();
  updateZombies();
  minimap();

  if(firing)
   shoot();
 }

 renderer.render(
  scene,
  camera
 );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);
