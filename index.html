<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{box-sizing:border-box}
html,body{

}
canvas{display:block;touch-action:none}

#menu,#gameover{

#menu h1{font-size:48px;letter-spacing:6px;margin:0}
button{

#hud{

#bar{width:170px;height:17px;border:2px solid white;background:#333}
#hp{height:100%;width:100%;background:#21d65a}
#weapon{

}
#cross{

 transform:translate(-50%,-50%);
 z-index:20;color:white;font-size:28px;
 text-shadow:0 0 5px #000
}
#joy{

 width:130px;height:130px;border:3px solid #ffffff55;
 border-radius:50%;background:#ffffff12;z-index:40
}
#knob{
 position:absolute;left:37px;top:37px;
 width:52px;height:52px;border-radius:50%;
 background:#ffffff88
}
.action{
 display:none;position:fixed;z-index:40;
 width:70px;height:70px;border-radius:50%;padding:0
}
#fire{
 right:18px;bottom:18px;width:92px;height:92px;
 background:#941b1b
}
#switch{
 right:120px;bottom:105px;background:#23577b
}
#run{
 right:120px;bottom:20px;background:#24733c
}
#map{
 position:fixed;right:10px;top:60px;z-index:35;
 width:105px;height:105px;border:2px solid white;
 border-radius:50%;overflow:hidden;background:#668c59
}
#mapCanvas{width:100%;height:100%}

</head>

<body>

<div id="menu">
 <h1>NEW DARK</h1>
 <p>V18 • SURVIVAL</p>
 <button id="start">JOGAR</button>
</div>

<div id="hud">
 VIDA
 <div id="bar"><div id="hp"></div></div>
 🧟 <span id="kills">0</span>
</div>

<div id="cross">+</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =====================================================
   MOTOR
===================================================== */

if(typeof THREE==="undefined"){
 document.body.innerHTML=
 '<div style="color:white;background:#111;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px">'+
 'Não foi possível carregar o motor 3D.<br><br>Verifique sua internet e abra novamente.</div>';
 throw new Error("THREE não carregou");
}

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x82c8f5);

scene.fog=new THREE.Fog(
 0x82c8f5,120,700
);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.1,1200
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

/* =====================================================
   SOL
===================================================== */

const sun=new THREE.DirectionalLight(
 0xffffff,3
);

sun.position.set(-180,300,-150);
sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);

scene.add(new THREE.HemisphereLight(
 0xcceeff,
 0x53694b,
 1.5
));

const sunMesh=new THREE.Mesh(
 new THREE.SphereGeometry(25,16,16),
 new THREE.MeshBasicMaterial({color:0xffffaa})
);

sunMesh.position.set(
 -300,250,-450
);

scene.add(sunMesh);

/* =====================================================
   TERRENO
===================================================== */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1600,1600),
 new THREE.MeshStandardMaterial({
  color:0x5f824f,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* =====================================================
   RUAS / MAPA
===================================================== */

function makeRoad(x,z,w,d){

 const r=new THREE.Mesh(
  new THREE.BoxGeometry(w,.08,d),
  new THREE.MeshStandardMaterial({
   color:0x3d4245,
   roughness:1
  })
 );

 r.position.set(x,.04,z);
 scene.add(r);
}

makeRoad(0,0,60,1500);
makeRoad(0,0,1500,60);
makeRoad(-280,0,35,1500);
makeRoad(280,0,35,1500);

/* =====================================================
   COLISÕES
===================================================== */

const walls=[];

function collision(x,z,w,d){
 walls.push({x,z,w,d});
}

function blocked(x,z){

 const r=.6;

 return walls.some(c=>
  x>c.x-c.w/2-r &&
  x<c.x+c.w/2+r &&
  z>c.z-c.d/2-r &&
  z<c.z+c.d/2+r
 );
}

/* =====================================================
   CASAS DE TIJOLO
===================================================== */

function createHouse(x,z,w,d,h){

 const g=new THREE.Group();

 const brickMat=new THREE.MeshStandardMaterial({
  color:0x8e4935,
  roughness:.9
 });

 const darkBrick=new THREE.MeshStandardMaterial({
  color:0x633327,
  roughness:1
 });

 /* paredes */

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  brickMat
 );

 body.position.y=h/2;
 body.castShadow=true;
 body.receiveShadow=true;

 g.add(body);

 /* faixas de tijolos */

 for(let y=2;y<h;y+=2){

  const stripe=new THREE.Mesh(
   new THREE.BoxGeometry(w+.03,.06,d+.03),
   darkBrick
  );

  stripe.position.y=y;
  g.add(stripe);
 }

 /* telhado */

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(
   Math.max(w,d)*.72,
   5,
   4
  ),
  new THREE.MeshStandardMaterial({
   color:0x49413c,
   roughness:1
  })
 );

 roof.rotation.y=Math.PI/4;
 roof.position.y=h+2.5;
 roof.castShadow=true;

 g.add(roof);

 /* porta */

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,3.5,.15),
  new THREE.MeshStandardMaterial({
   color:0x432719
  })
 );

 door.position.set(
  0,1.75,d/2+.1
 );

 g.add(door);

 /* janelas */

 for(const side of [-1,1]){

  const win=new THREE.Mesh(
   new THREE.BoxGeometry(2.5,1.7,.1),
   new THREE.MeshStandardMaterial({
    color:0x78c8ed,
    metalness:.1,
    roughness:.2
   })
  );

  win.position.set(
   side*w*.28,
   h*.55,
   d/2+.08
  );

  g.add(win);
 }

 g.position.set(x,0,z);

 scene.add(g);

 collision(x,z,w,d);

}

/* casas */

createHouse(-90,-100,40,32,14);
createHouse(90,-100,40,32,15);
createHouse(-95,100,42,34,15);
createHouse(95,100,42,34,16);
createHouse(-180,-180,46,36,17);
createHouse(180,-180,46,36,18);
createHouse(-180,180,46,36,17);
createHouse(180,180,46,36,18);

/* =====================================================
   POSTES GRANDES + FIOS
===================================================== */

function createPole(x,z){

 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.25,11,10),
  new THREE.MeshStandardMaterial({
   color:0x3d3d3d,
   metalness:.5
  })
 );

 pole.position.set(x,5.5,z);
 pole.castShadow=true;
 scene.add(pole);

 const arm=new THREE.Mesh(
  new THREE.BoxGeometry(3,.18,.18),
  new THREE.MeshStandardMaterial({
   color:0x333333,
   metalness:.5
  })
 );

 arm.position.set(x,10,z);
 scene.add(arm);

 const lamp=new THREE.Mesh(
  new THREE.SphereGeometry(.3,10,10),
  new THREE.MeshStandardMaterial({
   color:0xffeeaa,
   emissive:0x664400
  })
 );

 lamp.position.set(x,10,z);
 scene.add(lamp);
}

for(let x=-500;x<=500;x+=55){
 createPole(x,-38);
 createPole(x,38);
}

/* fios */

function createWire(z,height){

 const points=[];

 for(let x=-550;x<=550;x+=20){
  points.push(
   new THREE.Vector3(
    x,
    height+Math.sin(x*.04)*.6,
    z
   )
  );
 }

 const curve=new THREE.CatmullRomCurve3(points);

 const geo=new THREE.TubeGeometry(
  curve,100,.035,5,false
 );

 const wire=new THREE.Mesh(
  geo,
  new THREE.MeshBasicMaterial({
   color:0x181818
  })
 );

 scene.add(wire);
}

createWire(-38,10.3);
createWire(38,10.3);

/* =====================================================
   CARROS OTIMIZADOS
===================================================== */

function createCar(x,z,color){

 const g=new THREE.Group();

 const paint=new THREE.MeshStandardMaterial({
  color,
  metalness:.5,
  roughness:.3
 });

 const black=new THREE.MeshStandardMaterial({
  color:0x111315,
  roughness:.4
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(5.5,1.25,8),
  paint
 );

 body.position.y=1.05;
 body.castShadow=true;
 g.add(body);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(4.1,1.3,4),
  paint
 );

 cabin.position.y=2;
 g.add(cabin);

 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(3.7,.9,.08),
  new THREE.MeshStandardMaterial({
   color:0x6db7d7,
   roughness:.15
  })
 );

 glass.position.set(0,2.1,-2.03);
 g.add(glass);

 for(const p of[
  [-2.65,.65,-2.5],
  [2.65,.65,-2.5],
  [-2.65,.65,2.5],
  [2.65,.65,2.5]
 ]){

  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.72,.72,.5,12),
   black
  );

  wheel.rotation.z=Math.PI/2;
  wheel.position.set(...p);

  g.add(wheel);
 }

 g.position.set(x,0,z);
 scene.add(g);
}

createCar(-20,-65,0xc83232);
createCar(20,-65,0x285fa3);
createCar(-20,65,0x777777);
createCar(20,65,0xd49b25);

/* =====================================================
   ZUMBIS HUMANIZADOS
===================================================== */

const zombies=[];

function createZombie(x,z){

 const g=new THREE.Group();

 const skin=new THREE.MeshStandardMaterial({
  color:0x89957c,
  roughness:.9
 });

 const shirt=new THREE.MeshStandardMaterial({
  color:0x4c594c,
  roughness:1
 });

 const pants=new THREE.MeshStandardMaterial({
  color:0x30343a,
  roughness:1
 });

 const shoe=new THREE.MeshStandardMaterial({
  color:0x171717
 });

 /* pernas */

 const leftLeg=new THREE.Mesh(
  new THREE.BoxGeometry(.3,1.25,.3),
  pants
 );

 const rightLeg=leftLeg.clone();

 leftLeg.position.set(-.18,.65,0);
 rightLeg.position.set(.18,.65,0);

 g.add(leftLeg,rightLeg);

 /* pés */

 const leftFoot=new THREE.Mesh(
  new THREE.BoxGeometry(.35,.2,.62),
  shoe
 );

 const rightFoot=leftFoot.clone();

 leftFoot.position.set(-.18,.08,-.15);
 rightFoot.position.set(.18,.08,-.15);

 g.add(leftFoot,rightFoot);

 /* tronco */

 const torso=new THREE.Mesh(
  new THREE.CapsuleGeometry(.34,.72,5,10),
  shirt
 );

 torso.position.y=1.65;
 torso.scale.y=1.15;

 g.add(torso);

 /* pescoço */

 const neck=new THREE.Mesh(
  new THREE.CylinderGeometry(.13,.15,.22,10),
  skin
 );

 neck.position.y=2.55;
 g.add(neck);

 /* cabeça */

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.43,16,12),
  skin
 );

 head.position.y=2.92;
 g.add(head);

 /* olhos */

 const eyeMat=new THREE.MeshBasicMaterial({
  color:0x220000
 });

 for(const s of[-1,1]){

  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(.055,8,8),
   eyeMat
  );

  eye.position.set(
   s*.15,
   2.98,
   -.405
  );

  g.add(eye);

  /* orelha pequena */

  const ear=new THREE.Mesh(
   new THREE.SphereGeometry(.09,8,8),
   skin
  );

  ear.position.set(
   s*.43,
   2.91,
   0
  );

  g.add(ear);
 }

 /* nariz */

 const nose=new THREE.Mesh(
  new THREE.ConeGeometry(.07,.16,8),
  skin
 );

 nose.rotation.x=Math.PI/2;
 nose.position.set(
  0,2.88,-.43
 );

 g.add(nose);

 /* boca */

 const mouth=new THREE.Mesh(
  new THREE.BoxGeometry(.3,.09,.04),
  new THREE.MeshBasicMaterial({
   color:0x250606
  })
 );

 mouth.position.set(
  0,2.75,-.41
 );

 g.add(mouth);

 /* braços e mãos */

 const leftArm=new THREE.Mesh(
  new THREE.CapsuleGeometry(.11,.65,5,8),
  skin
 );

 const rightArm=leftArm.clone();

 leftArm.position.set(-.55,1.75,0);
 rightArm.position.set(.55,1.75,0);

 g.add(leftArm,rightArm);

 const hand1=new THREE.Mesh(
  new THREE.SphereGeometry(.14,8,8),
  skin
 );

 const hand2=hand1.clone();

 hand1.position.set(-.55,1.15,0);
 hand2.position.set(.55,1.15,0);

 g.add(hand1,hand2);

 g.position.set(x,0,z);

 scene.add(g);

 zombies.push({
  mesh:g,
  leftLeg,
  rightLeg,
  leftArm,
  rightArm,
  hp:4,
  phase:Math.random()*10,
  attack:0
 });
}

/* zumbis */

for(let i=0;i<25;i++){

 const a=Math.random()*Math.PI*2;
 const d=80+Math.random()*350;

 createZombie(
  Math.sin(a)*d,
  Math.cos(a)*d
 );
}

/* =====================================================
   PLAYER
===================================================== */

const player={
 x:0,
 z:5,
 angle:0,
 pitch:0,
 health:100,
 running:false
};

camera.position.set(
 player.x,2,player.z
);

/* =====================================================
   ARMAS
===================================================== */

const weapons=[
 {name:"PISTOLA",damage:2,delay:280,sound:520},
 {name:"AK-47",damage:2,delay:130,sound:350},
 {name:"UMP",damage:2,delay:110,sound:430},
 {name:"SCAR",damage:3,delay:170,sound:390},
 {name:"SNIPER",damage:6,delay:650,sound:250}
];

let weaponIndex=0;
let lastShot=0;

const gun=new THREE.Group();

camera.add(gun);
scene.add(camera);

function makeBox(w,h,d,color){

 return new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color,
   metalness:.6,
   roughness:.3
  })
 );
}

function createGun(){

 while(gun.children.length)
  gun.remove(gun.children[0]);

 const color=[
  0x777777,
  0x65462c,
  0x333a40,
  0x222a2e,
  0x555e64
 ][weaponIndex];

 const body=makeBox(
  .5,.4,1.5,color
 );

 body.position.set(
  .42,-.38,-1
 );

 gun.add(body);

 const barrel=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .065,.065,
   2.4,12
  ),
  new THREE.MeshStandardMaterial({
   color:0x111111,
   metalness:.8
  })
 );

 barrel.rotation.x=Math.PI/2;
 barrel.position.set(
  .42,-.38,-2.3
 );

 gun.add(barrel);

 const grip=makeBox(
  .28,.65,.4,0x181818
 );

 grip.position.set(
  .42,-.78,-.55
 );

 gun.add(grip);

 if(weaponIndex>0){

  const mag=makeBox(
   .23,.7,.32,0x181818
  );

  mag.position.set(
   .42,-.78,-1
  );

  gun.add(mag);
 }
}

createGun();

/* =====================================================
   SOM
===================================================== */

let audio=null;

function beep(freq,dur){

 try{

  if(!audio)
   audio=new AudioContext();

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.frequency.value=freq;
  osc.type="square";

  gain.gain.setValueAtTime(
   .13,audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
   .001,
   audio.currentTime+dur
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(
   audio.currentTime+dur
  );

 }catch(e){}
}

function gunSound(){

 const f=weapons[weaponIndex].sound;

 beep(f,.08);

 setTimeout(
  ()=>beep(f/2,.05),
  20
 );
}

/* =====================================================
   JOYSTICK
===================================================== */

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(e){

 const r=joy.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const max=42;
 const dist=Math.hypot(dx,dy);

 if(dist>max){
  dx=dx/dist*max;
  dy=dy/dist*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 knob.style.left=(37+dx)+"px";
 knob.style.top=(37+dy)+"px";
}

joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});

joy.addEventListener("pointermove",e=>{
 if(joyActive)moveJoy(e);
});

joy.addEventListener("pointerup",()=>{
 joyActive=false;
 joyX=0;
 joyY=0;
 knob.style.left="37px";
 knob.style.top="37px";
});

/* =====================================================
   CÂMERA
===================================================== */

let look=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
 "pointerdown",
 e=>{
  look=true;
  lastX=e.clientX;
  lastY=e.clientY;
 }
);

renderer.domElement.addEventListener(
 "pointermove",
 e=>{

  if(!look)return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;

  lastX=e.clientX;
  lastY=e.clientY;

  player.angle-=dx*.004;
  player.pitch-=dy*.003;

  player.pitch=Math.max(
   -.9,
   Math.min(.9,player.pitch)
  );
 }
);

renderer.domElement.addEventListener(
 "pointerup",
 ()=>look=false
);

/* =====================================================
   CORRER
===================================================== */

document.getElementById("run")
.addEventListener("click",()=>{

 player.running=!player.running;

 document.getElementById("run")
 .style.background=
 player.running?
 "#1fa34a":"#24733c";
});

/* =====================================================
   MOVIMENTO
===================================================== */

function updatePlayer(){

 const speed=
  player.running?.28:.13;

 const forward=-joyY;
 const side=joyX;

 const fx=-Math.sin(player.angle);
 const fz=-Math.cos(player.angle);

 const rx=Math.cos(player.angle);
 const rz=-Math.sin(player.angle);

 const nx=
  player.x+
  (fx*forward+rx*side)*speed;

 const nz=
  player.z+
  (fz*forward+rz*side)*speed;

 if(!blocked(nx,player.z))
  player.x=nx;

 if(!blocked(player.x,nz))
  player.z=nz;

 camera.position.set(
  player.x,2,player.z
 );

 camera.rotation.order="YXZ";

 camera.rotation.y=
  player.angle;

 camera.rotation.x=
  player.pitch;
}

/* =====================================================
   ZUMBIS
===================================================== */

function updateZombies(){

 for(const z of zombies){

  const dx=
   player.x-z.mesh.position.x;

  const dz=
   player.z-z.mesh.position.z;

  const dist=Math.hypot(dx,dz);

  if(dist>2.4){

   z.mesh.position.x+=
    dx/dist*.023;

   z.mesh.position.z+=
    dz/dist*.023;

   /*
    SOMENTE Y:
    zumbi nunca inclina/deita
   */

   z.mesh.rotation.y=
    Math.atan2(dx,dz);

   z.mesh.rotation.x=0;
   z.mesh.rotation.z=0;

   z.phase+=.13;

   const walk=
    Math.sin(z.phase)*.45;

   z.leftLeg.rotation.x=walk;
   z.rightLeg.rotation.x=-walk;

   z.leftArm.rotation.x=-walk;
   z.rightArm.rotation.x=walk;

  }else{

   z.mesh.rotation.y=
    Math.atan2(dx,dz);

   z.mesh.rotation.x=0;
   z.mesh.rotation.z=0;

   z.attack++;

   const move=
    Math.sin(z.attack*.2)*.15;

   z.leftArm.rotation.x=-1.1+move;
   z.rightArm.rotation.x=-1.1-move;

   if(z.attack%90===0){

    player.health-=5;

    document.getElementById("hp")
    .style.width=
    Math.max(0,player.health)+"%";

    if(player.health<=0)
     gameOver();
   }
  }
 }
}

/* =====================================================
   TIRO
===================================================== */

function shoot(){

 const now=performance.now();

 const w=weapons[weaponIndex];

 if(now-lastShot<w.delay)
  return;

 lastShot=now;

 gunSound();

 gun.position.z=.13;

 setTimeout(
  ()=>gun.position.z=0,
  50
 );

 const direction=
  new THREE.Vector3();

 camera.getWorldDirection(
  direction
 );

 const ray=new THREE.Raycaster(
  camera.position.clone(),
  direction,
  0,250
 );

 const hits=
  ray.intersectObjects(
   zombies.map(z=>z.mesh),
   true
  );

 if(!hits.length)return;

 const hit=hits[0].object;

 let target=null;

 for(const z of zombies){

  if(z.mesh===hit ||
     z.mesh.getObjectById(hit.id)){

   target=z;
   break;
  }
 }

 if(!target){

  for(const z of zombies){

   let parent=hit;

   while(parent){

    if(parent===z.mesh){
     target=z;
     break;
    }

    parent=parent.parent;
   }

   if(target)break;
  }
 }

 if(target){

  target.hp-=w.damage;

  if(target.hp<=0){

   scene.remove(target.mesh);

   const i=zombies.indexOf(target);

   if(i>=0)
    zombies.splice(i,1);

   kills++;

   document.getElementById("kills")
   .textContent=kills;
  }
 }
}

fire.addEventListener(

/* =====================================================
   MAPA
===================================================== */

const mapCanvas=
 document.getElementById("mapCanvas");

const ctx=mapCanvas.getContext("2d");

mapCanvas.width=210;
mapCanvas.height=210;

function minimap(){

 ctx.clearRect(0,0,210,210);

 ctx.fillStyle="#628857";
 ctx.fillRect(0,0,210,210);

 const scale=.18;

 ctx.strokeStyle="#555";
 ctx.lineWidth=10;

 ctx.beginPath();
 ctx.moveTo(105,0);
 ctx.lineTo(105,210);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(0,105);
 ctx.lineTo(210,105);
 ctx.stroke();

 /* casas */

 ctx.fillStyle="#8b4938";

 for(const c of walls){

  const x=
   105+(c.x-player.x)*scale;

  const y=
   105+(c.z-player.z)*scale;

  if(x>-20&&x<230&&y>-20&&y<230){

   ctx.fillRect(
    x-c.w*scale/2,
    y-c.d*scale/2,
    c.w*scale,
    c.d*scale
   );
  }
 }

 /* zumbis */

 ctx.fillStyle="#e22";

 for(const z of zombies){

  const x=
   105+
   (z.mesh.position.x-player.x)*scale;

  const y=
   105+
   (z.mesh.position.z-player.z)*scale;

  if(x>=0&&x<=210&&y>=0&&y<=210){

   ctx.beginPath();
   ctx.arc(x,y,3,0,Math.PI*2);
   ctx.fill();
  }
 }

 /* jogador */

 ctx.save();

 ctx.translate(105,105);
 ctx.rotate(player.angle);

 ctx.fillStyle="#19ff55";

 ctx.beginPath();
 ctx.moveTo(0,-9);
 ctx.lineTo(6,7);
 ctx.lineTo(-6,7);
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

/* =====================================================
   GAME OVER
===================================================== */

let kills=0;
let dead=false;

function gameOver(){

 if(dead)return;

 dead=true;

 document.getElementById(
  "finalKills"
 ).textContent=kills;

 document.getElementById(
  "gameover"
 ).style.display="flex";
}

/* =====================================================
   START
===================================================== */

document.getElementById("start")
.addEventListener("click",()=>{

 document.getElementById("menu")
 .style.display="none";

 document.getElementById("hud")
 .style.display="block";

 document.getElementById("weapon")
 .style.display="block";

 document.getElementById("cross")
 .style.display="block";

 document.getElementById("joy")
 .style.display="block";

 document.getElementById("fire")
 .style.display="block";

 document.getElementById("switch")
 .style.display="block";

 document.getElementById("run")
 .style.display="block";

 if(!audio)
  audio=new AudioContext();

 if(audio.state==="suspended")
  audio.resume();
});

/* =====================================================
   LOOP
===================================================== */

function animate(){

 requestAnimationFrame(animate);

 if(!dead){

  updatePlayer();
  updateZombies();
  minimap();

  if(firing)
   shoot();
 }

 renderer.render(scene,camera);
}

animate();

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 });
</script>
