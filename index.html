/* =====================================================
   COLISÕES
===================================================== */

const colliders=[];

function addCollider(x,z,w,d){

    colliders.push({
        x:x,
        z:z,
        w:w,
        d:d
    });
}

function blocked(x,z){

    const radius=.55;

    for(const c of colliders){

        if(
            x > c.x-c.w/2-radius &&
            x < c.x+c.w/2+radius &&
            z > c.z-c.d/2-radius &&
            z < c.z+c.d/2+radius
        ){
            return true;
        }
    }

    return false;
}

        new THREE.MeshStandardMaterial({

    wall.position.y=h/2;
    wall.castShadow=true;
    wall.receiveShadow=true;

    group.add(wall);

    /* telhado */

    const roof =
    new THREE.Mesh(
        new THREE.ConeGeometry(
            Math.max(w,d)*.72,
            5,
            4
        ),
        new THREE.MeshStandardMaterial({
            color:0x25282b,
            roughness:.8
        })
    );

    roof.rotation.y=Math.PI/4;
    roof.position.y=h+2;

    roof.castShadow=true;

    group.add(roof);

    /* porta */

    const door =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1.4,2.6,.12
        ),
        new THREE.MeshStandardMaterial({
            color:0x251914
        })
    );

    door.position.set(
        0,
        1.3,
        d/2+.07
    );

    group.add(door);

    /* janelas */

    for(const xx of [-w*.3,w*.3]){

        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.4,1.2,.1
            ),
            new THREE.MeshBasicMaterial({
                color:0xd6a846
            })
        );

        win.position.set(
            xx,
            h*.62,
            d/2+.06
        );

        group.add(win);
    }

    group.position.set(x,0,z);

    scene.add(group);

    addCollider(
        x,z,w,d
    );
}

/* =====================================================
   MOVIMENTO
===================================================== */

let joyX=0;
let joyY=0;

let joystickActive=false;

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

function joystickMove(e){

    const r=
    joystick.getBoundingClientRect();

    const cx=
    r.left+r.width/2;

    const cy=
    r.top+r.height/2;

    let dx=e.clientX-cx;
    let dy=e.clientY-cy;

    const max=43;

    const d=
    Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.left=
    (34+dx)+"px";

    stick.style.top=
    (34+dy)+"px";
}

joystick.addEventListener(
    "pointerdown",
    e=>{
        joystickActive=true;
        joystick.setPointerCapture(
            e.pointerId
        );
        joystickMove(e);
    }
);

joystick.addEventListener(
    "pointermove",
    e=>{
        if(joystickActive)
            joystickMove(e);
    }
);

joystick.addEventListener(
    "pointerup",
    ()=>{
        joystickActive=false;
        joyX=0;
        joyY=0;
        stick.style.left="34px";
        stick.style.top="34px";
    }
);

/* =====================================================
   CORREÇÃO DO OLHAR
===================================================== */

let look=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
    "pointerdown",
    e=>{
        look=true;
        lastX=e.clientX;
        lastY=e.clientY;
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(!look)return;

        const dx=
        e.clientX-lastX;

        const dy=
        e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        player.angle-=dx*.004;
        player.pitch-=dy*.003;

        player.pitch=
        Math.max(
            -1.15,
            Math.min(
                1.15,
                player.pitch
            )
        );
    }
);

renderer.domElement.addEventListener(
    "pointerup",
    ()=>{
        look=false;
    }
);

/* =====================================================
   COLISÃO DO JOGADOR
===================================================== */

function movePlayer(nx,nz){

    if(!blocked(nx,player.z))
        player.x=nx;

    if(!blocked(player.x,nz))
        player.z=nz;
}

/* =====================================================
   ATUALIZAR JOGADOR
===================================================== */

function updatePlayer(){

    let forward=-joyY;
    let side=joyX;

    if(keys["w"])forward=1;
    if(keys["s"])forward=-1;
    if(keys["a"])side=-1;
    if(keys["d"])side=1;

    const speed=
    running
    ?player.speed*1.7
    :player.speed;

    /* frente correta */

    const fx=
    -Math.sin(player.angle);

    const fz=
    -Math.cos(player.angle);

    const rx=
    Math.cos(player.angle);

    const rz=
    -Math.sin(player.angle);

    const nx=
    player.x+
    (fx*forward+rx*side)*speed;

    const nz=
    player.z+
    (fz*forward+rz*side)*speed;

    movePlayer(nx,nz);

    camera.position.set(
        player.x,
        player.y,
        player.z
    );

    camera.rotation.order="YXZ";

    camera.rotation.y=
    player.angle;

    camera.rotation.x=
    player.pitch;
}

/* =====================================================
   TIRO
===================================================== */

const bullets=[];

let lastShot=0;
let shooting=false;

function shoot(){

    if(gameEnded)return;

    const now=
    performance.now();

    if(now-lastShot<180)return;

    lastShot=now;

    /* efeito de recuo */

    weapon.position.z=.12;

    setTimeout(()=>{
        weapon.position.z=0;
    },70);

    const direction=
    new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    bullets.push({
        pos:camera.position.clone(),
        dir:direction,
        life:0
    });

    /* clarão */

    const flash=
    new THREE.PointLight(
        0xffaa55,
        7,
        9
    );

    flash.position.set(
        .43,-.36,-2.7
    );

    weapon.add(flash);

    setTimeout(()=>{
        weapon.remove(flash);
    },55);
}

document.getElementById("shoot")
.addEventListener(
    "pointerdown",
    ()=>{
        shooting=true;
    }
);

document.getElementById("shoot")
.addEventListener(
    "pointerup",
    ()=>{
        shooting=false;
    }
);

/* =====================================================
   BALAS
===================================================== */

function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.pos.addScaledVector(
            b.dir,
            .9
        );

        b.life++;

        let hit=false;

        for(let j=zombies.length-1;j>=0;j--){

            const z=zombies[j];

            const d=
            b.pos.distanceTo(
                z.mesh.position
            );

            if(d<2.4){

                z.hp--;

                hit=true;

                if(z.hp<=0){

                    scene.remove(
                        z.mesh
                    );

                    zombies.splice(j,1);

                    kills++;

                    document.getElementById(
                        "kills"
                    ).textContent=kills;
                }

                break;
            }
        }

        if(hit||b.life>100)
            bullets.splice(i,1);
    }
}

/* =====================================================
   ZUMBIS
===================================================== */

function updateZombies(){

    for(const z of zombies){

        const dx=
        player.x-z.mesh.position.x;

        const dz=
        player.z-z.mesh.position.z;

        const distance=
        Math.hypot(dx,dz);

        if(distance>2.4){

            z.mesh.position.x+=
            dx/distance*z.speed;

            z.mesh.position.z+=
            dz/distance*z.speed;

            z.mesh.lookAt(
                player.x,
                1.7,
                player.z
            );

        }else{

            z.attack++;

            if(z.attack>35){

                player.health-=6;

                z.attack=0;

                damage();

                if(player.health<=0)
                    gameOver();
            }
        }

        z.growl--;

        if(
            z.growl<=0 &&
            distance<90
        ){

            z.growl=
            300+Math.random()*500;
        }
    }
}

/* =====================================================
   DANO
===================================================== */

function damage(){

    const d=
    document.getElementById(
        "damage"
    );

    d.style.opacity=.8;

    setTimeout(()=>{
        d.style.opacity=0;
    },130);

    document.getElementById(
        "life"
    ).style.width=
    Math.max(
        0,
        player.health
    )+"%";
}

/* =====================================================
   GAME OVER
===================================================== */

let gameEnded=false;
let kills=0;

function gameOver(){

    if(gameEnded)return;

    gameEnded=true;

    document.getElementById(
        "finalKills"
    ).textContent=kills;

    document.getElementById(
        "gameover"
    ).style.display="flex";
}

document.getElementById(
    "restart"
).onclick=()=>{
    location.reload();
};

/* =====================================================
   LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(gameEnded)return;

    updatePlayer();
    updateBullets();
    updateZombies();

    if(shooting)
        shoot();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{
        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
