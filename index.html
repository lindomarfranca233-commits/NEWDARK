<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEW DARK V11</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;font-family:Arial}
canvas{display:block;touch-action:none}

#menu{
position:fixed;inset:0;z-index:100;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:radial-gradient(circle,#304765,#020407 70%);
color:white;text-align:center
}
#menu h1{
font-size:62px;letter-spacing:9px;margin:0;
text-shadow:0 0 30px #7caaff,3px 3px 8px #000
}
#menu p{color:#c9d3df;margin:10px 0 30px}
button{
border:2px solid white;border-radius:9px;
color:white;background:#173654;
padding:14px 28px;font-size:18px;font-weight:bold
}

#hud{
position:fixed;left:12px;top:12px;z-index:20;
color:white;font-weight:bold;text-shadow:2px 2px 5px #000
}
#bar{
width:190px;height:18px;
border:2px solid white;background:#222
}
#hp{width:100%;height:100%;background:#28df5b}

#weapon{
position:fixed;right:15px;top:15px;
color:white;z-index:20;font-weight:bold;
text-shadow:2px 2px 5px #000
}
#zoom{
display:none;position:fixed;right:15px;top:42px;
color:white;z-index:20;font-weight:bold
}

#cross{
position:fixed;left:50%;top:50%;
transform:translate(-50%,-50%);
color:white;font-size:28px;z-index:15
}

#scope{
display:none;position:fixed;inset:0;
z-index:16;pointer-events:none
}
#scope:before{
content:"";position:absolute;inset:0;
background:radial-gradient(circle,
transparent 0 23%,rgba(0,0,0,.96) 26%)
}
#scope:after{
content:"";position:absolute;
left:50%;top:22%;width:2px;height:56%;
background:white
}
#scopeLine{
position:absolute;left:23%;right:23%;
top:50%;height:2px;background:white
}

#damage{
position:fixed;inset:0;
background:#e00000;opacity:0;
z-index:14;pointer-events:none
}

#joy{
position:fixed;left:20px;bottom:20px;
width:135px;height:135px;border-radius:50%;
border:3px solid rgba(255,255,255,.4);
background:rgba(255,255,255,.08);z-index:30
}
#knob{
position:absolute;left:38px;top:38px;
width:55px;height:55px;border-radius:50%;
background:rgba(255,255,255,.5)
}

.action{
position:fixed;z-index:30;
border-radius:50%;
width:70px;height:70px;
padding:0
}
#fire{
right:20px;bottom:22px;
width:95px;height:95px;background:#941616
}
#run{right:130px;bottom:35px;background:#303842}
#switch{right:130px;bottom:115px;background:#294c6b}
#zoomBtn{
display:none;right:210px;bottom:115px;
background:#294c6b
}

#mini{
position:fixed;right:12px;bottom:12px;
width:150px;height:150px;
border:3px solid white;border-radius:50%;
overflow:hidden;background:#17231b;z-index:20
}
#miniCanvas{width:100%;height:100%}

#gameover{
display:none;position:fixed;inset:0;z-index:100;
align-items:center;justify-content:center;
flex-direction:column;background:rgba(0,0,0,.9);
color:white;text-align:center
}
</style>
</head>

<body>

<div id="menu">
<h1>NEW DARK</h1>
<p>V11 • ZOMBIE SURVIVAL</p>
<button id="start">JOGAR</button>
</div>

<div id="hud">
VIDA
<div id="bar"><div id="hp"></div></div>
🧟 <span id="kills">0</span>
</div>

<div id="weapon">PISTOLA</div>
<div id="zoom">ZOOM 1X</div>
<div id="cross">+</div>

<div id="scope">
<div id="scopeLine"></div>
</div>

<div id="damage"></div>

<div id="joy">
<div id="knob"></div>
</div>

<button id="fire" class="action">🔫<br>ATIRAR</button>
<button id="run" class="action">🏃</button>
<button id="switch" class="action">🔄</button>
<button id="zoomBtn" class="action">🔭</button>

<div id="mini">
<canvas id="miniCanvas"></canvas>
</div>

<div id="gameover">
<h1>VOCÊ MORREU</h1>
<p>Zumbis eliminados: <span id="finalKills">0</span></p>
<button onclick="location.reload()">JOGAR NOVAMENTE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   CENA
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x111b29);
scene.fog=new THREE.Fog(0x111b29,60,650);

const camera=new THREE.PerspectiveCamera(
72,innerWidth/innerHeight,.05,1200
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* =========================
   ILUMINAÇÃO
========================= */

scene.add(new THREE.HemisphereLight(
0x8da9d0,0x202b20,.8
));

const moonLight=new THREE.DirectionalLight(
0xb9caff,1.8
);

moonLight.position.set(-180,250,-150);
moonLight.castShadow=true;
moonLight.shadow.mapSize.width=2048;
moonLight.shadow.mapSize.height=2048;

scene.add(moonLight);

const moon=new THREE.Mesh(
new THREE.SphereGeometry(20,32,32),
new THREE.MeshBasicMaterial({color:0xfff2bf})
);

moon.position.set(-250,260,-400);
scene.add(moon);

/* =========================
   TERRENO
========================= */

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(2000,2000),
new THREE.MeshStandardMaterial({
color:0x344936,
roughness:1
})
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* =========================
   RUAS
========================= */

function makeRoad(x,z,w,d){

const road=new THREE.Mesh(
new THREE.BoxGeometry(w,.07,d),
new THREE.MeshStandardMaterial({
color:0x3a3d42,
roughness:.95
})
);

road.position.set(x,.04,z);
scene.add(road);

if(w>d){

for(let i=-450;i<450;i+=24){

const stripe=new THREE.Mesh(
new THREE.BoxGeometry(9,.09,.3),
new THREE.MeshBasicMaterial({
color:0xe0d06b
})
);

stripe.position.set(x+i,.1,z);
scene.add(stripe);
}

}else{

for(let i=-450;i<450;i+=24){

const stripe=new THREE.Mesh(
new THREE.BoxGeometry(.3,.09,9),
new THREE.MeshBasicMaterial({
color:0xe0d06b
})
);

stripe.position.set(x,.1,z+i);
scene.add(stripe);
}
}
}

makeRoad(0,0,48,1000);
makeRoad(0,0,1000,48);

/* =========================
   COLISÕES
========================= */

const walls=[];

function addWall(x,z,w,d){
walls.push({x,z,w,d});
}

function collision(x,z){

const r=.7;

return walls.some(c=>
x>c.x-c.w/2-r &&
x<c.x+c.w/2+r &&
z>c.z-c.d/2-r &&
z<c.z+c.d/2+r
);
}

/* =========================
   CASAS
========================= */

function createHouse(x,z,w,d,h){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:0x826654,
roughness:.9
})
);

body.position.y=h/2;
body.castShadow=true;
body.receiveShadow=true;
g.add(body);

const roof=new THREE.Mesh(
new THREE.ConeGeometry(
Math.max(w,d)*.72,5,4
),
new THREE.MeshStandardMaterial({
color:0x27292b,
roughness:.8
})
);

roof.rotation.y=Math.PI/4;
roof.position.y=h+2.5;
g.add(roof);

const door=new THREE.Mesh(
new THREE.BoxGeometry(1.5,2.8,.1),
new THREE.MeshStandardMaterial({
color:0x241713
})
);

door.position.set(0,1.4,d/2+.06);
g.add(door);

for(const xx of [-w*.3,w*.3]){

const window=new THREE.Mesh(
new THREE.BoxGeometry(1.6,1.2,.08),
new THREE.MeshBasicMaterial({
color:0xe3bd61
})
);

window.position.set(
xx,h*.6,d/2+.08
);

g.add(window);
}

g.position.set(x,0,z);
scene.add(g);

addWall(x,z,w,d);
}

createHouse(-65,-75,30,27,15);
createHouse(65,-75,32,28,17);
createHouse(-70,75,34,28,16);
createHouse(70,75,30,30,18);
createHouse(-150,-115,42,35,22);
createHouse(150,-120,42,35,25);
createHouse(-150,125,45,38,23);
createHouse(150,125,45,38,28);

/* =========================
   PRÉDIOS
========================= */

function createBuilding(x,z,w,d,h){

const b=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:0x5c6065,
roughness:.85
})
);

b.position.set(x,h/2,z);
b.castShadow=true;
b.receiveShadow=true;

scene.add(b);
addWall(x,z,w,d);

for(let y=5;y<h;y+=5){

for(let xx=-w/2+3;xx<w/2-2;xx+=5){

const win=new THREE.Mesh(
new THREE.BoxGeometry(2,2.3,.08),
new THREE.MeshBasicMaterial({
color:Math.random()>.45
?0xd5b65d:0x172331
})
);

win.position.set(
x+xx,y,z-d/2-.05
);

scene.add(win);
}
}
}

createBuilding(-225,-70,55,45,38);
createBuilding(225,-75,60,48,45);
createBuilding(-225,80,50,50,42);
createBuilding(225,85,55,45,50);

/* =========================
   POSTES
========================= */

function lamp(x,z){

const pole=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.17,7,8),
new THREE.MeshStandardMaterial({
color:0x25292c,
metalness:.7
})
);

pole.position.set(x,3.5,z);
pole.castShadow=true;
scene.add(pole);

const light=new THREE.PointLight(
0xffd58a,2.5,30
);

light.position.set(x,7,z);
scene.add(light);
}

for(let i=-400;i<=400;i+=45){
lamp(i,-30);
lamp(i,30);
}

/* =========================
   CARROS
========================= */

const cars=[];

function createCar(x,z,color){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(4.8,1.35,8),
new THREE.MeshStandardMaterial({
color,
metalness:.35,
roughness:.35
})
);

body.position.y=1.2;
body.castShadow=true;
g.add(body);

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(4,1.2,4),
new THREE.MeshStandardMaterial({
color:0x12171c,
roughness:.25
})
);

cabin.position.y=2.25;
g.add(cabin);

const wheelGeo=
new THREE.CylinderGeometry(.82,.82,.55,16);

for(const p of [
[-2.4,.8,-2.6],
[2.4,.8,-2.6],
[-2.4,.8,2.6],
[2.4,.8,2.6]
]){

const wheel=new THREE.Mesh(
wheelGeo,
new THREE.MeshStandardMaterial({
color:0x080808
})
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(...p);
g.add(wheel);
}

g.position.set(x,0,z);
scene.add(g);

cars.push({
mesh:g,
speed:0,
driving:false
});
}

createCar(-18,-58,0x992727);
createCar(18,-58,0x28538f);
createCar(-18,58,0x777777);
createCar(18,58,0xb28b29);

/* =========================
   ZUMBIS V11
========================= */

const zombies=[];

function createZombie(x,z){

const g=new THREE.Group();

const skin=new THREE.MeshStandardMaterial({
color:0x77846c,
roughness:1
});

const shirt=new THREE.MeshStandardMaterial({
color:0x3d5141,
roughness:.95
});

const pants=new THREE.MeshStandardMaterial({
color:0x252c30,
roughness:.95
});

/* pernas */

for(const xx of [-.24,.24]){

const leg=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.17,1.8,9),
pants
);

leg.position.set(xx,.9,0);
g.add(leg);

const foot=new THREE.Mesh(
new THREE.BoxGeometry(.32,.18,.65),
new THREE.MeshStandardMaterial({
color:0x17191b
})
);

foot.position.set(xx,.12,-.2);
g.add(foot);
}

/* tronco */

const body=new THREE.Mesh(
new THREE.CylinderGeometry(.32,.48,1.9,12),
shirt
);

body.position.y=2.1;
body.castShadow=true;
g.add(body);

/* pescoço */

const neck=new THREE.Mesh(
new THREE.CylinderGeometry(.15,.18,.35,8),
skin
);

neck.position.y=3.2;
g.add(neck);

/* cabeça */

const head=new THREE.Mesh(
new THREE.SphereGeometry(.55,18,18),
skin
);

head.position.y=3.75;
head.castShadow=true;
g.add(head);

/* nariz */

const nose=new THREE.Mesh(
new THREE.SphereGeometry(.09,8,8),
skin
);

nose.position.set(0,3.68,-.54);
g.add(nose);

/* olhos */

const red=new THREE.MeshBasicMaterial({
color:0xff0808
});

for(const xx of [-.18,.18]){

const eye=new THREE.Mesh(
new THREE.SphereGeometry(.075,10,10),
red
);

eye.position.set(xx,3.84,-.51);
g.add(eye);
}

/* sobrancelhas */

for(const xx of [-.18,.18]){

const brow=new THREE.Mesh(
new THREE.BoxGeometry(.2,.06,.06),
new THREE.MeshStandardMaterial({
color:0x2d312b
})
);

brow.position.set(xx,3.98,-.51);
brow.rotation.z=xx<0?-.15:.15;

g.add(brow);
}

/* boca */

const mouth=new THREE.Mesh(
new THREE.BoxGeometry(.4,.13,.06),
new THREE.MeshBasicMaterial({
color:0x130606
})
);

mouth.position.set(0,3.56,-.53);
g.add(mouth);

/* dentes */

for(let i=-1;i<=1;i++){

const tooth=new THREE.Mesh(
new THREE.BoxGeometry(.07,.09,.04),
new THREE.MeshBasicMaterial({
color:0xd7d0b7
})
);

tooth.position.set(i*.09,3.58,-.57);
g.add(tooth);
}

/* braços */

for(const xx of [-.62,.62]){

const arm=new THREE.Mesh(
new THREE.CylinderGeometry(.11,.16,1.8,9),
skin
);

arm.position.set(xx,2.15,0);
arm.rotation.z=xx<0?-.3:.3;
g.add(arm);

const hand=new THREE.Mesh(
new THREE.SphereGeometry(.17,10,10),
skin
);

hand.position.set(xx*1.1,1.35,.05);
g.add(hand);
}

g.position.set(x,0,z);

scene.add(g);

zombies.push({
mesh:g,
hp:3,
speed:.018+Math.random()*.016,
attack:0,
phase:Math.random()*10
});
}

for(let i=0;i<45;i++){

const a=Math.random()*Math.PI*2;
const d=120+Math.random()*430;

createZombie(
Math.sin(a)*d,
Math.cos(a)*d
);
}

/* =========================
   JOGADOR
========================= */

const player={
x:0,
y:1.7,
z:0,
angle:0,
pitch:0,
health:100
};

camera.position.set(0,1.7,0);

/* =========================
   ARMAS
========================= */

const weapons=[
{name:"PISTOLA",damage:2,delay:230,length:1.2,body:.6},
{name:"AK-47",damage:2,delay:150,length:2.3,body:1.3},
{name:"UMP",damage:2,delay:130,length:1.8,body:1.1},
{name:"SCAR",damage:3,delay:180,length:2.7,body:1.5},
{name:"SNIPER",damage:6,delay:550,length:3.8,body:1.7}
];

let weaponIndex=0;
let zoomLevel=1;

const weaponGroup=new THREE.Group();
camera.add(weaponGroup);
scene.add(camera);

function makeWeapon(){

while(weaponGroup.children.length)
weaponGroup.remove(weaponGroup.children[0]);

const w=weapons[weaponIndex];

const mat=new THREE.MeshStandardMaterial({
color:0x1d2226,
metalness:.85,
roughness:.22
});

const body=new THREE.Mesh(
new THREE.BoxGeometry(w.body,.45,.8),
mat
);

body.position.set(.43,-.38,-1);
weaponGroup.add(body);

const barrel=new THREE.Mesh(
new THREE.CylinderGeometry(.085,.11,w.length,16),
mat
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
.43,-.37,-1-w.length/2
);

weaponGroup.add(barrel);

const grip=new THREE.Mesh(
new THREE.BoxGeometry(.25,.7,.35),
mat
);

grip.rotation.x=.25;
grip.position.set(.43,-.82,-.65);
weaponGroup.add(grip);

if(weaponIndex>=1&&weaponIndex<=3){

const mag=new THREE.Mesh(
new THREE.BoxGeometry(.28,.7,.4),
mat
);

mag.rotation.x=-.25;
mag.position.set(.43,-.75,-1);
weaponGroup.add(mag);
}

if(weaponIndex===4){

const scope=new THREE.Mesh(
new THREE.CylinderGeometry(.13,.13,1,16),
new THREE.MeshStandardMaterial({
color:0x111315,
metalness:.9
})
);

scope.rotation.x=Math.PI/2;
scope.position.set(.43,-.04,-1.45);
weaponGroup.add(scope);
}
}

makeWeapon();

/* =========================
   MOVIMENTO
========================= */

let joyX=0;
let joyY=0;
let moving=false;
let running=false;

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

function moveJoy(e){

const r=joy.getBoundingClientRect();

let dx=e.clientX-(r.left+r.width/2);
let dy=e.clientY-(r.top+r.height/2);

const max=45;
const dist=Math.hypot(dx,dy);

if(dist>max){
dx=dx/dist*max;
dy=dy/dist*max;
}

joyX=dx/max;
joyY=dy/max;

knob.style.left=(40+dx)+"px";
knob.style.top=(40+dy)+"px";
}

joy.addEventListener("pointerdown",e=>{
moving=true;
joy.setPointerCapture(e.pointerId);
moveJoy(e);
});

joy.addEventListener("pointermove",e=>{
if(moving)moveJoy(e);
});

joy.addEventListener("pointerup",()=>{
moving=false;
joyX=0;
joyY=0;
knob.style.left="38px";
knob.style.top="38px";
});

document.getElementById("run")
.addEventListener("pointerdown",()=>{
running=true;
});

document.getElementById("run")
.addEventListener("pointerup",()=>{
running=false;
});

/* =========================
   CÂMERA
========================= */

let looking=false;
let lastX=0;
let lastY=0;

renderer.domElement.addEventListener(
"pointerdown",e=>{
looking=true;
lastX=e.clientX;
lastY=e.clientY;
}
);

renderer.domElement.addEventListener(
"pointermove",e=>{

if(!looking)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

lastX=e.clientX;
lastY=e.clientY;

player.angle-=dx*.004;
player.pitch-=dy*.003;

player.pitch=
Math.max(-1.15,Math.min(1.15,player.pitch));
}
);

renderer.domElement.addEventListener(
"pointerup",()=>{
looking=false;
}
);

/* =========================
   UPDATE JOGADOR
========================= */

function updatePlayer(){

const speed=running?.20:.12;

const forward=-joyY;
const side=joyX;

const fx=-Math.sin(player.angle);
const fz=-Math.cos(player.angle);

const rx=Math.cos(player.angle);
const rz=-Math.sin(player.angle);

const nx=
player.x+(fx*forward+rx*side)*speed;

const nz=
player.z+(fz*forward+rz*side)*speed;

if(!collision(nx,player.z))
player.x=nx;

if(!collision(player.x,nz))
player.z=nz;

camera.position.set(
player.x,player.y,player.z
);

camera.rotation.order="YXZ";
camera.rotation.y=player.angle;
camera.rotation.x=player.pitch;
}

/* =========================
   TIROS
========================= */

const bullets=[];
let firing=false;
let lastShot=0;
let kills=0;

function shoot(){

const now=performance.now();
const w=weapons[weaponIndex];

if(now-lastShot<w.delay)return;

lastShot=now;

weaponGroup.position.z=.12;

setTimeout(()=>{
weaponGroup.position.z=0;
},65);

const dir=new THREE.Vector3();

camera.getWorldDirection(dir);

bullets.push({
pos:camera.position.clone(),
dir,
damage:w.damage,
life:0
});

/* flash */

const flash=new THREE.PointLight(
0xffa13b,9,10
);

flash.position.set(.43,-.37,-2);
weaponGroup.add(flash);

setTimeout(()=>{
weaponGroup.remove(flash);
},45);
}

document.getElementById("fire")
.addEventListener("pointerdown",()=>{
firing=true;
});

document.getElementById("fire")
.addEventListener("pointerup",()=>{
firing=false;
});

/* =========================
   SANGUE VISUAL
========================= */

function blood(position){

for(let i=0;i<9;i++){

const p=new THREE.Mesh(
new THREE.SphereGeometry(
.035+Math.random()*.045,6,6
),
new THREE.MeshBasicMaterial({
color:0xa90c0c
})
);

p.position.copy(position);
scene.add(p);

const v=new THREE.Vector3(
(Math.random()-.5)*.09,
Math.random()*.09,
(Math.random()-.5)*.09
);

let life=0;

function particle(){

p.position.add(v);
v.y-=.004;
life++;

if(life>18){
scene.remove(p);
return;
}

requestAnimationFrame(particle);
}

particle();
}
}

/* =========================
   BALAS
========================= */

function updateBullets(){

for(let i=bullets.length-1;i>=0;i--){

const b=bullets[i];

b.pos.addScaledVector(b.dir,.9);
b.life++;

let hit=false;

for(let j=zombies.length-1;j>=0;j--){

const z=zombies[j];

const center=z.mesh.position.clone();
center.y+=2;

if(b.pos.distanceTo(center)<2.1){

blood(b.pos);

z.hp-=b.damage;
hit=true;

if(z.hp<=0){

scene.remove(z.mesh);
zombies.splice(j,1);

kills++;

document.getElementById(
"kills"
).textContent=kills;
}

break;
}
}

if(hit||b.life>100)
bullets.splice(i,1);
}
}

/* =========================
   ZUMBIS
========================= */

function updateZombies(){

for(const z of zombies){

const dx=player.x-z.mesh.position.x;
const dz=player.z-z.mesh.position.z;

const dist=Math.hypot(dx,dz);

if(dist>2.5){

z.mesh.position.x+=dx/dist*z.speed;
z.mesh.position.z+=dz/dist*z.speed;

z.mesh.lookAt(
player.x,1.7,player.z
);

z.phase+=.15;

z.mesh.position.y=
Math.sin(z.phase)*.025;

}else{

z.attack++;

if(z.attack>35){

player.health-=6;
z.attack=0;

takeDamage();

if(player.health<=0)
gameOver();
}
}
}
}

/* =========================
   DANO
========================= */

function takeDamage(){

const d=document.getElementById("damage");

d.style.opacity=.7;

setTimeout(()=>{
d.style.opacity=0;
},130);

document.getElementById("hp")
.style.width=
Math.max(0,player.health)+"%";
}

/* =========================
   MINIMAPA
========================= */

const mc=document.getElementById("miniCanvas");
const ctx=mc.getContext("2d");

mc.width=300;
mc.height=300;

function minimap(){

ctx.clearRect(0,0,300,300);

ctx.fillStyle="#142018";
ctx.fillRect(0,0,300,300);

const scale=.22;
const cx=150;
const cy=150;

/* ruas */

ctx.strokeStyle="#555";
ctx.lineWidth=12;

ctx.beginPath();
ctx.moveTo(cx,0);
ctx.lineTo(cx,300);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0,cy);
ctx.lineTo(300,cy);
ctx.stroke();

/* construções */

ctx.fillStyle="#777";

for(const c of walls){

const x=cx+(c.x-player.x)*scale;
const y=cy+(c.z-player.z)*scale;

if(x>-20&&x<320&&y>-20&&y<320){

ctx.fillRect(
x-c.w*scale/2,
y-c.d*scale/2,
c.w*scale,
c.d*scale
);
}
}

/* zumbis */

ctx.fillStyle="#ff2020";

for(const z of zombies){

const x=cx+
(z.mesh.position.x-player.x)*scale;

const y=cy+
(z.mesh.position.z-player.z)*scale;

if(x>0&&x<300&&y>0&&y<300){

ctx.beginPath();
ctx.arc(x,y,4,0,Math.PI*2);
ctx.fill();
}
}

/* jogador */

ctx.save();

ctx.translate(cx,cy);
ctx.rotate(player.angle);

ctx.fillStyle="#38ff66";

ctx.beginPath();
ctx.moveTo(0,-11);
ctx.lineTo(8,8);
ctx.lineTo(-8,8);
ctx.closePath();
ctx.fill();

ctx.restore();
}

/* =========================
   TROCA DE ARMA
========================= */

document.getElementById("switch")
.onclick=()=>{

weaponIndex++;

if(weaponIndex>=weapons.length)
weaponIndex=0;

makeWeapon();

document.getElementById(
"weapon"
).textContent=
weapons[weaponIndex].name;

const sniper=weaponIndex===4;

document.getElementById(
"scope"
).style.display=
sniper?"block":"none";

document.getElementById(
"zoomBtn"
).style.display=
sniper?"block":"none";

document.getElementById(
"zoom"
).style.display=
sniper?"block":"none";

document.getElementById(
"cross"
).style.display=
sniper?"none":"block";

zoomLevel=1;
camera.fov=72;
camera.updateProjectionMatrix();
};

/* =========================
   ZOOM
========================= */

document.getElementById("zoomBtn")
.onclick=()=>{

if(weaponIndex!==4)return;

zoomLevel++;

if(zoomLevel>3)
zoomLevel=1;

document.getElementById(
"zoom"
).textContent=
"ZOOM "+zoomLevel+"X";

camera.fov=
zoomLevel===1?72:
zoomLevel===2?45:28;

camera.updateProjectionMatrix();
};

/* =========================
   GAME OVER
========================= */

let dead=false;

function gameOver(){

if(dead)return;

dead=true;

document.getElementById(
"finalKills"
).textContent=kills;

document.getElementById(
"gameover"
).style.display="flex";
}

/* =========================
   START
========================= */

document.getElementById("start")
.onclick=()=>{

document.getElementById(
"menu"
).style.display="none";
};

/* =========================
   LOOP
========================= */

function animate(){

requestAnimationFrame(animate);

if(dead)return;

updatePlayer();
updateBullets();
updateZombies();
minimap();

if(firing)
shoot();

renderer.render(scene,camera);
}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,innerHeight
);
});

</script>
