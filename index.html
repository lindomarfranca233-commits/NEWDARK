<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NEWDARK V4 FINAL</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#030506;
 font-family:Arial,sans-serif;
 touch-action:none;
}

canvas{
 display:block;
 touch-action:none;
}

#menu{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle at 50% 35%,#263d35 0,#09100e 35%,#020303 78%);
 color:white;
 text-align:center;
}

.finalScreen{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 position:relative;
 overflow:hidden;
}

.finalScreen:before{
 content:"";
 position:absolute;
 width:420px;
 height:420px;
 border:1px solid #ffffff12;
 border-radius:50%;
 box-shadow:0 0 100px #d6323d22;
}

.version{
 color:#e03440;
 font-size:18px;
 font-weight:bold;
 letter-spacing:7px;
 margin-bottom:12px;
}

.logo{
 font-size:58px;
 font-weight:900;
 letter-spacing:8px;
 text-shadow:0 5px 20px #000;
}

.logo span{color:#d6323d}

.edition{
 color:#aaa;
 font-size:16px;
 letter-spacing:5px;
 margin-top:6px;
}

.line{
 width:180px;
 height:2px;
 background:#d6323d;
 margin:23px;
 box-shadow:0 0 15px #d6323d;
}

.finalScreen h2{
 font-size:18px;
 letter-spacing:3px;
 margin:0 0 8px;
}

.finalScreen p{
 color:#888;
 font-size:11px;
 letter-spacing:2px;
 margin:0 0 28px;
}

#start{
 border:0;
 border-radius:13px;
 padding:17px 58px;
 background:#c72e38;
 color:white;
 font-size:20px;
 font-weight:bold;
 box-shadow:0 0 30px #c72e3855;
}

.build{
 position:absolute;
 bottom:18px;
 color:#555;
 font-size:9px;
 letter-spacing:2px;
}

/* HUD */

#hud{
 position:fixed;
 inset:0;
 z-index:20;
 pointer-events:none;
 color:white;
 text-shadow:2px 2px 5px #000;
}

#status{
 position:absolute;
 top:12px;
 left:12px;
 background:#000b;
 padding:9px 12px;
 border-radius:10px;
 font-weight:bold;
 min-width:190px;
}

#healthBack{
 height:9px;
 margin-top:5px;
 background:#350d11;
 border-radius:10px;
 overflow:hidden;
}

#health{
 height:100%;
 width:100%;
 background:#df3543;
 transition:.15s;
}

#ammo{
 position:absolute;
 right:15px;
 top:10px;
 font-size:28px;
 font-weight:bold;
}

#weapon{
 position:absolute;
 right:15px;
 top:47px;
 font-size:14px;
}

#score{
 position:absolute;
 right:15px;
 top:68px;
 font-size:14px;
}

#wave{
 position:absolute;
 right:15px;
 top:89px;
 font-size:14px;
}

#cross{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 font-size:27px;
 font-weight:bold;
}

#message{
 position:absolute;
 top:20%;
 left:50%;
 transform:translateX(-50%);
 font-size:20px;
 font-weight:bold;
 opacity:0;
 transition:.2s;
}

#damage{
 position:fixed;
 inset:0;
 z-index:30;
 pointer-events:none;
 background:#b0000045;
 opacity:0;
}

/* MAP */

#map{
 position:fixed;
 z-index:22;
 right:15px;
 bottom:15px;
 width:125px;
 height:125px;
 border:2px solid #ffffff44;
 border-radius:10px;
 background:#07100ddd;
 pointer-events:none;
}

/* joystick */

#joy{
 position:fixed;
 z-index:40;
 left:20px;
 bottom:20px;
 width:145px;
 height:145px;
 border:2px solid #ffffff22;
 border-radius:50%;
 background:#ffffff09;
 touch-action:none;
}

#stick{
 position:absolute;
 left:50%;
 top:50%;
 width:58px;
 height:58px;
 border-radius:50%;
 background:#ffffff35;
 transform:translate(-50%,-50%);
}

/* buttons */

.action{
 position:fixed;
 z-index:41;
 border:0;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 touch-action:none;
 user-select:none;
}

#fire{
 right:20px;
 bottom:22px;
 width:100px;
 height:100px;
 background:#a92732dd;
 font-size:30px;
}

#jump{
 right:135px;
 bottom:30px;
 width:65px;
 height:65px;
 background:#426b5ddd;
 font-size:25px;
}

#reload{
 right:135px;
 bottom:108px;
 width:65px;
 height:65px;
 background:#555c;
 font-size:26px;
}

#swap{
 right:215px;
 bottom:30px;
 width:65px;
 height:65px;
 background:#333c;
 font-size:22px;
}

/* configuração */

#settingsBtn{
 position:fixed;
 z-index:45;
 left:175px;
 bottom:28px;
 width:52px;
 height:52px;
 border:0;
 border-radius:50%;
 background:#222b;
 color:white;
 font-size:22px;
}

#settings{
 position:fixed;
 inset:0;
 z-index:90;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000b;
}

.settingsBox{
 width:90%;
 max-width:420px;
 background:#0b0e0d;
 border:1px solid #ffffff22;
 border-radius:18px;
 padding:20px;
 color:white;
}

.settingsBox h2{
 margin-top:0;
}

.setting{
 margin:15px 0;
}

.setting input{
 width:100%;
}

.close{
 width:100%;
 padding:12px;
 border:0;
 border-radius:10px;
 background:#c72e38;
 color:white;
 font-weight:bold;
}

#tip{
 position:fixed;
 z-index:15;
 bottom:5px;
 left:50%;
 transform:translateX(-50%);
 color:#777;
 font-size:9px;
 pointer-events:none;
}

@media(max-width:700px) and (orientation:portrait){
 #menu:after{
  content:"GIRE O CELULAR DE LADO ↔";
  position:absolute;
  bottom:35px;
  color:#aaa;
  font-size:12px;
 }
}
</style>

<body>

<!-- MENU -->

<div id="menu">
 <div class="finalScreen">

  <div class="version">V4.0</div>

  <div class="logo">
   NEW<span>DARK</span>
  </div>

  <div class="edition">FINAL EDITION</div>

  <div class="line"></div>

  <h2>🧟 ZOMBIE SURVIVAL</h2>

  <p>SOBREVIVA À NOITE</p>

  <button id="start">▶ JOGAR</button>

  <div class="build">
   BUILD 004 • FINAL TEST
  </div>

 </div>
</div>

<div id="damage"></div>

<!-- HUD -->

<div id="hud">

 <div id="status">
  ❤️ <span id="hp">100</span>

  <div id="healthBack">
   <div id="health"></div>
  </div>
 </div>

 <div id="ammo">12 / 60</div>
 <div id="weapon">PISTOLA</div>
 <div id="score">Abates: 0</div>
 <div id="wave">Onda: 1</div>

 <div id="cross">+</div>
 <div id="message"></div>

</div>

<canvas id="map" width="250" height="250"></canvas>

<!-- CONTROLES -->

<div id="joy">
 <div id="stick"></div>
</div>

<button class="action" id="fire">●</button>
<button class="action" id="jump">↑</button>
<button class="action" id="reload">↻</button>
<button class="action" id="swap">🔫</button>

<button id="settingsBtn">⚙</button>

<div id="tip">Arraste o lado direito para olhar</div>

<!-- CONFIGURAÇÃO -->

<div id="settings">

 <div class="settingsBox">

  <h2>⚙ CONFIGURAÇÕES</h2>

  <div class="setting">
   Sensibilidade da câmera
   <input id="sens" type="range" min="0.5" max="3" step=".1" value="1">
  </div>

  <div class="setting">
   Velocidade
   <input id="speedControl" type="range" min="3" max="8" step=".1" value="5.4">
  </div>

  <div class="setting">
   Tamanho dos botões
   <input id="buttonSize" type="range" min="0.8" max="1.3" step=".05" value="1">
  </div>

  <button class="close" id="closeSettings">
   FECHAR
  </button>

 </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   VARIÁVEIS
========================= */

let scene;
let camera;
let renderer;
let clock;

let zombies=[];
let particles=[];
let buildings=[];

let hp=100;
let score=0;
let wave=1;

let moveX=0;
let moveY=0;

let yaw=0;
let pitch=0;

let lastShot=0;
let reloadBusy=false;

let verticalVelocity=0;
let onGround=true;

let lookActive=false;
let lastLookX=0;
let lastLookY=0;

let gameRunning=false;

let cameraSensitivity=1;
let playerSpeed=5.4;


/* =========================
   ARMAS
========================= */

const guns=[

 {
  name:"PISTOLA",
  mag:12,
  ammo:12,
  reserve:60,
  damage:3,
  delay:300,
  recoil:.012,
  color:0x242424,
  sound:150
 },

 {
  name:"METRALHADORA",
  mag:30,
  ammo:30,
  reserve:120,
  damage:2,
  delay:105,
  recoil:.008,
  color:0x111111,
  sound:115
 },

 {
  name:"SNIPER",
  mag:5,
  ammo:5,
  reserve:25,
  damage:15,
  delay:850,
  recoil:.035,
  color:0x292929,
  sound:80
 }

];

let gunIndex=0;
let gun=guns[0];


/* =========================
   ÁUDIO
========================= */

const AudioClass=
 window.AudioContext ||
 window.webkitAudioContext;

let audio=null;

function initAudio(){

 if(!audio){
  audio=new AudioClass();
 }

 if(audio.state==="suspended"){
  audio.resume();
 }

}

function sound(freq,duration=.08,type="square",volume=.035){

 if(!audio)return;

 try{

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(volume,audio.currentTime);

  gain.gain.exponentialRampToValueAtTime(
   .001,
   audio.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime+duration);

 }catch(e){}

}

function shootSound(){

 sound(gun.sound,.07,"sawtooth",.06);

 setTimeout(()=>{
  sound(gun.sound*.55,.09,"square",.025);
 },35);

}

function reloadSound(){

 sound(180,.06,"square",.025);

 setTimeout(()=>{
  sound(270,.06,"square",.025);
 },150);

 setTimeout(()=>{
  sound(120,.1,"square",.025);
 },350);

}

function jumpSound(){
 sound(260,.07,"sine",.02);
}

function zombieDeathSound(){
 sound(75,.2,"sawtooth",.025);
}


/* =========================
   INICIAR
========================= */

function startGame(){

 initAudio();

 if(gameRunning)return;

 gameRunning=true;

 scene=new THREE.Scene();

 scene.background=
  new THREE.Color(0x05090b);

 scene.fog=
  new THREE.Fog(0x05090b,18,105);

 camera=
  new THREE.PerspectiveCamera(
   68,
   innerWidth/innerHeight,
   .05,
   220
  );

 camera.rotation.order="YXZ";

 camera.position.set(0,1.7,8);

 renderer=
  new THREE.WebGLRenderer({
   antialias:true,
   powerPreference:"high-performance"
  });

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.4)
 );

 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

 document.body.appendChild(
  renderer.domElement
 );

 clock=new THREE.Clock();

 hp=100;
 score=0;
 wave=1;

 gunIndex=0;
 gun=guns[0];

 zombies=[];
 particles=[];
 buildings=[];

 createLighting();
 createWorld();
 createWeapon();

 for(let i=0;i<7;i++){
  spawnZombie();
 }

 document.getElementById("menu")
  .style.display="none";

 updateHUD();

 requestAnimationFrame(loop);

}


/* =========================
   LUZ
========================= */

function createLighting(){

 const hemi=
  new THREE.HemisphereLight(
   0x9db4c7,
   0x050505,
   1.15
  );

 scene.add(hemi);

 const moon=
  new THREE.DirectionalLight(
   0xb7caff,
   1.7
  );

 moon.position.set(
  -30,
  45,
  -25
 );

 moon.castShadow=true;

 moon.shadow.mapSize.width=512;
 moon.shadow.mapSize.height=512;

 scene.add(moon);

}


/* =========================
   MUNDO
========================= */

function createWorld(){

 const ground=
  new THREE.Mesh(
   new THREE.PlaneGeometry(220,220),
   new THREE.MeshStandardMaterial({
    color:0x151a18,
    roughness:1
   })
  );

 ground.rotation.x=-Math.PI/2;
 ground.receiveShadow=true;

 scene.add(ground);


 /* RUAS */

 const roadMat=
  new THREE.MeshStandardMaterial({
   color:0x101211,
   roughness:1
  });

 const road1=
  new THREE.Mesh(
   new THREE.PlaneGeometry(17,220),
   roadMat
  );

 road1.rotation.x=-Math.PI/2;
 road1.position.y=.01;

 scene.add(road1);

 const road2=
  new THREE.Mesh(
   new THREE.PlaneGeometry(220,17),
   roadMat
  );

 road2.rotation.x=-Math.PI/2;
 road2.position.y=.012;

 scene.add(road2);


 /* PRÉDIOS */

 for(let i=0;i<32;i++){

  let w=5+Math.random()*7;
  let d=5+Math.random()*7;
  let h=4+Math.random()*8;

  let x=(Math.random()-.5)*125;
  let z=(Math.random()-.5)*125;

  if(
   Math.abs(x)<14 ||
   Math.abs(z)<14
  ){
   i--;
   continue;
  }

  let building=
   new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
     color:0x303634,
     roughness:.9
    })
   );

  building.position.set(
   x,
   h/2,
   z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);
  buildings.push(building);


  /* JANELAS */

  const windowMat=
   new THREE.MeshBasicMaterial({
    color:0xd3a65c
   });

  const darkWindowMat=
   new THREE.MeshBasicMaterial({
    color:0x101820
   });

  for(let yy=1.3;yy<h-.5;yy+=1.6){

   for(let xx=-w*.25;xx<=w*.25;xx+=1.1){

    let win=
     new THREE.Mesh(
      new THREE.BoxGeometry(
       .55,
       .55,
       .035
      ),
      Math.random()>.38
       ?windowMat
       :darkWindowMat
     );

    win.position.set(
     x+xx,
     yy,
     z-d/2-.025
    );

    scene.add(win);

   }

  }

 }

}


/* =========================
   ARMA VISUAL
========================= */

function createWeapon(){

 if(!camera)return;

 let old=
  camera.getObjectByName("WEAPON");

 if(old){
  camera.remove(old);
 }

 const group=
  new THREE.Group();

 group.name="WEAPON";


 /* CORPO */

 let body=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .25,
    .25,
    gunIndex===2?.9: .75
   ),
   new THREE.MeshStandardMaterial({
    color:gun.color,
    metalness:.8,
    roughness:.25
   })
  );

 body.position.set(
  .38,
  -.27,
  -.72
 );

 group.add(body);


 /* CANO */

 let barrel=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .045,
    .055,
    gunIndex===2?.85:.5,
    10
   ),
   new THREE.MeshStandardMaterial({
    color:0x050505,
    metalness:.9,
    roughness:.2
   })
  );

 barrel.rotation.x=Math.PI/2;

 barrel.position.set(
  .38,
  -.27,
  gunIndex===2?-1.28:-1.08
 );

 group.add(barrel);


 /* MIRA DO SNIPER */

 if(gunIndex===2){

  let scope=
   new THREE.Mesh(
    new THREE.CylinderGeometry(
     .07,.07,.4,12
    ),
    new THREE.MeshStandardMaterial({
     color:0x111111,
     metalness:.8
    })
   );

  scope.rotation.x=Math.PI/2;

  scope.position.set(
   .38,
   -.12,
   -.76
  );

  group.add(scope);

 }


 /* EMPUNHADURA */

 let grip=
  new THREE.Mesh(
   new THREE.BoxGeometry(
    .14,.36,.2
   ),
   new THREE.MeshStandardMaterial({
    color:0x151515
   })
  );

 grip.position.set(
  .38,
  -.49,
  -.55
 );

 grip.rotation.x=-.18;

 group.add(grip);

 camera.add(group);
 scene.add(camera);

}


/* =========================
   ZUMBI
========================= */

function spawnZombie(){

 let z=new THREE.Group();

 let skin=[
  0x4e5a51,
  0x596259,
  0x414b45,
  0x68645a
 ][
  Math.floor(Math.random()*4)
 ];

 const mat=
  new THREE.MeshStandardMaterial({
   color:skin,
   roughness:1
  });


 /* CORPO MAIS FINO */

 let body=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .30,
    .9,
    6,
    10
   ),
   mat
  );

 body.position.y=.82;
 body.castShadow=true;

 z.add(body);


 /* CABEÇA */

 let head=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .34,
    14,
    10
   ),
   mat
  );

 head.position.y=1.62;
 head.castShadow=true;

 z.add(head);


 /* OLHOS */

 let eyeMat=
  new THREE.MeshBasicMaterial({
   color:0xff2525
  });

 for(let x of[-.11,.11]){

  let eye=
   new THREE.Mesh(
    new THREE.SphereGeometry(
     .045,7,7
    ),
    eyeMat
   );

  eye.position.set(
   x,
   1.64,
   -.31
  );

  z.add(eye);

 }


 /* BRAÇOS */

 for(let x of[-.38,.38]){

  let arm=
   new THREE.Mesh(
    new THREE.CapsuleGeometry(
     .08,.55,5,7
    ),
    mat
   );

  arm.position.set(
   x,
   .92,
   -.02
  );

  arm.rotation.z=
   x>0?-.18:.18;

  arm.castShadow=true;

  z.add(arm);

 }


 /* PERNAS */

 for(let x of[-.14,.14]){

  let leg=
   new THREE.Mesh(
    new THREE.CapsuleGeometry(
     .09,.48,5,7
    ),
    mat
   );

  leg.position.set(
   x,
   .35,
   0
  );

  z.add(leg);

 }


 /* POSIÇÃO */

 let angle=
  Math.random()*Math.PI*2;

 let distance=
  28+Math.random()*55;

 z.position.set(
  camera.position.x+
   Math.cos(angle)*distance,
  0,
  camera.position.z+
   Math.sin(angle)*distance
 );

 z.userData={
  hp:4+Math.floor(wave*.7),
  speed:
   1.0+
   Math.random()*.7+
   wave*.05,
  attack:0,
  phase:Math.random()*10
 };

 scene.add(z);

 zombies.push(z);

}


/* =========================
   SANGUE
========================= */

function blood(pos){

 for(let i=0;i<7;i++){

  let p=
   new THREE.Mesh(
    new THREE.SphereGeometry(
     .025+Math.random()*.035,
     4,
     4
    ),
    new THREE.MeshBasicMaterial({
     color:0x9e1118
    })
   );

  p.position.copy(pos);

  p.userData={
   life:.3+Math.random()*.4,
   vx:(Math.random()-.5)*3,
   vy:.5+Math.random()*2.5,
   vz:(Math.random()-.5)*3
  };

  scene.add(p);
  particles.push(p);

 }

}


/* =========================
   TIRO
========================= */

function shoot(){

 if(!camera ||
  !gameRunning ||
  reloadBusy)return;

 let now=performance.now();

 if(now-lastShot<gun.delay)return;

 lastShot=now;

 if(gun.ammo<=0){

  reload();
  return;

 }

 gun.ammo--;

 shootSound();


 /* RECUO */

 camera.rotation.x+=gun.recoil;

 setTimeout(()=>{

  if(camera){

   camera.rotation.x-=gun.recoil;

  }

 },70);


 /* RAYCAST */

 const ray=
  new THREE.Raycaster();

 ray.setFromCamera(
  new THREE.Vector2(0,0),
  camera
 );

 let targets=[];

 for(let z of zombies){

  z.traverse(obj=>{

   if(obj.isMesh){
    targets.push(obj);
   }

  });

 }

 let hits=
  ray.intersectObjects(
   targets,
   false
  );

 if(hits.length){

  let obj=hits[0].object;

  let root=obj;

  while(
   root.parent &&
   !zombies.includes(root)
  ){
   root=root.parent;
  }

  if(zombies.includes(root)){

   blood(hits[0].point);

   root.userData.hp-=gun.damage;

   if(root.userData.hp<=0){

    zombieDeathSound();

    blood(
     root.position.clone().add(
      new THREE.Vector3(0,1,0)
     )
    );

    scene.remove(root);

    zombies=
     zombies.filter(
      x=>x!==root
     );

    score++;

    if(score%8===0){
     wave++;
    }

   }

  }

 }

 updateHUD();

}


/* =========================
   RECARREGAR
========================= */

function reload(){

 if(
  reloadBusy ||
  gun.ammo>=gun.mag ||
  gun.reserve<=0
 )return;

 reloadBusy=true;

 reloadSound();

 updateHUD();

 setTimeout(()=>{

  let need=
   gun.mag-gun.ammo;

  let take=
   Math.min(
    need,
    gun.reserve
   );

  gun.ammo+=take;
  gun.reserve-=take;

  reloadBusy=false;

  updateHUD();

 },900);

}


/* =========================
   TROCAR ARMA
========================= */

function changeWeapon(){

 if(reloadBusy)return;

 gunIndex++;

 if(gunIndex>=guns.length){
  gunIndex=0;
 }

 gun=guns[gunIndex];

 createWeapon();

 updateHUD();

 showMessage(gun.name);

}


/* =========================
   PULO
========================= */

function jump(){

 if(!gameRunning)return;

 if(onGround){

  verticalVelocity=7;
  onGround=false;

  jumpSound();

 }

}


/* =========================
   HUD
========================= */

function updateHUD(){

 document.getElementById("hp")
  .textContent=
  Math.max(
   0,
   Math.floor(hp)
  );

 document.getElementById("health")
  .style.width=
  Math.max(0,hp)+"%";

 document.getElementById("ammo")
  .textContent=
  reloadBusy
   ?"RECARREGANDO..."
   :gun.ammo+
    " / "+
    gun.reserve;

 document.getElementById("weapon")
  .textContent=gun.name;

 document.getElementById("score")
  .textContent=
  "Abates: "+score;

 document.getElementById("wave")
  .textContent=
  "Onda: "+wave;

}


/* =========================
   MENSAGEM
========================= */

let messageTimer;

function showMessage(text){

 let m=
  document.getElementById(
   "message"
  );

 m.textContent=text;
 m.style.opacity=1;

 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  m.style.opacity=0;
 },900);

}


/* =========================
   ATUALIZAÇÃO
========================= */

function update(dt){

 if(!camera)return;


 /* MOVIMENTO CORRETO */

 let forwardX=
  -Math.sin(yaw);

 let forwardZ=
  -Math.cos(yaw);

 let rightX=
  Math.cos(yaw);

 let rightZ=
  -Math.sin(yaw);

 let moveAmount=
  Math.hypot(moveX,moveY);

 if(moveAmount>0){

  let mx=
   moveX*rightX+
   (-moveY)*forwardX;

  let mz=
   moveX*rightZ+
   (-moveY)*forwardZ;

  let length=
   Math.hypot(mx,mz);

  if(length>0){

   mx/=length;
   mz/=length;

   camera.position.x+=
    mx*
    playerSpeed*
    Math.min(moveAmount,1)*
    dt;

   camera.position.z+=
    mz*
    playerSpeed*
    Math.min(moveAmount,1)*
    dt;

  }

 }


 /* PULO */

 if(!onGround){

  verticalVelocity-=18*dt;

  camera.position.y+=
   verticalVelocity*dt;

  if(camera.position.y<=1.7){

   camera.position.y=1.7;
   verticalVelocity=0;
   onGround=true;

  }

 }


 /* ZUMBIS */

 for(let i=zombies.length-1;i>=0;i--){

  let z=zombies[i];

  let dx=
   camera.position.x-
   z.position.x;

  let dz=
   camera.position.z-
   z.position.z;

  let dist=
   Math.hypot(dx,dz);

  if(dist>1.45){

   z.position.x+=
    dx/dist*
    z.userData.speed*
    dt;

   z.position.z+=
    dz/dist*
    z.userData.speed*
    dt;

  }else{

   z.userData.attack-=dt;

   if(z.userData.attack<=0){

    hp-=6;

    z.userData.attack=.8;

    let d=
     document.getElementById(
      "damage"
     );

    d.style.opacity=1;

    setTimeout(()=>{
     d.style.opacity=0;
    },100);

    if(hp<=0){

     hp=0;
     gameOver();

    }

   }

  }


  /* ANIMAÇÃO SIMPLES */

  z.userData.phase+=dt*6;

  let bob=
   Math.sin(z.userData.phase)*.025;

  z.position.y=bob;


  z.lookAt(
   camera.position.x,
   z.position.y,
   camera.position.z
  );

 }


 /* MANTER ZUMBIS */

 let wanted=
  Math.min(
   4+wave*2,
   14
  );

 while(
  zombies.length<wanted
 ){
  spawnZombie();
 }


 /* PARTÍCULAS */

 for(
  let i=particles.length-1;
  i>=0;
  i--
 ){

  let p=particles[i];

  p.userData.life-=dt;

  p.position.x+=
   p.userData.vx*dt;

  p.position.y+=
   p.userData.vy*dt;

  p.position.z+=
   p.userData.vz*dt;

  p.userData.vy-=7*dt;

  if(p.userData.life<=0){

   scene.remove(p);
   particles.splice(i,1);

  }

 }


 updateMap();
 updateHUD();

}


/* =========================
   MAPA
========================= */

function updateMap(){

 let canvas=
  document.getElementById("map");

 let ctx=
  canvas.getContext("2d");

 ctx.clearRect(
  0,0,250,250
 );

 ctx.fillStyle="#07100d";

 ctx.fillRect(
  0,0,250,250
 );


 /* ruas */

 ctx.fillStyle="#202522";

 ctx.fillRect(
  115,0,20,250
 );

 ctx.fillRect(
  0,115,250,20
 );


 /* prédios */

 ctx.fillStyle="#3d4641";

 for(let b of buildings){

  let x=
   125+
   (b.position.x-
    camera.position.x)*.7;

  let y=
   125+
   (b.position.z-
    camera.position.z)*.7;

  if(
   x>-5&&x<255&&
   y>-5&&y<255
  ){

   ctx.fillRect(
    x-4,
    y-4,
    8,
    8
   );

  }

 }


 /* zumbis */

 ctx.fillStyle="#e02e39";

 for(let z of zombies){

  let x=
   125+
   (z.position.x-
    camera.position.x)*.7;

  let y=
   125+
   (z.position.z-
    camera.position.z)*.7;

  if(
   x>0&&x<250&&
   y>0&&y<250
  ){

   ctx.fillRect(
    x-2,
    y-2,
    4,
    4
   );

  }

 }


 /* jogador */

 ctx.fillStyle="#55a8ff";

 ctx.beginPath();

 ctx.arc(
  125,
  125,
  5,
  0,
  Math.PI*2
 );

 ctx.fill();


 /* direção */

 ctx.strokeStyle="#55a8ff";
 ctx.lineWidth=2;

 ctx.beginPath();

 ctx.moveTo(
  125,
  125
 );

 ctx.lineTo(
  125-
   Math.sin(yaw)*14,
  125-
   Math.cos(yaw)*14
 );

 ctx.stroke();

}

   GAME OVER
========================= */

 gameRunning=false;

 document.getElementById("menu")

/* =========================
   JOYSTICK
========================= */

const joy=
 document.getElementById("joy");

const stick=
 document.getElementById("stick");

let joyActive=false;
let joyPointer=null;

joy.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  joyActive=true;
  joyPointer=e.pointerId;

  joy.setPointerCapture(
   e.pointerId
  );

  moveJoystick(e);

 }
);

joy.addEventListener(
 "pointermove",
 e=>{

  if(
   joyActive &&
   e.pointerId===joyPointer
  ){
   moveJoystick(e);
  }

 }
);

function moveJoystick(e){

 let r=
  joy.getBoundingClientRect();

 let x=
  e.clientX-
  (r.left+r.width/2);

 let y=
  e.clientY-
  (r.top+r.height/2);

 let limit=44;

 let d=Math.hypot(x,y);

 if(d>limit){

  x=x/d*limit;
  y=y/d*limit;

 }

 moveX=x/limit;
 moveY=y/limit;

 stick.style.transform=
  `translate(
   calc(-50% + ${x}px),
   calc(-50% + ${y}px)
  )`;

}

function stopJoystick(){

 joyActive=false;
 joyPointer=null;

 moveX=0;
 moveY=0;

 stick.style.transform=
  "translate(-50%,-50%)";

}

joy.addEventListener(
 "pointerup",
 stopJoystick
);

joy.addEventListener(
 "pointercancel",
 stopJoystick
);


/* =========================
   CÂMERA CELULAR
========================= */

document.addEventListener(
 "pointerdown",
 e=>{

  if(!camera||!gameRunning)return;

  /* lado direito = câmera */

  if(
   e.clientX<
   innerWidth*.45
  )return;

  /* não olhar nos botões */

  if(
   e.clientX>
    innerWidth-330 &&
   e.clientY>
    innerHeight-190
  )return;

  lookActive=true;

  lastLookX=e.clientX;
  lastLookY=e.clientY;

 }
);

document.addEventListener(
 "pointermove",
 e=>{

  if(
   !lookActive||
   !camera||
   !gameRunning
  )return;

  let dx=
   e.clientX-lastLookX;

  let dy=
   e.clientY-lastLookY;

  lastLookX=e.clientX;
  lastLookY=e.clientY;

  yaw-=
   dx*
   .003*
   cameraSensitivity;

  pitch-=
   dy*
   .0023*
   cameraSensitivity;

  pitch=
   Math.max(
    -1.05,
    Math.min(
     1.05,
     pitch
    )
   );

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

 }
);

document.addEventListener(
 "pointerup",
 ()=>{
  lookActive=false;
 }
);

document.addEventListener(
 "pointercancel",
 ()=>{
  lookActive=false;
 }
);

   CONFIGURAÇÕES
========================= */

const settings=
 document.getElementById(
  "settings"
 );

document.getElementById(
 "settingsBtn"
).onclick=()=>{

 settings.style.display=
  "flex";

};

document.getElementById(
 "closeSettings"
).onclick=()=>{

 settings.style.display=
  "none";

};

document.getElementById(
 "sens"
).oninput=e=>{

 cameraSensitivity=
  Number(e.target.value);

};

document.getElementById(
 "speedControl"
).oninput=e=>{

 playerSpeed=
  Number(e.target.value);

};

document.getElementById(
 "buttonSize"
).oninput=e=>{

 let s=
  Number(e.target.value);

 document.querySelectorAll(
  ".action"
 ).forEach(b=>{

  b.style.transform=
   `scale(${s})`;

 });

};


/* =========================
   RESIZE
========================= */

addEventListener(
 "resize",
 ()=>{

  if(!camera||!renderer)return;

  camera.aspect=
   innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );

 }
);


/* =========================
   LOOP
========================= */

function loop(){

 if(!gameRunning)return;

 requestAnimationFrame(loop);

 let dt=
  Math.min(
   clock.getDelta(),
   .04
  );

 update(dt);

 renderer.render(
  scene,
  camera
 );

}

</script>
