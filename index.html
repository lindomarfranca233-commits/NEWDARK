<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEW PONG 3D</title>

<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020508;font-family:Arial}
canvas{display:block;width:100%;height:100%;touch-action:none}

#menu,#gameover{
position:fixed;
inset:0;
z-index:20;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
text-align:center;
background:radial-gradient(circle,#12384b,#03070a 70%);
}

#menu h1{
font-size:55px;
letter-spacing:7px;
color:#18d9ff;
text-shadow:0 0 25px #008cff;
margin:0 0 10px;
}

button{
border:2px solid #19d9ff;
background:#092b3c;
color:white;
border-radius:14px;
padding:15px 35px;
font-size:18px;
font-weight:bold;
}

#score{
position:fixed;
z-index:10;
top:12px;
left:50%;
transform:translateX(-50%);
font-size:38px;
font-weight:bold;
color:white;
text-shadow:0 3px 10px #000;
}

#info{
position:fixed;
z-index:10;
top:58px;
left:50%;
transform:translateX(-50%);
color:#bcd9e5;
}

#touch{
position:fixed;
z-index:10;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:320px;
height:80px;
border:2px solid #ffffff35;
border-radius:18px;
background:#ffffff08;
color:#ffffff66;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

#message{
position:fixed;
z-index:10;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:20px;
font-weight:bold;
text-shadow:0 3px 10px black;
}

#gameover{display:none}

#gameover h1{
color:#19d9ff;
text-shadow:0 0 20px #008cff;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<h1>NEW PONG</h1>
<p>🏓 PING PONG 3D</p>
<button id="start">JOGAR</button>
</div>

<div id="score">0 — 0</div>
<div id="info">PING PONG</div>
<div id="message"></div>
<div id="touch">ARRASTE PARA MOVER A RAQUETE</div>

<div id="gameover">
<h1 id="result">FIM</h1>
<p id="finalScore"></p>
<button onclick="location.reload()">JOGAR NOVAMENTE</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let playing=false;
let gameFinished=false;

function resize(){
W=innerWidth;
H=innerHeight;
canvas.width=W;
canvas.height=H;
}

addEventListener("resize",resize);
resize();

/* =========================
   PLACAR
========================= */

let playerScore=0;
let cpuScore=0;

const score=document.getElementById("score");
const info=document.getElementById("info");
const message=document.getElementById("message");
const menu=document.getElementById("menu");
const gameover=document.getElementById("gameover");
const result=document.getElementById("result");
const finalScore=document.getElementById("finalScore");
const touch=document.getElementById("touch");

/* =========================
   OBJETOS
========================= */

const player={
x:0,
target:0,
z:7
};

const cpu={
x:0,
z:-7
};

const ball={
x:0,
y:2.2,
z:0,
vx:0.055,
vy:0.075,
vz:0.12,
r:.22
};

let waiting=true;

/* =========================
   SOM
========================= */

let audio=null;

function initSound(){

try{

if(!audio){
audio=new(window.AudioContext||window.webkitAudioContext)();
}

if(audio.state==="suspended"){
audio.resume();
}

}catch(e){}

}

function beep(freq,duration=.07){

if(!audio)return;

const osc=audio.createOscillator();
const gain=audio.createGain();

osc.type="square";
osc.frequency.value=freq;

gain.gain.setValueAtTime(.06,audio.currentTime);

gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+duration
);

osc.connect(gain);
gain.connect(audio.destination);

osc.start();
osc.stop(audio.currentTime+duration);
}

/* =========================
   CÂMERA / PROJEÇÃO
========================= */

const camera={
x:0,
y:10,
z:19
};

function project(x,y,z){

const depth=z-camera.z+30;

if(depth<1)return null;

const scale=700/depth;

return{
x:W/2+(x-camera.x)*scale,
y:H*.48-(y-camera.y)*scale,
s:scale
};

}

/* =========================
   FUNDO
========================= */

function drawBackground(){

const gradient=ctx.createLinearGradient(0,0,0,H);

gradient.addColorStop(0,"#030a11");
gradient.addColorStop(.5,"#0b3043");
gradient.addColorStop(1,"#010305");

ctx.fillStyle=gradient;
ctx.fillRect(0,0,W,H);

/* chão */

ctx.fillStyle="#05090c";
ctx.fillRect(0,H*.62,W,H*.38);

/* luzes */

for(let i=0;i<9;i++){

const x=W*(i+1)/10;

ctx.beginPath();
ctx.arc(x,H*.14,22,0,Math.PI*2);
ctx.fillStyle="#ffffff18";
ctx.fill();

}

/* linhas do piso */

ctx.strokeStyle="#ffffff12";
ctx.lineWidth=1;

for(let i=-10;i<=10;i++){

const a=project(i,0,10);
const b=project(i*2,0,-20);

if(a&&b){

ctx.beginPath();
ctx.moveTo(a.x,a.y);
ctx.lineTo(b.x,b.y);
ctx.stroke();

}

}

}

/* =========================
   MESA
========================= */

function drawTable(){

const a=project(-5,1.3,9);
const b=project(5,1.3,9);
const c=project(5,1.3,-9);
const d=project(-5,1.3,-9);

if(!a||!b||!c||!d)return;

ctx.beginPath();
ctx.moveTo(a.x,a.y);
ctx.lineTo(b.x,b.y);
ctx.lineTo(c.x,c.y);
ctx.lineTo(d.x,d.y);
ctx.closePath();

ctx.fillStyle="#087b48";
ctx.fill();

ctx.strokeStyle="#fff";
ctx.lineWidth=3;
ctx.stroke();

/* linha central */

const c1=project(0,1.32,9);
const c2=project(0,1.32,-9);

ctx.beginPath();
ctx.moveTo(c1.x,c1.y);
ctx.lineTo(c2.x,c2.y);
ctx.strokeStyle="#fff";
ctx.lineWidth=2;
ctx.stroke();

/* bordas */

ctx.strokeStyle="#dfffff";
ctx.lineWidth=2;

for(const x of [-4.5,4.5]){

const p1=project(x,1.33,9);
const p2=project(x,1.33,-9);

ctx.beginPath();
ctx.moveTo(p1.x,p1.y);
ctx.lineTo(p2.x,p2.y);
ctx.stroke();

}

/* pernas */

for(const x of [-4,4]){

for(const z of [-5,5]){

const top=project(x,1.3,z);
const bottom=project(x,0,z);

if(top&&bottom){

ctx.beginPath();
ctx.moveTo(top.x,top.y);
ctx.lineTo(bottom.x,bottom.y);

ctx.strokeStyle="#252b30";
ctx.lineWidth=10;
ctx.stroke();

}

}

}

drawNet();

}

/* =========================
   REDE
========================= */

function drawNet(){

const topLeft=project(-5,2.1,0);
const topRight=project(5,2.1,0);
const bottomRight=project(5,1.3,0);
const bottomLeft=project(-5,1.3,0);

if(!topLeft)return;

ctx.beginPath();

ctx.moveTo(topLeft.x,topLeft.y);
ctx.lineTo(topRight.x,topRight.y);
ctx.lineTo(bottomRight.x,bottomRight.y);
ctx.lineTo(bottomLeft.x,bottomLeft.y);

ctx.closePath();

ctx.fillStyle="#d9eeee55";
ctx.fill();

ctx.strokeStyle="#fff";
ctx.lineWidth=2;
ctx.stroke();

/* malha */

ctx.strokeStyle="#ffffff55";
ctx.lineWidth=1;

for(let x=-5;x<=5;x+=.5){

const a=project(x,1.3,0);
const b=project(x,2.1,0);

ctx.beginPath();
ctx.moveTo(a.x,a.y);
ctx.lineTo(b.x,b.y);
ctx.stroke();

}

}

/* =========================
   RAQUETES
========================= */

function drawPaddle(x,z,type){

const p=project(x,1.8,z);

if(!p)return;

const width=1.65*p.s;
const height=.9*p.s;

ctx.fillStyle=
type==="player"
?"#168fff"
:"#e63243";

ctx.strokeStyle="#fff";
ctx.lineWidth=3;

ctx.beginPath();

ctx.roundRect(
p.x-width/2,
p.y-height/2,
width,
height,
12
);

ctx.fill();
ctx.stroke();

/* detalhe */

ctx.strokeStyle="#ffffff77";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(
p.x-width*.32,
p.y
);

ctx.lineTo(
p.x+width*.32,
p.y
);

ctx.stroke();

/* cabo */

ctx.fillStyle="#70482d";

ctx.fillRect(
p.x-5,
p.y+height/2,
10,
height*.7
);

}

/* =========================
   BOLA
========================= */

function drawBall(){

const p=project(
ball.x,
ball.y,
ball.z
);

if(!p)return;

const radius=Math.max(
4,
ball.r*p.s
);

ctx.beginPath();

ctx.arc(
p.x,
p.y,
radius,
0,
Math.PI*2
);

ctx.fillStyle="#fff";
ctx.fill();

ctx.beginPath();

ctx.arc(
p.x-radius*.3,
p.y-radius*.3,
radius*.22,
0,
Math.PI*2
);

ctx.fillStyle="#ffffffaa";
ctx.fill();

}

/* =========================
   FÍSICA
========================= */

function update(){

if(!playing||gameFinished)return;

if(waiting)return;

/* jogador */

player.x+=
(player.target-player.x)*.28;

/* computador */

cpu.x+=
(ball.x-cpu.x)*.045;

cpu.x=Math.max(
-4.2,
Math.min(4.2,cpu.x)
);

/* bola */

ball.x+=ball.vx;
ball.y+=ball.vy;
ball.z+=ball.vz;

ball.vy-=.024;

/* quique */

if(ball.y<1.42){

ball.y=1.42;

ball.vy=
Math.abs(ball.vy)*.84;

beep(220,.04);

}

/* paredes */

if(ball.x>4.8){

ball.x=4.8;
ball.vx=-Math.abs(ball.vx);
beep(170);

}

if(ball.x<-4.8){

ball.x=-4.8;
ball.vx=Math.abs(ball.vx);
beep(170);

}

/* raquete jogador */

if(
ball.z>6.2&&
ball.z<7.8&&
ball.vz>0&&
Math.abs(ball.x-player.x)<1.35&&
ball.y<3.5
){

ball.z=6.15;

ball.vz=-Math.abs(ball.vz)*1.035;

ball.vx+=
(ball.x-player.x)*.025;

ball.vy=.075;

beep(330);

}

/* raquete CPU */

if(
ball.z<-6.2&&
ball.z>-7.8&&
ball.vz<0&&
Math.abs(ball.x-cpu.x)<1.35&&
ball.y<3.5
){

ball.z=-6.15;

ball.vz=
Math.abs(ball.vz)*1.035;

ball.vx+=
(ball.x-cpu.x)*.025;

ball.vy=.075;

beep(260);

}

/* limite da bola */

if(ball.z>10){

cpuScore++;

updateScore();

beep(100,.15);

if(cpuScore>=11){
endGame(false);
}else{
serve();
}

}

if(ball.z<-10){

playerScore++;

updateScore();

beep(500,.15);

if(playerScore>=11){
endGame(true);
}else{
serve();
}

}

}

/* =========================
   SAQUE
========================= */

function serve(){

waiting=true;

ball.x=0;
ball.y=2.2;
ball.z=0;

ball.vx=0;
ball.vy=0;
ball.vz=0;

player.x=0;
player.target=0;
cpu.x=0;

message.textContent=
"TOQUE PARA SACAR";

info.textContent=
"NOVO SAQUE";

}

/* =========================
   LANÇAR BOLA
========================= */

function launch(){

if(!waiting)return;

waiting=false;

message.textContent="";
info.textContent="JOGANDO";

ball.x=0;
ball.y=2.2;
ball.z=0;

ball.vx=
(Math.random()-.5)*.06;

ball.vy=.075;

ball.vz=
Math.random()>.5
?.12
:-.12;

beep(400);

}

/* =========================
   PLACAR
========================= */

function updateScore(){

score.textContent=
playerScore+
" — "+
cpuScore;

}

/* =========================
   CONTROLE TOUCH
========================= */

let dragging=false;

touch.addEventListener(
"pointerdown",
e=>{

dragging=true;

touch.setPointerCapture(
e.pointerId
);

initSound();

if(waiting)launch();

movePlayer(e);

}
);

touch.addEventListener(
"pointermove",
e=>{

if(dragging)
movePlayer(e);

}
);

touch.addEventListener(
"pointerup",
()=>{
dragging=false;
}
);

function movePlayer(e){

const rect=
touch.getBoundingClientRect();

let n=
(e.clientX-rect.left)/
rect.width;

player.target=
(n-.5)*8;

player.target=
Math.max(
-4.25,
Math.min(4.25,player.target)
);

}

/* =========================
   MOUSE / PC
========================= */

canvas.addEventListener(
"pointermove",
e=>{

if(e.pointerType==="mouse"){

player.target=
((e.clientX/W)-.5)*8;

player.target=
Math.max(
-4.25,
Math.min(4.25,player.target)
);

}

}
);

/* =========================
   TECLADO
========================= */

addEventListener(
"keydown",
e=>{

if(e.key==="ArrowLeft")
player.target-=.5;

if(e.key==="ArrowRight")
player.target+=.5;

player.target=
Math.max(
-4.25,
Math.min(4.25,player.target)
);

if(e.code==="Space"){
initSound();
launch();
}

}
);

/* =========================
   FINAL
========================= */

function endGame(playerWon){

gameFinished=true;

result.textContent=
playerWon
?"VOCÊ VENCEU!"
:"COMPUTADOR VENCEU!";

finalScore.textContent=
"Placar final: "+
playerScore+
" — "+
cpuScore;

gameover.style.display="flex";

}

/* =========================
   BOTÃO JOGAR
========================= */

document.getElementById("start")
.addEventListener(
"click",
()=>{

initSound();

menu.style.display="none";

playing=true;

updateScore();

serve();

}
);

/* =========================
   LOOP
========================= */

function loop(){

requestAnimationFrame(loop);

drawBackground();

update();

drawTable();

drawPaddle(
player.x,
player.z,
"player"
);

drawPaddle(
cpu.x,
cpu.z,
"cpu"
);

drawBall();

}

loop();

</script>

</body>
</html>
