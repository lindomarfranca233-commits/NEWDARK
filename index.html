<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEW DARK 1.3</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#72b8ee;
  font-family:Arial,sans-serif;
  user-select:none;
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#menu,#gameover{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
  background:linear-gradient(#5faee7,#14283d);
}

#menu h1{
  font-size:48px;
  letter-spacing:6px;
  margin:0;
  text-shadow:3px 3px 8px #000;
}

button{
  border:2px solid white;
  border-radius:12px;
  background:#17486b;
  color:white;
  padding:14px 20px;
  font-weight:bold;
  font-size:15px;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  z-index:30;
  color:white;
  font-weight:bold;
  text-shadow:2px 2px 4px #000;
}

#bar{
  width:170px;
  height:17px;
  border:2px solid white;
  background:#333;
}

#hp{
  width:100%;
  height:100%;
  background:#21d65a;
}

#weapon{
  position:fixed;
  right:12px;
  top:10px;
  z-index:30;
  color:white;
  font-weight:bold;
  text-shadow:2px 2px 4px #000;
}

#cross{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  color:white;
  font-size:28px;
  text-shadow:0 0 5px #000;
}

#damage{
  position:fixed;
  inset:0;
  z-index:25;
  pointer-events:none;
  background:#d00000;
  opacity:0;
}

#joy{
  position:fixed;
  left:18px;
  bottom:18px;
  width:125px;
  height:125px;
  border:3px solid #ffffff55;
  border-radius:50%;
  background:#ffffff12;
  z-index:40;
}

#knob{
  position:absolute;
  left:35px;
  top:35px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ffffff88;
}

.action{
  position:fixed;
  z-index:40;
  width:70px;
  height:70px;
  border-radius:50%;
  padding:0;
}

#fire{
  right:18px;
  bottom:18px;
  width:92px;
  height:92px;
  background:#941b1b;
}

#switch{
  right:125px;
  bottom:105px;
  background:#23577b;
}

#run{
  right:125px;
  bottom:25px;
  background:#226b3c;
}

#gameover{
  display:none;
}
</style>
</head>

<body>

<div id="menu">
  <h1>NEW DARK</h1>
  <p>VERSÃO 1.3</p>
  <p>DAYLIGHT SURVIVAL</p>
  <button id="start">JOGAR</button>
</div>

<div id="hud">
  VIDA
  <div id="bar"><div id="hp"></div></div>
  🧟 <span id="kills">0</span>
</div>

<div id="weapon">PISTOLA</div>
<div id="cross">+</div>
<div id="damage"></div>

<div id="joy">
  <div id="knob"></div>
</div>

<button id="fire" class="action">🔫<br>ATIRAR</button>
<button id="switch" class="action">🔄</button>
<button id="run" class="action">🏃<br>CORRER</button>

<div id="gameover">
  <h1>VOCÊ MORREU</h1>
  <p>Zumbis eliminados: <span id="finalKills">0</span></p>
  <button onclick="location.reload()">JOGAR NOVAMENTE</button>
</div>

<script>

/* =========================================================
   NEW DARK 1.3
   CANVAS 2D
   SEM THREE.JS
   SEM ARQUIVOS EXTERNOS
========================================================= */

const canvas=document.querySelector("canvas") ||
document.createElement("canvas");

if(!canvas.parentNode)
document.body.appendChild(canvas);

const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
}

resize();
addEventListener("resize",resize);


/* =========================================================
   MUNDO
========================================================= */

const world={
  size:1800
};

const player={
  x:0,
  z:0,
  angle:0,
  health:100
};


/* =========================================================
   ARMAS
========================================================= */

const weapons=[
  {
    name:"PISTOLA",
    damage:2,
    delay:280,
    color:"#777",
    recoil:8,
    sound:520
  },
  {
    name:"AK-47",
    damage:3,
    delay:150,
    color:"#60452e",
    recoil:12,
    sound:350
  },
  {
    name:"UMP",
    damage:2,
    delay:110,
    color:"#343b40",
    recoil:10,
    sound:430
  },
  {
    name:"SCAR",
    damage:4,
    delay:190,
    color:"#242b2f",
    recoil:14,
    sound:390
  },
  {
    name:"SNIPER",
    damage:8,
    delay:650,
    color:"#59636a",
    recoil:22,
    sound:230
  }
];

let weaponIndex=0;
let lastShot=0;
let recoil=0;


/* =========================================================
   ÁUDIO
========================================================= */

let audio=null;

function initAudio(){
  if(!audio)
    audio=new AudioContext();

  if(audio.state==="suspended")
    audio.resume();
}

function beep(freq,time,type="square",volume=.07){

  if(!audio)return;

  const o=audio.createOscillator();
  const g=audio.createGain();

  o.type=type;
  o.frequency.value=freq;

  g.gain.setValueAtTime(volume,audio.currentTime);

  g.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime+time
  );

  o.connect(g);
  g.connect(audio.destination);

  o.start();
  o.stop(audio.currentTime+time);
}

function gunSound(){

  const w=weapons[weaponIndex];

  beep(w.sound,.07,"sawtooth",.13);

  setTimeout(()=>{
    beep(w.sound*.45,.06,"square",.08);
  },25);
}

function zombieSound(){
  beep(
    70+Math.random()*40,
    .25,
    "sawtooth",
    .09
  );
}


/* =========================================================
   CASAS
========================================================= */

const houses=[
  {x:-280,z:-180,w:150,d:120},
  {x:280,z:-180,w:150,d:120},
  {x:-280,z:180,w:160,d:130},
  {x:280,z:180,w:160,d:130},
  {x:-520,z:-420,w:180,d:140},
  {x:520,z:-420,w:180,d:140},
  {x:-520,z:420,w:180,d:140},
  {x:520,z:420,w:180,d:140}
];


/* =========================================================
   CARROS
========================================================= */

const cars=[
  {x:-70,z:-75,c:"#b52d2d",a:0},
  {x:70,z:-75,c:"#245d9c",a:0},
  {x:-70,z:75,c:"#777",a:Math.PI},
  {x:70,z:75,c:"#c28c2f",a:Math.PI},
  {x:-130,z:-75,c:"#263f55",a:0}
];


/* =========================================================
   ZUMBIS
   ESTRUTURA ÚNICA E PROPORCIONAL
========================================================= */

const zombies=[];

function createZombie(x,z){

  zombies.push({
    x,
    z,
    hp:6,
    speed:.32+Math.random()*.12,
    phase:Math.random()*10,
    attack:0,
    scale:.78+Math.random()*.08
  });
}

for(let i=0;i<28;i++){

  const a=Math.random()*Math.PI*2;
  const d=350+Math.random()*700;

  createZombie(
    Math.cos(a)*d,
    Math.sin(a)*d
  );
}


/* =========================================================
   JOYSTICK
========================================================= */

const joy=document.getElementById("joy");
const knob=document.getElementById("knob");

let joyX=0;
let joyY=0;
let joyActive=false;

function moveJoy(e){

  const r=joy.getBoundingClientRect();

  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);

  const max=40;
  const dist=Math.hypot(dx,dy);

  if(dist>max){
    dx=dx/dist*max;
    dy=dy/dist*max;
  }

  joyX=dx/max;
  joyY=dy/max;

  knob.style.left=(35+dx)+"px";
  knob.style.top=(35+dy)+"px";
}

joy.onpointerdown=e=>{
  joyActive=true;
  joy.setPointerCapture(e.pointerId);
  moveJoy(e);
};

joy.onpointermove=e=>{
  if(joyActive)moveJoy(e);
};

joy.onpointerup=()=>{
  joyActive=false;
  joyX=0;
  joyY=0;
  knob.style.left="35px";
  knob.style.top="35px";
};


/* =========================================================
   CÂMERA / OLHAR
========================================================= */

let look=false;
let lastX=0;

canvas.onpointerdown=e=>{
  if(e.target===canvas){
    look=true;
    lastX=e.clientX;
  }
};

canvas.onpointermove=e=>{

  if(!look)return;

  const dx=e.clientX-lastX;

  lastX=e.clientX;

  player.angle+=dx*.006;
};

canvas.onpointerup=()=>{
  look=false;
};


/* =========================================================
   CORRER
========================================================= */

let running=false;

document.getElementById("run").onclick=()=>{
  running=!running;

  document.getElementById("run").innerHTML=
    running?"🏃<br>CORRENDO":"🏃<br>CORRER";
};


/* =========================================================
   MOVIMENTO
========================================================= */

function updatePlayer(){

  const speed=running?.42:.22;

  const forward=-joyY;
  const side=joyX;

  const fx=Math.cos(player.angle);
  const fz=Math.sin(player.angle);

  const rx=-Math.sin(player.angle);
  const rz=Math.cos(player.angle);

  player.x+=(fx*forward+rx*side)*speed;
  player.z+=(fz*forward+rz*side)*speed;

  player.x=Math.max(
    -world.size,
    Math.min(world.size,player.x)
  );

  player.z=Math.max(
    -world.size,
    Math.min(world.size,player.z)
  );
}


/* =========================================================
   TROCA DE ARMA
========================================================= */

document.getElementById("switch").onclick=()=>{

  weaponIndex++;

  if(weaponIndex>=weapons.length)
    weaponIndex=0;

  document.getElementById("weapon")
    .textContent=weapons[weaponIndex].name;
};


/* =========================================================
   TIRO
========================================================= */

let firing=false;

document.getElementById("fire").onpointerdown=()=>{
  firing=true;
  initAudio();
};

document.getElementById("fire").onpointerup=()=>{
  firing=false;
};

function shoot(){

  const now=performance.now();
  const w=weapons[weaponIndex];

  if(now-lastShot<w.delay)return;

  lastShot=now;

  gunSound();

  recoil=w.recoil;

  /* linha de mira */

  let best=null;
  let bestDist=Infinity;

  for(const z of zombies){

    const dx=z.x-player.x;
    const dz=z.z-player.z;

    const dist=Math.hypot(dx,dz);

    if(dist>800)continue;

    const targetAngle=Math.atan2(dz,dx);

    let diff=targetAngle-player.angle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    if(Math.abs(diff)<.09){

      if(dist<bestDist){
        best=z;
        bestDist=dist;
      }
    }
  }

  if(best){

    best.hp-=w.damage;

    if(best.hp<=0){

      const i=zombies.indexOf(best);

      if(i>=0)
        zombies.splice(i,1);

      kills++;

      document.getElementById("kills")
        .textContent=kills;
    }
  }
}


/* =========================================================
   ZUMBIS
   NUNCA DEITAM
========================================================= */

function updateZombies(){

  for(const z of zombies){

    const dx=player.x-z.x;
    const dz=player.z-z.z;

    const dist=Math.hypot(dx,dz);

    if(dist>55){

      z.x+=(dx/dist)*z.speed;
      z.z+=(dz/dist)*z.speed;

      z.phase+=.15;

    }else{

      z.attack++;

      if(z.attack%70===0){

        player.health-=6;

        damageEffect();
        zombieSound();

        if(player.health<=0)
          gameOver();
      }
    }
  }
}


/* =========================================================
   EFEITO DE DANO
========================================================= */

function damageEffect(){

  const d=document.getElementById("damage");

  d.style.opacity=.55;

  setTimeout(()=>{
    d.style.opacity=0;
  },130);

  document.getElementById("hp")
    .style.width=Math.max(0,player.health)+"%";
}


/* =========================================================
   DESENHO DO MUNDO
========================================================= */

function project(x,z){

  const dx=x-player.x;
  const dz=z-player.z;

  const ca=Math.cos(-player.angle);
  const sa=Math.sin(-player.angle);

  const px=dx*ca-dz*sa;
  const pz=dx*sa+dz*ca;

  if(pz<=5)return null;

  const f=600/pz;

  return {
    x:W/2+px*f,
    y:H*.53,
    depth:pz,
    scale:f
  };
}


/* =========================================================
   SOL E CÉU
========================================================= */

function drawSky(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#48a5e8");
  g.addColorStop(.55,"#9bd4f5");
  g.addColorStop(1,"#5f8d4d");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* sol */

  ctx.fillStyle="#fff3a3";

  ctx.beginPath();
  ctx.arc(W*.82,H*.18,48,0,Math.PI*2);
  ctx.fill();
}


/* =========================================================
   CHÃO E RUAS
========================================================= */

function drawGround(){

  ctx.fillStyle="#537b48";
  ctx.fillRect(0,H*.5,W,H*.5);

  ctx.fillStyle="#44494a";

  const roadY=H*.63;

  ctx.fillRect(0,roadY,W,100);

  ctx.fillStyle="#c9c39a";

  for(let x=-50;x<W+100;x+=100){

    ctx.fillRect(
      x,
      roadY+48,
      55,
      5
    );
  }
}


/* =========================================================
   CASA
========================================================= */

function drawHouse(h){

  const p=project(h.x,h.z);

  if(!p)return;

  const s=Math.min(p.scale,220);

  const w=h.w/p.depth*600;
  const hh=h.d/p.depth*600;

  if(p.x<-400||p.x>W+400)return;

  /* sombra */

  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.fillRect(
    p.x-w/2+8,
    p.y-hh*.65+8,
    w,
    hh*.65
  );

  /* parede */

  ctx.fillStyle="#a76e4c";

  ctx.fillRect(
    p.x-w/2,
    p.y-hh*.65,
    w,
    hh*.65
  );

  /* tijolos */

  ctx.strokeStyle="#754a36";
  ctx.lineWidth=1;

  for(let yy=0;yy<5;yy++){

    const y=
      p.y-hh*.65+
      yy*(hh*.65/5);

    ctx.beginPath();
    ctx.moveTo(p.x-w/2,y);
    ctx.lineTo(p.x+w/2,y);
    ctx.stroke();
  }

  /* telhado */

  ctx.fillStyle="#40332e";

  ctx.beginPath();
  ctx.moveTo(
    p.x-w*.6,
    p.y-hh*.65
  );

  ctx.lineTo(
    p.x,
    p.y-hh*.95
  );

  ctx.lineTo(
    p.x+w*.6,
    p.y-hh*.65
  );

  ctx.closePath();
  ctx.fill();

  /* porta */

  ctx.fillStyle="#45291b";

  ctx.fillRect(
    p.x-14,
    p.y-hh*.4,
    28,
    hh*.4
  );

  /* janela */

  ctx.fillStyle="#75c9ef";

  ctx.fillRect(
    p.x-w*.3,
    p.y-hh*.48,
    30,
    25
  );

  ctx.fillRect(
    p.x+w*.18,
    p.y-hh*.48,
    30,
    25
  );
}


/* =========================================================
   CARRO
========================================================= */

function drawCar(c){

  const p=project(c.x,c.z);

  if(!p)return;

  const s=Math.max(20,Math.min(100,650/p.depth));

  ctx.save();

  ctx.translate(p.x,p.y);

  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.fillRect(-s*.8,5,s*1.6,12);

  ctx.fillStyle=c.c;

  ctx.fillRect(
    -s,
    -s*.35,
    s*2,
    s*.7
  );

  ctx.fillStyle="#111";

  ctx.fillRect(
    -s*.65,
    -s*.65,
    s*1.3,
    s*.35
  );

  ctx.fillStyle="#75bfe0";

  ctx.fillRect(
    -s*.5,
    -s*.58,
    s,
    s*.25
  );

  /* rodas */

  ctx.fillStyle="#111";

  for(const x of [-.78,.78]){

    ctx.beginPath();

    ctx.arc(
      x*s,
      s*.35,
      s*.22,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}


/* =========================================================
   ZUMBI HUMANO
   CABEÇA + CORPO + BRAÇOS + PERNAS + ROSTO
========================================================= */

function drawZombie(z){

  const p=project(z.x,z.z);

  if(!p)return;

  const s=Math.max(
    12,
    Math.min(105,700/p.depth)
  )*z.scale;

  const walk=Math.sin(z.phase)*s*.12;

  ctx.save();

  ctx.translate(p.x,p.y);

  /* sombra */

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.beginPath();
  ctx.ellipse(
    0,
    4,
    s*.48,
    s*.16,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* pernas */

  ctx.strokeStyle="#252b2f";
  ctx.lineWidth=s*.16;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-s*.18,0);
  ctx.lineTo(-s*.22+walk,s*.72);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(s*.18,0);
  ctx.lineTo(s*.22-walk,s*.72);
  ctx.stroke();

  /* sapatos */

  ctx.lineWidth=s*.18;

  ctx.beginPath();
  ctx.moveTo(-s*.22+walk,s*.72);
  ctx.lineTo(-s*.38+walk,s*.75);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(s*.22-walk,s*.72);
  ctx.lineTo(s*.38-walk,s*.75);
  ctx.stroke();

  /* braços */

  ctx.strokeStyle="#81956f";
  ctx.lineWidth=s*.14;

  const attack=z.attack>0;

  ctx.beginPath();

  ctx.moveTo(-s*.42,-s*.42);

  ctx.lineTo(
    attack?-s*.68:-s*.48,
    attack?-s*.72:-s*.05
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(s*.42,-s*.42);

  ctx.lineTo(
    attack?s*.68:s*.48,
    attack?-s*.72:-s*.05
  );

  ctx.stroke();

  /* mãos */

  ctx.fillStyle="#849b74";

  ctx.beginPath();
  ctx.arc(
    attack?-s*.68:-s*.48,
    attack?-s*.72:-s*.05,
    s*.1,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    attack?s*.68:s*.48,
    attack?-s*.72:-s*.05,
    s*.1,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* torso */

  ctx.fillStyle="#485b4b";

  ctx.beginPath();
  ctx.roundRect(
    -s*.4,
    -s*.78,
    s*.8,
    s*.9,
    s*.12
  );
  ctx.fill();

  /* pescoço */

  ctx.fillStyle="#829574";

  ctx.fillRect(
    -s*.13,
    -s*.98,
    s*.26,
    s*.2
  );

  /* cabeça */

  ctx.fillStyle="#899c7b";

  ctx.beginPath();
  ctx.arc(
    0,
    -s*1.2,
    s*.34,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* orelhas */

  ctx.beginPath();
  ctx.arc(
    -s*.34,
    -s*1.2,
    s*.09,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    s*.34,
    -s*1.2,
    s*.09,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* olhos */

  ctx.fillStyle="#e00000";

  ctx.beginPath();
  ctx.arc(
    -s*.12,
    -s*1.23,
    s*.055,
    0,
    Math.PI*2
  );
  ctx.fill();

  ctx.beginPath();
  ctx.arc(
    s*.12,
    -s*1.23,
    s*.055,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* nariz */

  ctx.fillStyle="#687b65";

  ctx.beginPath();

  ctx.moveTo(0,-s*1.2);
  ctx.lineTo(s*.07,-s*1.08);
  ctx.lineTo(-s*.07,-s*1.08);
  ctx.closePath();

  ctx.fill();

  /* boca */

  ctx.fillStyle="#220606";

  ctx.fillRect(
    -s*.17,
    -s*.99,
    s*.34,
    s*.09
  );

  /* dentes */

  ctx.fillStyle="#eee3c5";

  for(let i=-1;i<=1;i++){

    ctx.fillRect(
      i*s*.07-s*.025,
      -s*.985,
      s*.05,
      s*.06
    );
  }

  ctx.restore();
}


/* =========================================================
   ARMA EM PRIMEIRA PESSOA
========================================================= */

function drawWeapon(){

  const w=weapons[weaponIndex];

  const scale=Math.min(W,H)/700;

  const x=W*.68;
  const base=H*.82+recoil;

  ctx.save();

  /* braço */

  ctx.fillStyle="#b78360";

  ctx.beginPath();

  ctx.roundRect(
    x-scl(35),
    base+scl(15),
    scl(80),
    scl(125),
    scl(25)
  );

  ctx.fill();

  /* corpo da arma */

  ctx.fillStyle=w.color;

  ctx.beginPath();

  ctx.roundRect(
    x,
    base,
    scl(120),
    scl(45),
    scl(8)
  );

  ctx.fill();

  /* cano */

  ctx.fillStyle="#171a1c";

  ctx.fillRect(
    x+scl(80),
    base+scl(12),
    scl(170),
    scl(18)
  );

  /* ponta */

  ctx.fillRect(
    x+scl(245),
    base+scl(7),
    scl(25),
    scl(28)
  );

  /* cabo */

  ctx.fillStyle="#242628";

  ctx.save();

  ctx.translate(
    x+scl(22),
    base+scl(40)
  );

  ctx.rotate(.28);

  ctx.fillRect(
    0,
    0,
    scl(32),
    scl(85)
  );

  ctx.restore();

  /* carregador */

  ctx.fillStyle="#17191a";

  ctx.save();

  ctx.translate(
    x+scl(60),
    base+scl(42)
  );

  ctx.rotate(.12);

  ctx.fillRect(
    0,
    0,
    scl(25),
    scl(65)
  );

  ctx.restore();

  /* detalhes */

  ctx.fillStyle="#9ca4a7";

  ctx.fillRect(
    x+scl(10),
    base+scl(8),
    scl(45),
    scl(5)
  );

  ctx.restore();
}

function scl(v){
  return v*Math.min(W,H)/700;
}


/* =========================================================
   LOOP
========================================================= */

let kills=0;
let dead=false;
let started=false;

function gameOver(){

  if(dead)return;

  dead=true;

  document.getElementById("finalKills")
    .textContent=kills;

  document.getElementById("gameover")
    .style.display="flex";
}

document.getElementById("start").onclick=()=>{

  started=true;

  document.getElementById("menu")
    .style.display="none";

  initAudio();
};


function render(){

  drawSky();
  drawGround();

  /* objetos ordenados por distância */

  const objects=[];

  for(const h of houses)
    objects.push({
      type:"house",
      obj:h,
      dist:Math.hypot(
        h.x-player.x,
        h.z-player.z
      )
    });

  for(const c of cars)
    objects.push({
      type:"car",
      obj:c,
      dist:Math.hypot(
        c.x-player.x,
        c.z-player.z
      )
    });

  for(const z of zombies)
    objects.push({
      type:"zombie",
      obj:z,
      dist:Math.hypot(
        z.x-player.x,
        z.z-player.z
      )
    });

  objects.sort((a,b)=>b.dist-a.dist);

  for(const o of objects){

    if(o.type==="house")
      drawHouse(o.obj);

    if(o.type==="car")
      drawCar(o.obj);

    if(o.type==="zombie")
      drawZombie(o.obj);
  }

  recoil*=.75;

  drawWeapon();
}


function loop(){

  requestAnimationFrame(loop);

  if(!started||dead)return;

  updatePlayer();
  updateZombies();

  if(firing)
    shoot();

  render();
}

loop();

</script>
