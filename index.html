<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEW DARK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020509;font-family:Arial}
canvas{display:block;touch-action:none}

#start{
 position:fixed;inset:0;z-index:100;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 background:radial-gradient(circle,#25334b,#020407 70%);
 color:white;text-align:center
}
#start h1{
 font-size:64px;letter-spacing:10px;
 text-shadow:0 0 25px #7da6ff,4px 4px 8px #000
}
#start p{margin:12px 0 30px;color:#bfc9d8}
#play{
 padding:16px 45px;border:2px solid white;
 border-radius:8px;background:#182c45;
 color:white;font-size:20px;font-weight:bold
}

#hud{
 position:fixed;left:12px;top:12px;z-index:20;
 color:white;font-weight:bold;text-shadow:2px 2px 5px #000
}
#lifeBox{width:190px;height:19px;border:2px solid white;background:#222}
#life{height:100%;width:100%;background:#20db58}

#weaponName{
 position:fixed;right:15px;top:15px;
 color:white;font-weight:bold;font-size:17px;
 text-shadow:2px 2px 5px #000;z-index:20
}

#cross{
 position:fixed;left:50%;top:50%;
 transform:translate(-50%,-50%);
 color:white;font-size:28px;z-index:15;
 text-shadow:0 0 6px #000
}

#scope{
 display:none;position:fixed;inset:0;z-index:16;
 pointer-events:none
}
#scope:before{
 content:"";position:absolute;inset:0;
 background:radial-gradient(circle at center,
 transparent 0 25%,rgba(0,0,0,.94) 27%);
}
#scope:after{
 content:"";position:absolute;
 left:50%;top:50%;width:2px;height:55%;
 background:#ddd;transform:translateX(-50%);
}
.scopeLine{
 position:absolute;left:22%;right:22%;top:50%;
 height:2px;background:#ddd
}

#joystick{
 position:fixed;left:22px;bottom:25px;
 width:130px;height:130px;border-radius:50%;
 border:3px solid rgba(255,255,255,.4);
 background:rgba(255,255,255,.08);z-index:30
}
#stick{
 position:absolute;left:34px;top:34px;
 width:55px;height:55px;border-radius:50%;
 background:rgba(255,255,255,.5)
}

.btn{
 position:fixed;z-index:30;
 border:2px solid white;color:white;
 border-radius:50%;font-weight:bold
}
#shoot{right:22px;bottom:25px;width:92px;height:92px;background:#941111}
#run{right:130px;bottom:38px;width:62px;height:62px;background:#303640}
#next{right:130px;bottom:110px;width:62px;height:62px;background:#263f5e}
#drive{display:none;right:130px;bottom:110px;width:70px;height:70px;background:#174e2b}

#damage{
 position:fixed;inset:0;background:#f00;opacity:0;
 pointer-events:none;z-index:14
}

#mini{
 position:fixed;right:14px;bottom:14px;
 width:150px;height:150px;
 border:3px solid white;border-radius:50%;
 background:#101923;z-index:20;overflow:hidden;
 box-shadow:0 0 12px #000
}
#mini canvas{width:100%;height:100%}

#gameover{
 position:fixed;inset:0;z-index:100;
 display:none;align-items:center;justify-content:center;
 flex-direction:column;background:rgba(0,0,0,.88);
 color:white;text-align:center
}
#gameover h2{font-size:45px;margin-bottom:15px}
#restart{padding:13px 25px;font-size:18px}
</style>
</head>

<body>

<div id="start">
 <h1>NEW DARK</h1>
 <p>ZOMBIE SURVIVAL</p>
 <button id="play">JOGAR</button>
</div>

<div id="hud">
 VIDA
 <div id="lifeBox"><div id="life"></div></div>
 🧟 <span id="kills">0</span>
</div>

<div id="weaponName">AK-47</div>
<div id="cross">+</div>

<div id="scope">
 <div class="scopeLine"></div>
</div>

<div id="damage"></div>

<div id="joystick"><div id="stick"></div></div>

<button id="shoot" class="btn">🔫<br>ATIRAR</button>
<button id="run" class="btn">🏃</button>
<button id="next" class="btn">🔄</button>
<button id="drive" class="btn">🚗</button>

<div id="mini">
 <canvas id="map"></canvas>
</div>

<div id="gameover">
 <h2>VOCÊ MORREU</h2>
 <p>Zumbis eliminados: <span id="finalKills">0</span></p>
 <br>
 <button id="restart">JOGAR NOVAMENTE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================
   CENA
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x182333);

scene.fog=new THREE.Fog(
 0x182333,
 60,
 650
);

const camera=new THREE.PerspectiveCamera(
 72,innerWidth/innerHeight,.05,1200
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* =========================
   LUZ
========================= */

scene.add(new THREE.HemisphereLight(
 0x9bb8df,
 0x24301f,
 .8
));

const moonLight=new THREE.DirectionalLight(
 0xb6cbff,1.8
);

moonLight.position.set(-150,250,-100);
moonLight.castShadow=true;
moonLight.shadow.mapSize.width=2048;
moonLight.shadow.mapSize.height=2048;

scene.add(moonLight);

/* LUA */

const moon=new THREE.Mesh(
 new THREE.SphereGeometry(22,32,32),
 new THREE.MeshBasicMaterial({color:0xfff1bd})
);

moon.position.set(-250,280,-420);
scene.add(moon);

/* =========================
   CHÃO
========================= */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(2000,2000),
 new THREE.MeshStandardMaterial({
  color:0x314a35,
  roughness:1
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* =========================
   ESTRADAS
========================= */

function road(x,z,w,d){

 const r=new THREE.Mesh(
  new THREE.BoxGeometry(w,.06,d),
  new THREE.MeshStandardMaterial({
   color:0x3b3e43,
   roughness:.9
  })
 );

 r.position.set(x,.04,z);
 scene.add(r);

 if(w>d){

  for(let i=-450;i<450;i+=24){

   const s=new THREE.Mesh(
    new THREE.BoxGeometry(9,.08,.32),
    new THREE.MeshBasicMaterial({
     color:0xe2d36c
    })
   );

   s.position.set(x+i,.09,z);
   scene.add(s);
  }

 }else{

  for(let i=-450;i<450;i+=24){

   const s=new THREE.Mesh(
    new THREE.BoxGeometry(.32,.08,9),
    new THREE.MeshBasicMaterial({
     color:0xe2d36c
    })
   );

   s.position.set(x,.09,z+i);
   scene.add(s);
  }
 }
}

road(0,0,48,1000);
road(0,0,1000,48);

/* =========================
   COLISÕES
========================= */

const colliders=[];

function collider(x,z,w,d){
 colliders.push({x,z,w,d});
}

function blocked(x,z){

 const r=.65;

 return colliders.some(c=>
  x>c.x-c.w/2-r &&
  x<c.x+c.w/2+r &&
  z>c.z-c.d/2-r &&
  z<c.z+c.d/2+r
 );
}

/* =========================
   CASAS
========================= */

function house(x,z,w,d,h){

 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:0x806553,
   roughness:.9
  })
 );

 body.position.y=h/2;
 body.castShadow=true;
 body.receiveShadow=true;
 g.add(body);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(
   Math.max(w,d)*.72,5,4
  ),
  new THREE.MeshStandardMaterial({
   color:0x292a2c,
   roughness:.8
  })
 );

 roof.rotation.y=Math.PI/4;
 roof.position.y=h+2.5;
 roof.castShadow=true;
 g.add(roof);

 const door=new THREE.Mesh(
  new THREE.BoxGeometry(1.5,2.8,.12),
  new THREE.MeshStandardMaterial({
   color:0x241813
  })
 );

 door.position.set(0,1.4,d/2+.08);
 g.add(door);

 for(const xx of [-w*.3,w*.3]){

  const win=new THREE.Mesh(
   new THREE.BoxGeometry(1.5,1.2,.08),
   new THREE.MeshBasicMaterial({
    color:0xe1b84f
   })
  );

  win.position.set(
   xx,h*.62,d/2+.08
  );

  g.add(win);
 }

 g.position.set(x,0,z);
 scene.add(g);

 collider(x,z,w,d);
}

house(-65,-75,30,27,15);
house(65,-75,32,28,17);
house(-70,75,34,28,16);
house(70,75,30,30,18);
house(-150,-115,42,35,22);
house(150,-120,42,35,25);
house(-150,125,45,38,23);
house(150,125,45,38,28);

/* =========================
   PRÉDIOS
========================= */

function building(x,z,w,d,h){

 const b=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({
   color:0x5c6064,
   roughness:.8
  })
 );

 b.position.set(x,h/2,z);
 b.castShadow=true;
 b.receiveShadow=true;

 scene.add(b);
 collider(x,z,w,d);

 for(let y=5;y<h-1;y+=5){

  for(let xx=-w/2+3;xx<w/2-2;xx+=5){

   const win=new THREE.Mesh(
    new THREE.BoxGeometry(2,2.3,.08),
    new THREE.MeshBasicMaterial({
     color:Math.random()>.45
      ?0xd0ac58
      :0x172431
    })
   );

   win.position.set(
    x+xx,y,z-d/2-.06
   );

   scene.add(win);
  }
 }
}

building(-225,-70,55,45,38);
building(225,-75,60,48,45);
building(-225,80,50,50,42);
building(225,85,55,45,50);

/* =========================
   POSTES
========================= */

function lamp(x,z){

 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.17,7,8),
  new THREE.MeshStandardMaterial({
   color:0x272b2e,
   metalness:.7
  })
 );

 pole.position.set(x,3.5,z);
 pole.castShadow=true;
 scene.add(pole);

 const light=new THREE.PointLight(
  0xffd98a,2.5,30
 );

 light.position.set(x,7,z);
 scene.add(light);
}

for(let i=-400;i<=400;i+=45){
 lamp(i,-30);
 lamp(i,30);
}

/* =========================
   CARROS
========================= */

const cars=[];

function car(x,z,color){

 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(4.8,1.35,8),
  new THREE.MeshStandardMaterial({
   color,
   metalness:.25,
   roughness:.4
  })
 );

 body.position.y=1.2;
 body.castShadow=true;
 g.add(body);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(4,1.2,4),
  new THREE.MeshStandardMaterial({
   color:0x171b20,
   roughness:.3
  })
 );

 roof.position.y=2.25;
 g.add(roof);

 const wheelGeo=new THREE.CylinderGeometry(
  .82,.82,.55,16
 );

 for(const p of [
  [-2.4,.8,-2.6],
  [2.4,.8,-2.6],
  [-2.4,.8,2.6],
  [2.4,.8,2.6]
 ]){

  const w=new THREE.Mesh(
   wheelGeo,
   new THREE.MeshStandardMaterial({
    color:0x080808
   })
  );

  w.rotation.z=Math.PI/2;
  w.position.set(...p);
  w.castShadow=true;

  g.add(w);
 }

 g.position.set(x,0,z);
 g.rotation.y=Math.random()*Math.PI;

 scene.add(g);

 cars.push({
  mesh:g,
  speed:0,
  occupied:false
 });

 collider(x,z,5.5,9);
}

car(-18,-58,0x982525);
car(18,-58,0x28518e);
car(-18,58,0x777777);
car(18,58,0xb28a27);

/* =========================
   ZUMBIS
========================= */

const zombies=[];

function zombie(x,z){

 const g=new THREE.Group();

 const skin=new THREE.MeshStandardMaterial({
  color:0x71806a,
  roughness:1
 });

 const clothes=new THREE.MeshStandardMaterial({
  color:0x3f5540,
  roughness:.9
 });

 /* pernas */

 for(const xx of [-.24,.24]){

  const leg=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .12,.17,1.8,9
   ),
   clothes
  );

  leg.position.set(xx,.9,0);
  g.add(leg);
 }

 /* corpo magro */

 const body=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .33,.48,1.9,12
  ),
  clothes
 );

 body.position.y=2.1;
 body.castShadow=true;
 g.add(body);

 /* pescoço */

 const neck=new THREE.Mesh(
  new THREE.CylinderGeometry(
   .15,.18,.35,8
  ),
  skin
 );

 neck.position.y=3.2;
 g.add(neck);

 /* cabeça */

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(
   .55,16,16
  ),
  skin
 );

 head.position.y=3.75;
 head.castShadow=true;
 g.add(head);

 /* olhos vermelhos */

 const eyeMat=new THREE.MeshBasicMaterial({
  color:0xff0808
 });

 for(const xx of [-.18,.18]){

  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(
    .075,10,10
   ),
   eyeMat
  );

  eye.position.set(
   xx,3.83,-.5
  );

  g.add(eye);
 }

 /* boca */

 const mouth=new THREE.Mesh(
  new THREE.BoxGeometry(
   .38,.12,.05
  ),
  new THREE.MeshBasicMaterial({
   color:0x120909
  })
 );

 mouth.position.set(
  0,3.58,-.5
 );

 g.add(mouth);

 /* braços */

 for(const xx of [-.62,.62]){

  const arm=new THREE.Mesh(
   new THREE.CylinderGeometry(
    .11,.16,1.8,9
   ),
   clothes
  );

  arm.position.set(
   xx,2.15,0
  );

  arm.rotation.z=
   xx<0 ? -.3 : .3;

  g.add(arm);
 }

 g.position.set(x,0,z);

 scene.add(g);

 zombies.push({
  mesh:g,
  hp:3,
  speed:.018+Math.random()*.018,
  attack:0,
  walk:Math.random()*10
 });
}

for(let i=0;i<45;i++){

 const a=Math.random()*Math.PI*2;
 const d=110+Math.random()*450;

 zombie(
  Math.sin(a)*d,
  Math.cos(a)*d
 );
}

/* =========================
   JOGADOR
========================= */

const player={
 x:0,
 y:1.7,
 z:0,
 angle:0,
 pitch:0,
 health:100
};

camera.position.set(
 player.x,
 player.y,
 player.z
);

/* =========================
   ARMAS
========================= */

const weapons=[
 "AK-47",
 "UMP",
 "SCAR",
 "DESERT EAGLE",
 "SNIPER"
];

let weaponIndex=0;
let sniper=false;

const weaponGroup=new THREE.Group();

const gunMat=new THREE.MeshStandardMaterial({
 color:0x202328,
 metalness:.8,
 roughness:.25
});

/* corpo da arma */

const gun=new THREE.Mesh(
 new THREE.CapsuleGeometry(
  .25,1.1,8,16
 ),
 gunMat
);

gun.rotation.x=Math.PI/2;
gun.position.set(.43,-.38,-1);
weaponGroup.add(gun);

/* cano */

const barrel=new THREE.Mesh(
 new THREE.CylinderGeometry(
  .08,.11,1.8,16
 ),
 gunMat
);

barrel.rotation.x=Math.PI/2;
barrel.position.set(
 .43,-.37,-2
);

weaponGroup.add(barrel);

/* cabo */

const grip=new THREE.Mesh(
 new THREE.BoxGeometry(
  .27,.65,.35
 ),
 gunMat
);

grip.rotation.x=.25;
grip.position.set(
 .43,-.85,-.65
);

weaponGroup.add(grip);

camera.add(weaponGroup);
scene.add(camera);

/* =========================
   LANTERNA
========================= */

const flashlight=new THREE.SpotLight(
 0xffffff,
 6,
 100,
 Math.PI/7,
 .35,
 1
);

flashlight.position.set(
 0,-.1,-.4
);

camera.add(flashlight);

const target=new THREE.Object3D();
target.position.set(0,0,-30);
camera.add(target);

flashlight.target=target;

/* =========================
   MOVIMENTO
========================= */

let joyX=0;
let joyY=0;
let running=false;

const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyActive=false;

joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 joystick(e);
});

joy.addEventListener("pointermove",e=>{
 if(joyActive)joystick(e);
});

joy.addEventListener("pointerup",()=>{
 joyActive=false;
 joyX=0;
 joyY=0;
 stick.style.left="34px";
 stick.style.top="34px";
});

function joystick(e){

 const r=joy.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const max=43;
 const d=Math.hypot(dx,dy);

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.left=(34+dx)+"px";
 stick.style.top=(34+dy)+"px";
}

/* correr */

document.getElementById("run")
.addEventListener("pointerdown",()=>{
 running=true;
});

document.getElementById("run")
.addEventListener("pointerup",()=>{
 running=false;
});

/* =========================
   OLHAR
========================= */

let look=false;
let lx=0;
let ly=0;

renderer.domElement.addEventListener(
 "pointerdown",e=>{
  look=true;
  lx=e.clientX;
  ly=e.clientY;
 }
);

renderer.domElement.addEventListener(
 "pointermove",e=>{

  if(!look)return;

  const dx=e.clientX-lx;
  const dy=e.clientY-ly;

  lx=e.clientX;
  ly=e.clientY;

  player.angle-=dx*.004;
  player.pitch-=dy*.003;

  player.pitch=
   Math.max(-1.15,
   Math.min(1.15,player.pitch));
 }
);

renderer.domElement.addEventListener(
 "pointerup",()=>{
  look=false;
 }
);

/* =========================
   MOVIMENTO DO JOGADOR
========================= */

function updatePlayer(){

 let forward=-joyY;
 let side=joyX;

 const speed=
  running ? .20 : .12;

 const fx=-Math.sin(player.angle);
 const fz=-Math.cos(player.angle);

 const rx=Math.cos(player.angle);
 const rz=-Math.sin(player.angle);

 const nx=
  player.x+
  (fx*forward+rx*side)*speed;

 const nz=
  player.z+
  (fz*forward+rz*side)*speed;

 if(!blocked(nx,player.z))
  player.x=nx;

 if(!blocked(player.x,nz))
  player.z=nz;

 camera.position.set(
  player.x,
  player.y,
  player.z
 );

 camera.rotation.order="YXZ";
 camera.rotation.y=player.angle;
 camera.rotation.x=player.pitch;
}

/* =========================
   TIRO
========================= */

const bullets=[];
let shooting=false;
let lastShot=0;

function shoot(){

 if(gameEnded)return;

 const now=performance.now();

 const delay=sniper?500:170;

 if(now-lastShot<delay)return;

 lastShot=now;

 weaponGroup.position.z=.12;

 setTimeout(()=>{
  weaponGroup.position.z=0;
 },70);

 const dir=new THREE.Vector3();

 camera.getWorldDirection(dir);

 bullets.push({
  pos:camera.position.clone(),
  dir,
  life:0,
  damage:sniper?5:1
 });

 const flash=new THREE.PointLight(
  0xffaa55,8,10
 );

 flash.position.set(
  .43,-.36,-2.6
 );

 weaponGroup.add(flash);

 setTimeout(()=>{
  weaponGroup.remove(flash);
 },50);
}

document.getElementById("shoot")
.addEventListener("pointerdown",()=>{
 shooting=true;
});

document.getElementById("shoot")
.addEventListener("pointerup",()=>{
 shooting=false;
});

/* =========================
   TROCA DE ARMAS
========================= */

document.getElementById("next")
.addEventListener("click",()=>{

 weaponIndex=
  (weaponIndex+1)%weapons.length;

 sniper=
  weapons[weaponIndex]==="SNIPER";

 document.getElementById(
  "weaponName"
 ).textContent=
  weapons[weaponIndex];

 document.getElementById(
  "scope"
 ).style.display=
  sniper?"block":"none";

 document.getElementById(
  "cross"
 ).style.display=
  sniper?"none":"block";
});

/* =========================
   BALAS
========================= */

function updateBullets(){

 for(let i=bullets.length-1;i>=0;i--){

  const b=bullets[i];

  b.pos.addScaledVector(
   b.dir,
   sniper?.75:.9
  );

  b.life++;

  let hit=false;

  for(let j=zombies.length-1;j>=0;j--){

   const z=zombies[j];

   const dist=
    b.pos.distanceTo(
     z.mesh.position
    );

   if(dist<2.4){

    z.hp-=b.damage;
    hit=true;

    if(z.hp<=0){

     scene.remove(z.mesh);
     zombies.splice(j,1);

     kills++;

     document.getElementById(
      "kills"
     ).textContent=kills;
    }

    break;
   }
  }

  if(hit||b.life>100)
   bullets.splice(i,1);
 }
}

/* =========================
   ZUMBIS PERSEGUINDO
========================= */

function updateZombies(){

 for(const z of zombies){

  const dx=
   player.x-z.mesh.position.x;

  const dz=
   player.z-z.mesh.position.z;

  const distance=
   Math.hypot(dx,dz);

  if(distance>2.5){

   z.mesh.position.x+=
    dx/distance*z.speed;

   z.mesh.position.z+=
    dz/distance*z.speed;

   z.mesh.lookAt(
    player.x,
    1.7,
    player.z
   );

   /* movimento de caminhada */

   z.walk+=.15;

   z.mesh.position.y=
    Math.sin(z.walk)*.025;

  }else{

   z.attack++;

   if(z.attack>35){

    player.health-=6;
    z.attack=0;

    damage();

    if(player.health<=0)
     endGame();
   }
  }
 }
}

/* =========================
   DANO
========================= */

function damage(){

 const d=document.getElementById(
  "damage"
 );

 d.style.opacity=.75;

 setTimeout(()=>{
  d.style.opacity=0;
 },140);

 document.getElementById(
  "life"
 ).style.width=
 Math.max(0,player.health)+"%";
}

/* =========================
   MINIMAPA
========================= */

const mapCanvas=
 document.getElementById("map");

const mapCtx=
 mapCanvas.getContext("2d");

mapCanvas.width=300;
mapCanvas.height=300;

function miniMap(){

 mapCtx.clearRect(
  0,0,300,300
 );

 mapCtx.fillStyle="#152018";
 mapCtx.fillRect(0,0,300,300);

 const scale=.22;
 const cx=150;
 const cy=150;

 /* ruas */

 mapCtx.strokeStyle="#555";
 mapCtx.lineWidth=12;

 mapCtx.beginPath();
 mapCtx.moveTo(cx,0);
 mapCtx.lineTo(cx,300);
 mapCtx.stroke();

 mapCtx.beginPath();
 mapCtx.moveTo(0,cy);
 mapCtx.lineTo(300,cy);
 mapCtx.stroke();

 /* casas */

 mapCtx.fillStyle="#806553";

 for(const c of colliders){

  const x=
   cx+(c.x-player.x)*scale;

  const y=
   cy+(c.z-player.z)*scale;

  if(
   x>-20&&x<320&&
   y>-20&&y<320
  ){

   mapCtx.fillRect(
    x-c.w*scale/2,
    y-c.d*scale/2,
    c.w*scale,
    c.d*scale
   );
  }
 }

 /* zumbis */

 mapCtx.fillStyle="#f22";

 for(const z of zombies){

  const x=
   cx+(z.mesh.position.x-player.x)*scale;

  const y=
   cy+(z.mesh.position.z-player.z)*scale;

  if(
   x>0&&x<300&&
   y>0&&y<300
  ){

   mapCtx.beginPath();
   mapCtx.arc(x,y,4,0,Math.PI*2);
   mapCtx.fill();
  }
 }

 /* jogador */

 mapCtx.save();

 mapCtx.translate(cx,cy);
 mapCtx.rotate(player.angle);

 mapCtx.fillStyle="#36ff66";

 mapCtx.beginPath();
 mapCtx.moveTo(0,-10);
 mapCtx.lineTo(7,8);
 mapCtx.lineTo(-7,8);
 mapCtx.closePath();
 mapCtx.fill();

 mapCtx.restore();
}

/* =========================
   GAME OVER
========================= */

let kills=0;
let gameEnded=false;

function endGame(){

 if(gameEnded)return;

 gameEnded=true;

 document.getElementById(
  "finalKills"
 ).textContent=kills;

 document.getElementById(
  "gameover"
 ).style.display="flex";
}

document.getElementById(
 "restart"
).onclick=()=>{
 location.reload();
};

/* =========================
   INÍCIO
========================= */

document.getElementById(
 "play"
).onclick=()=>{

 document.getElementById(
  "start"
 ).style.display="none";

};

/* =========================
   LOOP
========================= */

function animate(){

 requestAnimationFrame(
  animate
 );

 if(gameEnded)return;

 updatePlayer();
 updateBullets();
 updateZombies();
 miniMap();

 if(shooting)
  shoot();

 renderer.render(
  scene,
  camera
 );
}

animate();

/* =========================
   RESIZE
========================= */

addEventListener("resize",()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );
});

</script>
