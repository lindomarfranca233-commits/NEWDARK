<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEWDARK - Zombie Survival</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050606;font-family:Arial}
canvas{display:block;touch-action:none}

#menu{
position:fixed;inset:0;z-index:20;
display:flex;align-items:center;justify-content:center;
background:radial-gradient(circle,#202722,#020303 75%);
color:white;text-align:center
}

.box{
width:88%;max-width:420px;
padding:30px 20px;
background:#090b0bee;
border:1px solid #ffffff22;
border-radius:22px;
box-shadow:0 0 50px #000
}

.logo{
font-size:42px;
font-weight:900;
letter-spacing:5px;
margin-bottom:5px
}

.logo span{color:#c82d35}

.sub{color:#aaa;margin-bottom:25px}

button{
border:0;
border-radius:14px;
padding:16px 28px;
font-size:18px;
font-weight:bold;
background:#c82d35;
color:white
}

#hud{
position:fixed;
inset:0;
z-index:5;
pointer-events:none;
color:white;
text-shadow:2px 2px 5px #000
}

#status{
position:absolute;
top:12px;
left:12px;
background:#0009;
padding:10px;
border-radius:10px;
font-weight:bold
}

#healthBack{
width:170px;
height:11px;
background:#421418;
border-radius:10px;
margin-top:5px;
overflow:hidden
}

#health{
height:100%;
width:100%;
background:#d8323d
}

#ammo{
position:absolute;
right:15px;
top:12px;
font-size:27px;
font-weight:bold
}

#weapon{
position:absolute;
right:15px;
top:48px;
font-size:15px
}

#score{
position:absolute;
top:78px;
right:15px;
font-size:15px
}

#wave{
position:absolute;
top:100px;
right:15px;
font-size:15px
}

#cross{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:25px;
font-weight:bold
}

#damage{
position:absolute;
inset:0;
background:#b0000025;
opacity:0;
transition:.08s
}

#joy{
position:fixed;
left:18px;
bottom:22px;
width:135px;
height:135px;
border:2px solid #ffffff25;
background:#ffffff09;
border-radius:50%;
pointer-events:auto
}

#stick{
position:absolute;
left:50%;
top:50%;
width:58px;
height:58px;
border-radius:50%;
background:#ffffff30;
transform:translate(-50%,-50%)
}

.action{
position:fixed;
pointer-events:auto;
border-radius:50%;
padding:0;
display:flex;
align-items:center;
justify-content:center
}

#fire{
right:20px;
bottom:28px;
width:95px;
height:95px;
background:#a92b34cc
}

#reload{
right:130px;
bottom:42px;
width:65px;
height:65px;
background:#555c
}

#swap{
right:130px;
bottom:120px;
width:65px;
height:65px;
background:#333c
}

#hint{
position:absolute;
bottom:8px;
left:50%;
transform:translateX(-50%);
font-size:11px;
color:#aaa
}
</style>
</head>

<body>

<div id="menu">
<div class="box">
<div class="logo">NEW<span>DARK</span></div>
<div class="sub">ZOMBIE SURVIVAL • 3D</div>
<p>Sobreviva às ondas de zumbis.</p>
<button id="start">JOGAR</button>
</div>
</div>

<div id="damage"></div>

<div id="hud">

<div id="status">
❤️ <span id="hp">100</span>
<div id="healthBack"><div id="health"></div></div>
</div>

<div id="ammo">12 / 60</div>
<div id="weapon">PISTOLA</div>
<div id="score">Abates: 0</div>
<div id="wave">Onda: 1</div>
<div id="cross">+</div>

<div id="joy">
<div id="stick"></div>
</div>

<button class="action" id="reload">↻</button>
<button class="action" id="swap">🔫</button>
<button class="action" id="fire">●</button>

<div id="hint">Use o lado direito para olhar</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer,clock;

let player;
let zombies=[];
let particles=[];
let obstacles=[];

let hp=100;
let score=0;
let wave=1;

let weaponIndex=0;
let reloading=false;

let moveX=0;
let moveY=0;

let yaw=0;
let pitch=0;

let lookActive=false;
let lastLookX=0;
let lastLookY=0;

const weapons=[

{
name:"PISTOLA",
mag:12,
ammo:12,
reserve:60,
damage:2,
fireDelay:.28,
color:0x222222
},

{
name:"RIFLE",
mag:30,
ammo:30,
reserve:120,
damage:3,
fireDelay:.12,
color:0x111111
},

{
name:"ESPINGARDA",
mag:6,
ammo:6,
reserve:36,
damage:6,
fireDelay:.65,
color:0x332722
}

];

let weapon=weapons[0];

const audio=new (window.AudioContext||window.webkitAudioContext)();

function som(freq,duration,type="square",volume=.04){

try{

let osc=audio.createOscillator();
let gain=audio.createGain();

osc.type=type;
osc.frequency.value=freq;

gain.gain.setValueAtTime(volume,audio.currentTime);
gain.gain.exponentialRampToValueAtTime(
.001,
audio.currentTime+duration
);

osc.connect(gain);
gain.connect(audio.destination);

osc.start();
osc.stop(audio.currentTime+duration);

}catch(e){}

}

function tiroSom(){

som(90,.08,"sawtooth",.09);
setTimeout(()=>som(55,.12,"square",.04),25);

}

function recargaSom(){

som(180,.07,"square",.03);

setTimeout(()=>som(240,.07,"square",.03),140);

setTimeout(()=>som(130,.1,"square",.03),300);

}

function pegarArmaSom(){

som(500,.08,"sine",.04);
setTimeout(()=>som(750,.1,"sine",.03),80);

}

function morteSom(){

som(100,.25,"sawtooth",.05);
setTimeout(()=>som(55,.35,"sawtooth",.03),100);

}

function iniciar(){

if(audio.state==="suspended")audio.resume();

scene=new THREE.Scene();

scene.background=new THREE.Color(0x080b0c);
scene.fog=new THREE.Fog(0x080b0c,18,90);

camera=new THREE.PerspectiveCamera(
72,
innerWidth/innerHeight,
.05,
200
);

camera.position.set(0,1.7,10);

renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

document.body.appendChild(renderer.domElement);

clock=new THREE.Clock();

criarLuzes();
criarMapa();
criarArma();

for(let i=0;i<6;i++)criarZombie();

player={
speed:5.5
};

hp=100;
score=0;
wave=1;

weaponIndex=0;
weapon=weapons[0];

weapon.ammo=weapon.mag;
weapon.reserve=60;

reloading=false;

document.getElementById("menu").style.display="none";

atualizarHUD();

loop();

}

function criarLuzes(){

let hemi=new THREE.HemisphereLight(
0x9db5d0,
0x090909,
1.5
);

scene.add(hemi);

let moon=new THREE.DirectionalLight(
0xbac9ff,
1.5
);

moon.position.set(30,50,10);

scene.add(moon);

}

function criarMapa(){

let floor=new THREE.Mesh(
new THREE.PlaneGeometry(180,180),
new THREE.MeshStandardMaterial({
color:0x1c211f,
roughness:1
})
);

floor.rotation.x=-Math.PI/2;

scene.add(floor);

let grid=new THREE.GridHelper(
180,90,
0x303834,
0x202522
);

scene.add(grid);

for(let i=0;i<35;i++){

let w=3+Math.random()*7;
let h=2+Math.random()*7;
let d=3+Math.random()*7;

let mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color:0x303432,
roughness:.95
})
);

let x=(Math.random()-.5)*120;
let z=(Math.random()-.5)*120;

if(Math.hypot(x,z)<15){
i--;
continue;
}

mesh.position.set(x,h/2,z);

scene.add(mesh);

obstacles.push({
x:x,
z:z,
w:w,
d:d
});

}

}

function criarArma(){

if(camera.getObjectByName("ARMA"))
camera.remove(camera.getObjectByName("ARMA"));

let group=new THREE.Group();

group.name="ARMA";

let corpo=new THREE.Mesh(
new THREE.BoxGeometry(.2,.25,.85),
new THREE.MeshStandardMaterial({
color:weapon.color,
metalness:.7,
roughness:.3
})
);

corpo.position.set(.38,-.28,-.72);

group.add(corpo);

let cano=new THREE.Mesh(
new THREE.BoxGeometry(.08,.08,.55),
new THREE.MeshStandardMaterial({
color:0x050505,
metalness:.9
})
);

cano.position.set(.38,-.27,-1.2);

group.add(cano);

if(weaponIndex===1){

let mira=new THREE.Mesh(
new THREE.BoxGeometry(.08,.08,.25),
new THREE.MeshStandardMaterial({
color:0x050505
})
);

mira.position.set(.38,-.12,-.65);

group.add(mira);

}

if(weaponIndex===2){

corpo.scale.set(1.3,1.1,1.3);

}

camera.add(group);

scene.add(camera);

pegarArmaSom();

}

function criarZombie(){

let zombie=new THREE.Group();

let skin=[
0x526052,
0x68715e,
0x454d45,
0x77705f
][Math.floor(Math.random()*4)];

let body=new THREE.Mesh(
new THREE.CapsuleGeometry(.42,.9,6,10),
new THREE.MeshStandardMaterial({
color:skin,
roughness:1
})
);

body.position.y=.8;

zombie.add(body);

let head=new THREE.Mesh(
new THREE.SphereGeometry(.4,12,10),
new THREE.MeshStandardMaterial({
color:skin,
roughness:1
})
);

head.position.y=1.58;

zombie.add(head);

let eyeMaterial=new THREE.MeshBasicMaterial({
color:0xff2020
});

let e1=new THREE.Mesh(
new THREE.SphereGeometry(.045,6,6),
eyeMaterial
);

let e2=e1.clone();

e1.position.set(-.14,1.63,-.34);
e2.position.set(.14,1.63,-.34);

zombie.add(e1);
zombie.add(e2);

let angle=Math.random()*Math.PI*2;
let dist=28+Math.random()*35;

zombie.position.set(
camera.position.x+Math.cos(angle)*dist,
0,
camera.position.z+Math.sin(angle)*dist
);

zombie.userData={
hp:3+Math.floor(wave*.5),
speed:1.1+Math.random()*1.2+wave*.08,
attack:0
};

scene.add(zombie);
zombies.push(zombie);

}

function sangue(pos){

for(let i=0;i<10;i++){

let p=new THREE.Mesh(
new THREE.SphereGeometry(.035+Math.random()*.04,5,5),
new THREE.MeshBasicMaterial({
color:0x9e1118
})
);

p.position.copy(pos);

p.userData={
life:.4+Math.random()*.4,
vx:(Math.random()-.5)*3,
vy:Math.random()*3,
vz:(Math.random()-.5)*3
};

scene.add(p);
particles.push(p);

}

}

function atirar(){

if(!player||reloading)return;

if(weapon.ammo<=0){

recarregar();
return;

}

weapon.ammo--;

tiroSom();

camera.position.y+=.025;

setTimeout(()=>{
if(camera)camera.position.y=1.7;
},50);

let ray=new THREE.Raycaster();

ray.setFromCamera(
new THREE.Vector2(0,0),
camera
);

let meshes=[];

for(let z of zombies){

z.traverse(o=>{
if(o.isMesh)meshes.push(o);
});

}

let hits=ray.intersectObjects(meshes,false);

if(hits.length){

let obj=hits[0].object;

while(obj.parent && !zombies.includes(obj)){
obj=obj.parent;
}

if(zombies.includes(obj)){

let hitPoint=hits[0].point;

sangue(hitPoint);

obj.userData.hp-=weapon.damage;

if(obj.userData.hp<=0){

morteSom();

sangue(obj.position.clone().add(
new THREE.Vector3(0,1,0)
));

scene.remove(obj);

zombies=zombies.filter(z=>z!==obj);

score++;

if(score%10===0){
wave++;
}

}

}

}

}

function recarregar(){

if(reloading)return;
if(weapon.ammo>=weapon.mag)return;
if(weapon.reserve<=0)return;

reloading=true;

recarregaSom();

setTimeout(()=>{

let need=weapon.mag-weapon.ammo;

let take=Math.min(
need,
weapon.reserve
);

weapon.ammo+=take;
weapon.reserve-=take;

reloading=false;

atualizarHUD();

},1000);

}

function trocarArma(){

if(reloading)return;

weaponIndex++;

if(weaponIndex>=weapons.length)
weaponIndex=0;

weapon=weapons[weaponIndex];

criarArma();

atualizarHUD();

}

function atualizarHUD(){

document.getElementById("hp").textContent=
Math.max(0,Math.floor(hp));

document.getElementById("health").style.width=
Math.max(0,hp)+"%";

document.getElementById("ammo").textContent=
reloading
?"RECARREGANDO..."
:weapon.ammo+" / "+weapon.reserve;

document.getElementById("weapon").textContent=
weapon.name;

document.getElementById("score").textContent=
"Abates: "+score;

document.getElementById("wave").textContent=
"Onda: "+wave;

}

function atualizar(dt){

if(!player)return;

camera.position.x+=
moveX*player.speed*dt;

camera.position.z+=
moveY*player.speed*dt;

for(let z of zombies){

let dx=camera.position.x-z.position.x;
let dz=camera.position.z-z.position.z;

let dist=Math.hypot(dx,dz);

if(dist>1.5){

z.position.x+=dx/dist*z.userData.speed*dt;
z.position.z+=dz/dist*z.userData.speed*dt;

}else{

z.userData.attack-=dt;

if(z.userData.attack<=0){

hp-=8;

z.userData.attack=.8;

document.getElementById("damage").style.opacity=1;

setTimeout(()=>{
document.getElementById("damage").style.opacity=0;
},100);

if(hp<=0){

hp=0;
fim();

}

}

}

z.lookAt(
camera.position.x,
z.position.y,
camera.position.z
);

}

if(zombies.length<4+wave*2){

criarZombie();

}

for(let i=particles.length-1;i>=0;i--){

let p=particles[i];

p.userData.life-=dt;

p.position.x+=p.userData.vx*dt;
p.position.y+=p.userData.vy*dt;
p.position.z+=p.userData.vz*dt;

p.userData.vy-=7*dt;

if(p.userData.life<=0){

scene.remove(p);
particles.splice(i,1);

}

}

atualizarHUD();

}

function fim(){

document.getElementById("menu").style.display="flex";

document.querySelector(".box").innerHTML=
`
<div class="logo">NEW<span>DARK</span></div>
<h2>VOCÊ MORREU</h2>
<p>Abates: ${score}</p>
<p>Onda alcançada: ${wave}</p>
<button onclick="location.reload()">JOGAR NOVAMENTE</button>
`;

}

function loop(){

requestAnimationFrame(loop);

let dt=Math.min(
clock.getDelta(),
.05
);

atualizar(dt);

if(renderer&&scene&&camera)
renderer.render(scene,camera);

}

document.getElementById("start").onclick=iniciar;

document.getElementById("fire").addEventListener(
"pointerdown",
e=>{
e.preventDefault();
atirar();
}
);

document.getElementById("reload").onclick=recarregar;

document.getElementById("swap").onclick=trocarArma;


/* JOYSTICK */

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

let joyActive=false;

joy.addEventListener("pointerdown",e=>{

joyActive=true;

joy.setPointerCapture(e.pointerId);

moveJoystick(e);

});

joy.addEventListener("pointermove",e=>{

if(joyActive)
moveJoystick(e);

});

joy.addEventListener("pointerup",()=>{

joyActive=false;

moveX=0;
moveY=0;

stick.style.transform=
"translate(-50%,-50%)";

});

function moveJoystick(e){

let r=joy.getBoundingClientRect();

let x=e.clientX-(r.left+r.width/2);
let y=e.clientY-(r.top+r.height/2);

let limit=43;

let d=Math.hypot(x,y);

if(d>limit){

x=x/d*limit;
y=y/d*limit;

}

moveX=x/limit;
moveY=y/limit;

stick.style.transform=
`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;

}


/* OLHAR */

document.addEventListener("pointerdown",e=>{

if(!player)return;

if(e.clientX<170)return;
if(e.clientX>innerWidth-125)return;

lookActive=true;

lastLookX=e.clientX;
lastLookY=e.clientY;

});

document.addEventListener("pointermove",e=>{

if(!lookActive||!player)return;

let dx=e.clientX-lastLookX;
let dy=e.clientY-lastLookY;

lastLookX=e.clientX;
lastLookY=e.clientY;

yaw-=dx*.006;
pitch-=dy*.006;

pitch=Math.max(-1.2,Math.min(1.2,pitch));

camera.rotation.order="YXZ";

camera.rotation.y=yaw;
camera.rotation.x=pitch;

});

document.addEventListener("pointerup",()=>{
lookActive=false;
});


addEventListener("resize",()=>{

if(!camera||!renderer)return;

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

});

</script>

</body>
</html>
